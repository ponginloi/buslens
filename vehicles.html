    <style>
        /* ===== 全局 ===== */
        * {

            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        .navbar .brand {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: white;
        }
        .navbar .brand span {
            font-size: 22px;
        }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-wrap: wrap;
        }
        .navbar .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            transition: all 0.2s;
        }
        .navbar .nav-links a:hover {

        }
        .navbar .nav-links a.active {

        }
        .navbar .nav-links .user-name {

        }
        .navbar .nav-links .btn-logout {

            border-radius: 6px;

            transition: background 0.2s;
        }
        .navbar .nav-links .btn-logout:hover {
            background: rgba(255, 255, 255, 0.25);

        .page-header {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .page-header .title-section h1 {

        }
        .page-header .title-section p {
            color: #888;
            font-size: 13px;
            margin-top: 2px;
        }

        /* ===== 快速上传工具栏 ===== */
        .upload-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: white;
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 2px solid #e8ecf0;
            margin-bottom: 6px;
        }
        .upload-toolbar .toolbar-label {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin-bottom: 4px;
        }
        .upload-toolbar .toolbar-label .line {
            flex: 1;
            height: 1px;
            background: #e8ecf0;
        }
        .upload-toolbar .btn-upload {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: center;
            min-width: 80px;
        }
        .upload-toolbar .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }
        .upload-toolbar .btn-upload .icon {
            font-size: 18px;
        }

        .upload-toolbar .btn-upload.primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        .upload-toolbar .btn-upload.primary .badge-new {
            background: #ffd700;
            color: #333;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 8px;
            margin-left: 2px;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 2px 12px rgba(238, 90, 36, 0.3); }
            50% { box-shadow: 0 2px 20px rgba(238, 90, 36, 0.5); }
        }

        .upload-toolbar .btn-upload.region {
            background: #2196f3;
            color: white;
        }
        .upload-toolbar .btn-upload.company {
            background: #ff9800;
            color: white;
        }
        .upload-toolbar .btn-upload.route {
            background: #9c27b0;
            color: white;
        }
        .upload-toolbar .btn-upload.refresh {
            background: #f5f7fa;
            color: #666;
            border: 2px solid #e0e0e0;
            flex: 0.5;
            min-width: 60px;
        }
        .upload-toolbar .btn-upload.refresh:hover {
            background: #e8ecf0;
            border-color: #1a73e8;
        }

        /* ===== Tab 切换 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            background: white;
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }
        .tabs .tab {
            padding: 10px 24px;
            border: none;
            background: transparent;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tabs .tab:hover {
            background: #f0f2f5;
            color: #333;
        }
        .tabs .tab.active {
            background: #1a73e8;
            color: white;
        }
        .tabs .tab .count {
            font-size: 11px;
            font-weight: 400;
            background: rgba(0, 0, 0, 0.1);
            padding: 1px 10px;
            border-radius: 10px;
        }
        .tabs .tab.active .count {
            background: rgba(255, 255, 255, 0.25);
        }
        .tabs .tab .icon {
            font-size: 16px;
        }

        /* ===== 统计条 ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .stats-row .stat-item {
            background: white;
            border-radius: 10px;
            padding: 8px 10px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        .stats-row .stat-item .num {
            font-size: 18px;
            font-weight: 700;
            color: #1a73e8;
        }
        .stats-row .stat-item .num.orange {
            color: #ff6b6b;
        }
        .stats-row .stat-item .num.green {
            color: #4caf50;
        }
        .stats-row .stat-item .num.purple {
            color: #9c27b0;
        }
        .stats-row .stat-item .label {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }

        /* ===== 筛选栏 ===== */
        .filter-bar {
            background: white;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .filter-bar .search-wrap {
            flex: 1;
            min-width: 140px;
            display: flex;
            gap: 6px;
            align-items: center;
            background: #f5f7fa;
            border-radius: 8px;
            padding: 0 10px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .filter-bar .search-wrap:focus-within {
            border-color: #1a73e8;
            background: white;
        }
        .filter-bar .search-wrap .search-icon {
            color: #999;
            font-size: 14px;
        }
        .filter-bar .search-wrap input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 13px;
            outline: none;
            min-width: 60px;
        }
        .filter-bar .filter-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar .filter-group select {
            padding: 6px 8px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 12px;
            background: white;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
            color: #333;
        }
        .filter-bar .filter-group select:focus {
            border-color: #1a73e8;
        }

        /* ===== 网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }
        .grid.hidden {
            display: none;
        }

        /* ===== 卡片 ===== */
        .item-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: cardFadeIn 0.4s ease forwards;
            border-left: 4px solid #1a73e8;
        }
        .item-card.route-card {
            border-left-color: #9c27b0;
        }
        .item-card .card-type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            color: white;
            z-index: 5;
            backdrop-filter: blur(4px);
        }
        .item-card .card-type-badge.vehicle {
            background: rgba(26, 115, 232, 0.9);
        }
        .item-card .card-type-badge.route {
            background: rgba(156, 39, 176, 0.9);
        }

        @keyframes cardFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .item-card:nth-child(1) { animation-delay: 0.03s; }
        .item-card:nth-child(2) { animation-delay: 0.06s; }
        .item-card:nth-child(3) { animation-delay: 0.09s; }
        .item-card:nth-child(4) { animation-delay: 0.12s; }
        .item-card:nth-child(5) { animation-delay: 0.15s; }
        .item-card:nth-child(6) { animation-delay: 0.18s; }
        .item-card:nth-child(7) { animation-delay: 0.21s; }
        .item-card:nth-child(8) { animation-delay: 0.24s; }
        .item-card:nth-child(9) { animation-delay: 0.27s; }
        .item-card:nth-child(10) { animation-delay: 0.30s; }

        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        .item-card .card-thumb {
            position: relative;
            aspect-ratio: 16/9;
            background: #e8edf3;
            overflow: hidden;
        }
        .item-card .card-thumb .lazy-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s, opacity 0.6s;
            opacity: 0;
            background: #e8edf3;
        }
        .item-card .card-thumb .lazy-img.loaded {
            opacity: 1;
        }
        .item-card .card-thumb .lazy-img.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #ccc;
            background: #f5f7fa;
        }
        .item-card:hover .card-thumb .lazy-img.loaded {
            transform: scale(1.03);
        }
        .item-card .card-thumb .badges {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .item-card .card-thumb .badges .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            color: white;
            backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.6);
        }
        .item-card .card-thumb .badges .badge.official {
            background: rgba(76, 175, 80, 0.9);
        }
        .item-card .card-thumb .badges .badge.user {
            background: rgba(255, 152, 0, 0.9);
        }
        .item-card .card-thumb .badges .badge.active-status {
            background: rgba(76, 175, 80, 0.9);
        }
        .item-card .card-thumb .badges .badge.retired-status {
            background: rgba(244, 67, 54, 0.9);
        }
        .item-card .card-thumb .badges .badge.preserved-status {
            background: rgba(33, 150, 243, 0.9);
        }
        .item-card .card-thumb .badges .badge.route-type {
            background: rgba(156, 39, 176, 0.9);
        }
        .item-card .card-thumb .photo-count {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .item-card .card-body {
            padding: 12px 14px 14px;
        }
        .item-card .card-body .item-name {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .item-card .card-body .item-name .plate-text {
            color: #1a73e8;
        }
        .item-card .card-body .item-name .route-number {
            color: #9c27b0;
        }
        .item-card .card-body .item-name .fleet-number {
            color: #1a73e8;
            font-size: 14px;
        }
        .item-card .card-body .item-name .license-plate-tag {
            font-size: 12px;
            color: #666;
            font-weight: 400;
            background: #f0f0f0;
            padding: 1px 10px;
            border-radius: 10px;
        }
        .item-card .card-body .item-model {
            font-size: 13px;
            color: #444;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .item-card .card-body .item-model .model-tag {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 1px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .item-card .card-body .item-operator {
            font-size: 13px;
            color: #1a73e8;
            font-weight: 500;
            margin-top: 2px;
        }
        .item-card .card-body .item-location {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        .item-card .card-body .item-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 4px;
            font-size: 12px;
            color: #666;
        }
        .item-card .card-body .item-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .item-card .card-body .item-stats {
            display: flex;
            gap: 14px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #999;
            flex-wrap: wrap;
        }
        .item-card .card-body .item-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .item-card .card-body .item-stats .num {
            color: #333;
            font-weight: 600;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #999;
            background: white;
            border-radius: 14px;
        }
        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }
        .empty-state .sub {
            font-size: 13px;
            margin-top: 4px;
        }

        /* ===== 加载状态 ===== */
        .loading-spinner {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .loading-spinner .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-size: 32px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            border-color: #4caf50;
        }
        .toast.error {
            border-color: #f44336;
        }

        /* ===== Lightbox ===== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 99998;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 4px;
        }
        .lightbox .close-lightbox {
            position: absolute;
            top: 16px;
            right: 20px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .lightbox .close-lightbox:hover {
            transform: scale(1.2);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body { padding: 8px; }
            .navbar { padding: 8px 12px; }
            .navbar .brand { font-size: 15px; }
            .navbar .brand span { font-size: 20px; }
            .navbar .nav-links a { font-size: 11px; padding: 3px 8px; }
            .page-header .title-section h1 { font-size: 19px; }
            .upload-toolbar { padding: 10px 12px; gap: 6px; }
            .upload-toolbar .btn-upload { font-size: 12px; padding: 8px 12px; min-width: 60px; }
            .upload-toolbar .btn-upload .icon { font-size: 15px; }
            .upload-toolbar .btn-upload.refresh { flex: 0.3; min-width: 50px; }
            .tabs .tab { padding: 8px 14px; font-size: 13px; }
            .stats-row { grid-template-columns: repeat(4, 1fr); gap: 6px; }
            .stats-row .stat-item { padding: 6px 8px; }
            .stats-row .stat-item .num { font-size: 16px; }
            .stats-row .stat-item .label { font-size: 9px; }
            .filter-bar { padding: 8px 10px; flex-direction: column; align-items: stretch; }
            .filter-bar .search-wrap { min-width: auto; }
            .grid { grid-template-columns: 1fr; gap: 12px; }
        }

        @media (max-width: 480px) {
            .navbar .brand { font-size: 14px; }
            .navbar .nav-links a { font-size: 10px; padding: 3px 6px; }
            .page-header .title-section h1 { font-size: 17px; }
            .upload-toolbar { padding: 8px 10px; gap: 4px; }
            .upload-toolbar .btn-upload { font-size: 10px; padding: 6px 8px; min-width: 50px; }
            .upload-toolbar .btn-upload .icon { font-size: 13px; }
            .tabs .tab { padding: 6px 10px; font-size: 11px; }
            .tabs .tab .count { font-size: 9px; padding: 1px 6px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .stats-row .stat-item .num { font-size: 14px; }
            .grid { gap: 10px; }
            .item-card .card-body { padding: 10px 12px; }
            .item-card .card-body .item-name { font-size: 14px; }
        }
    </style>
</head>

                公司
            </a>
            <a href="route-edit.html" class="btn-upload route">
                <span class="icon">🚏</span>
                线路
            </a>
            <button class="btn-upload refresh" onclick="refreshData()">
                ⟳
            </button>
        </div>

        <!-- ===== Tab 切换 ===== -->
        <div class="tabs" id="tabContainer">
            <button class="tab active" data-tab="vehicles" onclick="switchTab('vehicles')">
                <span class="icon">🚌</span>
                车辆
                <span class="count" id="vehicleCount">0</span>
            </button>
            <button class="tab" data-tab="routes" onclick="switchTab('routes')">
                <span class="icon">🚏</span>
                线路
                <span class="count" id="routeCount">0</span>
            </button>
        </div>

        <!-- 统计条 -->
        <div class="stats-row" id="statsRow">
            <div class="stat-item">
                <div class="num" id="statTotal">0</div>
                <div class="label">📊 总计</div>
            </div>
            <div class="stat-item">
                <div class="num" id="statVehicles">0</div>
                <div class="label">🚌 车辆</div>
            </div>
            <div class="stat-item">
                <div class="num purple" id="statRoutes">0</div>
                <div class="label">🚏 线路</div>
            </div>
            <div class="stat-item">
                <div class="num orange" id="statOperators">0</div>
                <div class="label">🏢 公司</div>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar" id="filterBar">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索..." oninput="applyFilters()">
            </div>

            <div class="filter-group">
                <label style="font-size:11px;color:#888;font-weight:500;">🏢 公司</label>
                <select id="operatorFilter" onchange="applyFilters()">
                    <option value="all">全部公司</option>
                </select>
            </div>

            <div class="filter-group">
                <label style="font-size:11px;color:#888;font-weight:500;">📐 排序</label>
                <select id="sortFilter" onchange="applyFilters()">
                    <option value="newest">最新添加</option>
                    <option value="oldest">最早添加</option>
                    <option value="name">按名称</option>
                </select>
            </div>
        </div>

        <!-- ===== 车辆网格 ===== -->
        <div class="grid" id="vehicleGrid">
            <div class="loading-spinner">
                <span class="spinner">⟳</span>
                <p style="margin-top:8px;">加载车辆...</p>
            </div>
        </div>

        <!-- ===== 线路网格（隐藏） ===== -->
        <div class="grid hidden" id="routeGrid">
            <div class="loading-spinner">
                <span class="spinner">⟳</span>
                <p style="margin-top:8px;">加载线路...</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox">×</span>
        <img id="lightboxImg" src="" alt="预览">
    </div>

    <script>
        // ============================================================
        //  Supabase 客户端
        // ============================================================
        var supabaseClient = null;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  用户状态
        // ============================================================
        function getCurrentUser() {
            try {
                var raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            window.location.href = 'index.html';
        }

        function renderNav() {
            var nav = document.getElementById('navLinks');
            var user = getCurrentUser();

            if (user) {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="profile.html">👤 个人中心</a>' +
                    '<a href="upload.html">📤 新机位</a>' +
                    '<span class="user-name">👤 ' + escapeHtml(user.username) + '</span>' +
                    '<button class="btn-logout" onclick="logout()">退出</button>';
            } else {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="login.html">登录</a>' +
                    '<a href="register.html">注册</a>';
            }
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(text, type) {
            var el = document.getElementById('toast');
            el.textContent = text;
            el.className = 'toast ' + (type || '') + ' show';
            clearTimeout(el._timer);
            el._timer = setTimeout(function() { el.className = 'toast'; }, 3000);
        }

        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        function getStatusLabel(status) {
            var map = {
                active: '🚀 运营中',
                retired: '🔄 已退役',
                preserved: '🏛️ 保留/收藏',
                scrapped: '💔 已报废'
            };
            return map[status] || status || '未知';
        }

        function getStatusClass(status) {
            var map = { active: 'active-status', retired: 'retired-status', preserved: 'preserved-status' };
            return map[status] || '';
        }

        function getSourceLabel(source) {
            var map = { official: '🏢 官方认证', user: '👤 用户投稿' };
            return map[source] || source || '用户投稿';
        }

        function getSourceClass(source) {
            var map = { official: 'official', user: 'user' };
            return map[source] || 'user';
        }

        function getVehicleTypeLabel(type) {
            var map = {
                single_decker: '单层巴士',
                double_decker: '双层巴士',
                articulated: '铰接巴士',
                minibus: '小巴',
                coach: '旅游大巴',
                electric: '纯电动巴士',
                hybrid: '混动巴士',
                trolleybus: '无轨电车'
            };
            return map[type] || type || '巴士';
        }

        function getRouteTypeLabel(type) {
            var map = {
                regular: '常规线',
                branch: '支线',
                express: '快线',
                peak: '高峰线',
                night: '夜间线',
                holiday: '假日线',
                shuttle: '接驳线'
            };
            return map[type] || type || '线路';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '未知';
            try {
                var d = new Date(dateStr);
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            } catch (e) {
                return dateStr;
            }
        }

        // ============================================================
        //  数据状态
        // ============================================================
        var allVehicles = [];
        var allRoutes = [];
        var operators = [];
        var currentTab = 'vehicles';
        var isLoading = false;

        // ============================================================
        //  加载数据
        // ============================================================
        function loadAllData() {
            if (isLoading) return;
            isLoading = true;

            // 加载运营公司
            supabaseClient
                .from('operators')
                .select('id, name, short_name')
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        operators = res.data || [];
                        populateOperatorFilter();
                    }
                })
                .catch(function(err) { console.warn('加载运营商失败:', err); });

            // 加载车辆
            supabaseClient
                .from('vehicles')
                .select('*')
                .eq('status', 'approved')
                .order('created_at', { ascending: false })
                .then(function(res) {
                    if (res.error) throw new Error(res.error.message);
                    allVehicles = res.data || [];
                    console.log('✅ 加载车辆: ' + allVehicles.length + ' 辆');
                    renderVehicles();
                    checkLoaded();
                })
                .catch(function(error) {
                    console.error('加载车辆失败:', error);
                    checkLoaded();
                });

            // 加载线路
            supabaseClient
                .from('routes')
                .select('*')
                .eq('status', 'approved')
                .order('created_at', { ascending: false })
                .then(function(res) {
                    if (res.error) throw new Error(res.error.message);
                    allRoutes = res.data || [];
                    console.log('✅ 加载线路: ' + allRoutes.length + ' 条');
                    renderRoutes();
                    checkLoaded();
                })
                .catch(function(error) {
                    console.error('加载线路失败:', error);
                    checkLoaded();
                });
        }

        var loadCounter = 0;

        function checkLoaded() {
            loadCounter++;
            if (loadCounter >= 2) {
                loadCounter = 0;
                isLoading = false;
                updateStats();
                applyFilters();
                // 显示当前 Tab
                switchTab(currentTab);
            }
        }

        // ============================================================
        //  更新统计
        // ============================================================
        function updateStats() {
            var total = allVehicles.length + allRoutes.length;

            var operatorSet = new Set();
            allVehicles.forEach(function(v) {
                if (v.operator_id) operatorSet.add(v.operator_id);
            });
            allRoutes.forEach(function(r) {
                if (r.operator_id) operatorSet.add(r.operator_id);
            });

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statVehicles').textContent = allVehicles.length;
            document.getElementById('statRoutes').textContent = allRoutes.length;
            document.getElementById('statOperators').textContent = operatorSet.size;
            document.getElementById('totalBadge').textContent = total + ' 项';
            document.getElementById('vehicleCount').textContent = allVehicles.length;
            document.getElementById('routeCount').textContent = allRoutes.length;
        }

        // ============================================================
        //  填充公司筛选
        // ============================================================
        function populateOperatorFilter() {
            var select = document.getElementById('operatorFilter');
            var currentValue = select.value;
            select.innerHTML = '<option value="all">全部公司</option>';
            operators.forEach(function(op) {
                var displayName = op.short_name || op.name;
                select.innerHTML += '<option value="' + op.id + '">' + escapeHtml(displayName) + '</option>';
            });
            if (currentValue) select.value = currentValue;
        }

        // ============================================================
        //  Tab 切换
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tabs .tab').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            document.getElementById('vehicleGrid').classList.toggle('hidden', tab !== 'vehicles');
            document.getElementById('routeGrid').classList.toggle('hidden', tab !== 'routes');
            // 重新触发懒加载
            setTimeout(function() { lazyLoadImages(); }, 200);
        }

        // ============================================================
        //  筛选与搜索
        // ============================================================
        function applyFilters() {
            var search = document.getElementById('searchInput').value.trim().toLowerCase();
            var operatorId = document.getElementById('operatorFilter').value;
            var sort = document.getElementById('sortFilter').value;

            var filteredVehicles = filterItems(allVehicles, search, operatorId, sort, 'vehicle');
            var filteredRoutes = filterItems(allRoutes, search, operatorId, sort, 'route');

            renderVehicles(filteredVehicles);
            renderRoutes(filteredRoutes);
        }

        function filterItems(items, search, operatorId, sort, type) {
            var filtered = items.filter(function(item) {
                if (search) {
                    var searchable = '';
                    if (type === 'vehicle') {
                        searchable = (item.fleet_number || '') + ' ' +
                            (item.license_plate || '') + ' ' +
                            (item.model || '') + ' ' +
                            (item.manufacturer || '');
                    } else {
                        searchable = (item.route_number || '') + ' ' +
                            (item.start_station || '') + ' ' +
                            (item.end_station || '') + ' ' +
                            (item.operator_name || '');
                    }
                    if (!searchable.toLowerCase().includes(search)) return false;
                }
                if (operatorId !== 'all' && item.operator_id != operatorId) return false;
                return true;
            });

            filtered.sort(function(a, b) {
                switch (sort) {
                    case 'newest':
                        return new Date(b.created_at) - new Date(a.created_at);
                    case 'oldest':
                        return new Date(a.created_at) - new Date(b.created_at);
                    case 'name':
                        var nameA = type === 'vehicle' ? (a.fleet_number || a.license_plate || a.model || '') :
                            (a.route_number || '');
                        var nameB = type === 'vehicle' ? (b.fleet_number || b.license_plate || b.model || '') :
                            (b.route_number || '');
                        return nameA.localeCompare(nameB);
                    default:
                        return 0;
                }
            });

            return filtered;
        }

        // ============================================================
        //  获取运营商名称
        // ============================================================
        function getOperatorName(id) {
            if (!id) return null;
            var op = operators.find(function(o) { return o.id == id; });
            return op ? (op.short_name || op.name) : null;
        }

        // ============================================================
        //  渲染车辆
        // ============================================================
        function renderVehicles(vehicles) {
            var grid = document.getElementById('vehicleGrid');
            var items = vehicles || allVehicles;

            if (!items || items.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state"><span class="icon">🚌</span><p>没有找到匹配的车辆</p><div class="sub">试试调整筛选条件</div></div>';
                return;
            }

            var html = '';
            items.forEach(function(v, index) {
                html += renderVehicleCard(v, index);
            });

            grid.innerHTML = html;
            setTimeout(function() { lazyLoadImages(); }, 100);
        }

        // ============================================================
        //  渲染线路
        // ============================================================
        function renderRoutes(routes) {
            var grid = document.getElementById('routeGrid');
            var items = routes || allRoutes;

            if (!items || items.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state"><span class="icon">🚏</span><p>没有找到匹配的线路</p><div class="sub">试试调整筛选条件</div></div>';
                return;
            }

            var html = '';
            items.forEach(function(r, index) {
                html += renderRouteCard(r, index);
            });

            grid.innerHTML = html;
            setTimeout(function() { lazyLoadImages(); }, 100);
        }

        // ============================================================
        //  渲染车辆卡片
        // ============================================================
        function renderVehicleCard(v, index) {
            var coverPhoto = v.cover_photo || null;
            var isOfficial = v.data_source === 'official' || v.verified === true;
            var sourceClass = isOfficial ? 'official' : 'user';
            var sourceLabel = isOfficial ? '🏢 官方认证' : '👤 用户投稿';
            var statusLabel = getStatusLabel(v.service_status);
            var statusClass = getStatusClass(v.service_status);
            var operatorName = getOperatorName(v.operator_id);
            var typeLabel = getVehicleTypeLabel(v.vehicle_type);

            var displayName = '';
            if (v.fleet_number) {
                displayName = '<span class="fleet-number">' + escapeHtml(v.fleet_number) + '</span>';
            }
            if (v.license_plate) {
                displayName += ' <span class="license-plate-tag">' + escapeHtml(v.license_plate) + '</span>';
            }
            if (!displayName) {
                displayName = escapeHtml(v.model || '未命名巴士');
            }

            var thumbHtml = '';
            if (coverPhoto) {
                thumbHtml = '<img class="lazy-img" data-src="' + escapeHtml(coverPhoto) + '" alt="' + escapeHtml(v
                    .license_plate || v.fleet_number || v.model || '巴士') + '" />';
            } else {
                thumbHtml = '<div class="lazy-img placeholder">🚌</div>';
            }

            var modelHtml = '';
            if (v.model) {
                modelHtml = '<div class="item-model"><span class="model-tag">🚌 ' + escapeHtml(v.model) + '</span></div>';
            }

            var locationParts = [];
            if (v.country_name) locationParts.push(v.country_name);
            if (v.province_name) locationParts.push(v.province_name);
            if (v.city_name) locationParts.push(v.city_name);
            var locationText = locationParts.length > 0 ? locationParts.join(' → ') : '📍 位置未标注';

            var delay = Math.min(index * 0.04, 0.4);

            return '<div class="item-card" style="animation-delay:' + delay + 's" onclick="window.location.href=\'vehicle-edit.html?id=' +
                v.id + '\'">' +
                '<span class="card-type-badge vehicle">🚌 车辆</span>' +
                '<div class="card-thumb">' +
                thumbHtml +
                '<div class="badges">' +
                '<span class="badge ' + sourceClass + '">' + sourceLabel + '</span>' +
                (v.service_status ? '<span class="badge ' + statusClass + '">' + statusLabel + '</span>' : '') +
                '</div>' +
                '</div>' +
                '<div class="card-body">' +
                '<div class="item-name">' + displayName + '</div>' +
                modelHtml +
                (operatorName ? '<div class="item-operator">🏢 ' + escapeHtml(operatorName) + '</div>' : '') +
                '<div class="item-location">📍 ' + escapeHtml(locationText) + '</div>' +
                '<div class="item-meta">' +
                (v.manufacturer ? '<span>🏭 ' + escapeHtml(v.manufacturer) + '</span>' : '') +
                (v.vehicle_type ? '<span>🚌 ' + typeLabel + '</span>' : '') +
                '</div>' +
                '<div class="item-stats">' +
                '<span>👁️ <span class="num">' + (v.views || 0) + '</span></span>' +
                '<span>❤️ <span class="num">' + (v.likes || 0) + '</span></span>' +
                '<span style="margin-left:auto;color:#bbb;">📅 ' + formatDate(v.created_at) + '</span>' +
                '</div>' +
                '</div>' +
                '</div>';
        }

        // ============================================================
        //  渲染线路卡片
        // ============================================================
        function renderRouteCard(r, index) {
            var operatorName = getOperatorName(r.operator_id);
            var routeTypeLabel = getRouteTypeLabel(r.route_type);

            var displayName = '<span class="route-number">🚏 ' + escapeHtml(r.route_number) + '</span>';

            var routeInfo = '';
            if (r.start_station && r.end_station) {
                routeInfo = escapeHtml(r.start_station) + ' → ' + escapeHtml(r.end_station);
            } else if (r.start_station) {
                routeInfo = '起点: ' + escapeHtml(r.start_station);
            } else if (r.end_station) {
                routeInfo = '终点: ' + escapeHtml(r.end_station);
            }

            var locationParts = [];
            if (r.country_name) locationParts.push(r.country_name);
            if (r.province_name) locationParts.push(r.province_name);
            if (r.city_name) locationParts.push(r.city_name);
            var locationText = locationParts.length > 0 ? locationParts.join(' → ') : '📍 位置未标注';

            var delay = Math.min(index * 0.04, 0.4);

            return '<div class="item-card route-card" style="animation-delay:' + delay + 's" onclick="window.location.href=\'route-edit.html?id=' +
                r.id + '\'">' +
                '<span class="card-type-badge route">🚏 线路</span>' +
                '<div class="card-thumb" style="background:linear-gradient(135deg,#f3e5f5,#e1bee7);display:flex;align-items:center;justify-content:center;font-size:48px;color:#9c27b0;">' +
                '🚏' +
                '<div style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.7);color:white;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:500;">' +
                routeTypeLabel +
                '</div>' +
                '</div>' +
                '<div class="card-body">' +
                '<div class="item-name">' + displayName + '</div>' +
                (routeInfo ? '<div class="item-model" style="color:#555;font-size:14px;">📍 ' + routeInfo + '</div>' : '') +
                (operatorName ? '<div class="item-operator">🏢 ' + escapeHtml(operatorName) + '</div>' : '') +
                '<div class="item-location">📍 ' + escapeHtml(locationText) + '</div>' +
                '<div class="item-meta">' +
                (r.total_stops ? '<span>🔄 ' + r.total_stops + ' 站</span>' : '') +
                (r.total_distance ? '<span>📏 ' + r.total_distance + ' km</span>' : '') +
                (r.route_type ? '<span>📌 ' + routeTypeLabel + '</span>' : '') +
                '</div>' +
                '<div class="item-stats">' +
                '<span style="color:#9c27b0;">🚏 ' + escapeHtml(r.route_number) + '</span>' +
                '<span style="margin-left:auto;color:#bbb;">📅 ' + formatDate(r.created_at) + '</span>' +
                '</div>' +
                '</div>' +
                '</div>';
        }

        // ============================================================
        //  懒加载图片
        // ============================================================
        function lazyLoadImages() {
            if (!('IntersectionObserver' in window)) {
                document.querySelectorAll('.lazy-img[data-src]').forEach(function(img) {
                    var src = img.dataset.src;
                    if (src) {
                        img.src = src;
                        img.onload = function() { img.classList.add('loaded'); };
                    }
                });
                return;
            }

            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        var img = entry.target;
                        var src = img.dataset.src;
                        if (src) {
                            img.src = src;
                            img.onload = function() { img.classList.add('loaded'); };
                            img.onerror = function() {
                                img.classList.add('loaded');
                                img.style.background = '#f5f7fa';
                            };
                            observer.unobserve(img);
                        }
                    }
                });
            }, {
                rootMargin: '100px',
                threshold: 0.01
            });

            document.querySelectorAll('.lazy-img[data-src]').forEach(function(img) {
                observer.observe(img);
            });
        }

        // ============================================================
        //  刷新
        // ============================================================
        function refreshData() {
            showToast('⟳ 刷新中...', '');
            loadCounter = 0;
            allVehicles = [];
            allRoutes = [];
            loadAllData();
        }

        // ============================================================
        //  启动
        // ============================================================
        renderNav();
        loadAllData();

        console.log('🚌 巴士档案已分开显示（车辆 + 线路 Tab）');
