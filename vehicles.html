    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 12px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        .navbar .brand {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
        }
        .navbar .brand span {
            font-size: 24px;
        }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .navbar .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }
        .navbar .nav-links a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        .navbar .nav-links a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .navbar .nav-links .user-name {
            color: rgba(255, 255, 255, 0.85);
            padding: 5px 10px;
            font-size: 13px;
        }
        .navbar .nav-links .btn-logout {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .navbar .nav-links .btn-logout:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== 页面头部 ===== */
        .page-header {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header .title-section h1 {
            font-size: 24px;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-header .title-section h1 .badge {
            font-size: 13px;
            font-weight: 400;
            color: #888;
            background: #e8e8e8;
            padding: 2px 12px;
            border-radius: 20px;
        }
        .page-header .title-section p {
            color: #888;
            font-size: 14px;
            margin-top: 2px;
        }
        .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .page-header .actions .btn-region {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .page-header .actions .btn-region:hover {
            background: #1976d2;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(33, 150, 243, 0.3);
        }
        .page-header .actions .btn-company {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .page-header .actions .btn-company:hover {
            background: #e68900;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 152, 0, 0.3);
        }
        .page-header .actions .btn-route {
            background: #9c27b0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .page-header .actions .btn-route:hover {
            background: #7b1fa2;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(156, 39, 176, 0.3);
        }
        .page-header .actions .btn-secondary {
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-header .actions .btn-secondary:hover {
            border-color: #1a73e8;
            background: #f5f8ff;
        }

        /* ===== 统计条 ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .stats-row .stat-item {
            background: white;
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        .stats-row .stat-item .num {
            font-size: 20px;
            font-weight: 700;
            color: #1a73e8;
        }
        .stats-row .stat-item .label {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        /* ===== 筛选栏 ===== */
        .filter-bar {
            background: white;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .filter-bar .search-wrap {
            flex: 1;
            min-width: 160px;
            display: flex;
            gap: 6px;
            align-items: center;
            background: #f5f7fa;
            border-radius: 10px;
            padding: 0 12px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .filter-bar .search-wrap:focus-within {
            border-color: #1a73e8;
            background: white;
        }
        .filter-bar .search-wrap .search-icon {
            color: #999;
            font-size: 16px;
        }
        .filter-bar .search-wrap input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 13px;
            outline: none;
            min-width: 80px;
        }
        .filter-bar .filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar .filter-group label {
            font-size: 11px;
            color: #888;
            font-weight: 500;
        }
        .filter-bar .filter-group select {
            padding: 6px 10px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 12px;
            background: white;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
            color: #333;
        }
        .filter-bar .filter-group select:focus {
            border-color: #1a73e8;
        }
        .filter-bar .filter-group .filter-btn {
            padding: 6px 14px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            color: #666;
        }
        .filter-bar .filter-group .filter-btn:hover {
            border-color: #1a73e8;
            color: #1a73e8;
        }
        .filter-bar .filter-group .filter-btn.active {
            border-color: #1a73e8;
            background: #e8f0fe;
            color: #1a73e8;
        }
        .filter-bar .filter-group .filter-btn .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .filter-bar .filter-group .filter-btn .dot.official {
            background: #4caf50;
        }
        .filter-bar .filter-group .filter-btn .dot.user {
            background: #ff9800;
        }
        .filter-bar .filter-group .filter-btn .dot.active {
            background: #4caf50;
        }
        .filter-bar .filter-group .filter-btn .dot.retired {
            background: #f44336;
        }
        .filter-bar .filter-group .filter-btn .dot.preserved {
            background: #2196f3;
        }

        /* ===== 车辆网格 ===== */
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* ===== 车辆卡片 ===== */
        .vehicle-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: cardFadeIn 0.4s ease forwards;
        }
        @keyframes cardFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .vehicle-card:nth-child(1) { animation-delay: 0.05s; }
        .vehicle-card:nth-child(2) { animation-delay: 0.10s; }
        .vehicle-card:nth-child(3) { animation-delay: 0.15s; }
        .vehicle-card:nth-child(4) { animation-delay: 0.20s; }
        .vehicle-card:nth-child(5) { animation-delay: 0.25s; }
        .vehicle-card:nth-child(6) { animation-delay: 0.30s; }
        .vehicle-card:nth-child(7) { animation-delay: 0.35s; }
        .vehicle-card:nth-child(8) { animation-delay: 0.40s; }
        .vehicle-card:nth-child(9) { animation-delay: 0.45s; }
        .vehicle-card:nth-child(10) { animation-delay: 0.50s; }

        .vehicle-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        .vehicle-card .card-thumb {
            position: relative;
            aspect-ratio: 16/9;
            background: #e8edf3;
            overflow: hidden;
        }
        .vehicle-card .card-thumb .lazy-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s, opacity 0.6s;
            opacity: 0;
            background: #e8edf3;
        }
        .vehicle-card .card-thumb .lazy-img.loaded {
            opacity: 1;
        }
        .vehicle-card .card-thumb .lazy-img.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #ccc;
            background: #f5f7fa;
        }
        .vehicle-card:hover .card-thumb .lazy-img.loaded {
            transform: scale(1.03);
        }
        .vehicle-card .card-thumb .badges {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .vehicle-card .card-thumb .badges .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            color: white;
            backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.6);
        }
        .vehicle-card .card-thumb .badges .badge.official {
            background: rgba(76, 175, 80, 0.9);
        }
        .vehicle-card .card-thumb .badges .badge.user {
            background: rgba(255, 152, 0, 0.9);
        }
        .vehicle-card .card-thumb .badges .badge.active-status {
            background: rgba(76, 175, 80, 0.9);
        }
        .vehicle-card .card-thumb .badges .badge.retired-status {
            background: rgba(244, 67, 54, 0.9);
        }
        .vehicle-card .card-thumb .badges .badge.preserved-status {
            background: rgba(33, 150, 243, 0.9);
        }
        .vehicle-card .card-thumb .photo-count {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        .vehicle-card .card-body {
            padding: 12px 16px 14px;
        }
        .vehicle-card .card-body .vehicle-name {
            font-size: 17px;
            font-weight: 700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .vehicle-card .card-body .vehicle-name .plate-text {
            color: #1a73e8;
        }
        .vehicle-card .card-body .vehicle-name .fleet-number {
            color: #1a73e8;
            font-size: 14px;
        }
        .vehicle-card .card-body .vehicle-name .license-plate-tag {
            font-size: 13px;
            color: #666;
            font-weight: 400;
            background: #f0f0f0;
            padding: 1px 10px;
            border-radius: 10px;
        }
        .vehicle-card .card-body .vehicle-model {
            font-size: 13px;
            color: #444;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .vehicle-card .card-body .vehicle-model .model-tag {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 1px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .vehicle-card .card-body .vehicle-operator {
            font-size: 13px;
            color: #1a73e8;
            font-weight: 500;
            margin-top: 2px;
        }
        .vehicle-card .card-body .vehicle-location {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        .vehicle-card .card-body .vehicle-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 4px;
            font-size: 12px;
            color: #666;
        }
        .vehicle-card .card-body .vehicle-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .vehicle-card .card-body .vehicle-stats {
            display: flex;
            gap: 14px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #999;
        }
        .vehicle-card .card-body .vehicle-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .vehicle-card .card-body .vehicle-stats .num {
            color: #333;
            font-weight: 600;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #999;
            background: white;
            border-radius: 14px;
        }
        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }
        .empty-state .sub {
            font-size: 13px;
            margin-top: 4px;
        }

        /* ===== 加载状态 ===== */
        .loading-spinner {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .loading-spinner .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-size: 32px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            border-color: #4caf50;
        }
        .toast.error {
            border-color: #f44336;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            .navbar {
                padding: 8px 14px;
            }
            .navbar .brand {
                font-size: 16px;
            }
            .navbar .nav-links a {
                font-size: 11px;
                padding: 4px 8px;
            }
            .page-header .title-section h1 {
                font-size: 20px;
            }
            .page-header .actions .btn-region,
            .page-header .actions .btn-company,
            .page-header .actions .btn-route,
            .page-header .actions .btn-secondary {
                padding: 6px 12px;
                font-size: 12px;
            }
            .filter-bar {
                padding: 10px 12px;
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar .search-wrap {
                min-width: auto;
            }
            .vehicle-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
            .stats-row {
                grid-template-columns: repeat(4, 1fr);
            }
            .stats-row .stat-item .num {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .page-header .actions {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .page-header .actions .btn-region,
            .page-header .actions .btn-company,
            .page-header .actions .btn-route,
            .page-header .actions .btn-secondary {
                flex: 1;
                justify-content: center;
                padding: 6px 10px;
                font-size: 11px;
                min-width: 70px;
            }
            .vehicle-grid {
                grid-template-columns: 1fr;
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .vehicle-card .card-body .vehicle-name {
                font-size: 15px;
            }
            .vehicle-card .card-body .vehicle-model {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 导航栏 -->
        <nav class="navbar">
            <a href="index.html" class="brand"><span>🚌</span> BusLens</a>
            <div class="nav-links" id="navLinks"></div>
        </nav>

        <!-- 页面头部 -->
        <div class="page-header">
            <div class="title-section">
                <h1>
                    🚌 巴士档案
                    <span class="badge" id="totalBadge">加载中...</span>
                </h1>
                <p>📸 发现每一辆巴士的故事 · 记录城市交通的变迁</p>
            </div>
            <div class="actions">
                <a href="region-edit.html" class="btn-region">🌍 上传地区</a>
                <a href="company-edit.html" class="btn-company">🏢 上传公司</a>
                <a href="route-edit.html" class="btn-route">🚌 上传线路</a>
                <button class="btn-secondary" onclick="refreshData()">⟳ 刷新</button>
            </div>
        </div>

        <!-- 统计条 -->
        <div class="stats-row" id="statsRow">
            <div class="stat-item">
                <div class="num" id="statTotal">0</div>
                <div class="label">📊 车辆总数</div>
            </div>
            <div class="stat-item">
                <div class="num official" id="statOfficial">0</div>
                <div class="label">🏢 官方认证</div>
            </div>
            <div class="stat-item">
                <div class="num user" id="statUser">0</div>
                <div class="label">👤 用户投稿</div>
            </div>
            <div class="stat-item">
                <div class="num" id="statOperators">0</div>
                <div class="label">🏢 运营公司</div>
            </div>
            <div class="stat-item">
                <div class="num" id="statModels">0</div>
                <div class="label">🚌 车型</div>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar" id="filterBar">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索车队编号、车牌、型号..." oninput="applyFilters()">
            </div>

            <div class="filter-group">
                <label>📌 来源</label>
                <button class="filter-btn active" data-source="all" onclick="setSourceFilter('all')">全部</button>
                <button class="filter-btn" data-source="official" onclick="setSourceFilter('official')">
                    <span class="dot official"></span>官方
                </button>
                <button class="filter-btn" data-source="user" onclick="setSourceFilter('user')">
                    <span class="dot user"></span>用户
                </button>
            </div>

            <div class="filter-group">
                <label>📊 状态</label>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="all">全部状态</option>
                    <option value="active">🚀 运营中</option>
                    <option value="retired">🔄 已退役</option>
                    <option value="preserved">🏛️ 保留/收藏</option>
                    <option value="scrapped">💔 已报废</option>
                </select>
            </div>

            <div class="filter-group">
                <label>🏢 公司</label>
                <select id="operatorFilter" onchange="applyFilters()">
                    <option value="all">全部公司</option>
                </select>
            </div>

            <div class="filter-group">
                <label>📐 排序</label>
                <select id="sortFilter" onchange="applyFilters()">
                    <option value="newest">最新添加</option>
                    <option value="oldest">最早添加</option>
                    <option value="views">最多浏览</option>
                    <option value="likes">最多点赞</option>
                    <option value="photos">最多照片</option>
                </select>
            </div>
        </div>

        <!-- 车辆网格 -->
        <div class="vehicle-grid" id="vehicleGrid">
            <div class="loading-spinner">
                <span class="spinner">⟳</span>
                <p style="margin-top:8px;">加载巴士档案...</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  Supabase 客户端
        // ============================================================
        var supabaseClient = null;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  用户状态
        // ============================================================
        function getCurrentUser() {
            try {
                var raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            window.location.href = 'index.html';
        }

        function renderNav() {
            var nav = document.getElementById('navLinks');
            var user = getCurrentUser();

            if (user) {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="profile.html">👤 个人中心</a>' +
                    '<a href="upload.html">📤 新机位</a>' +
                    '<span class="user-name">👤 ' + escapeHtml(user.username) + '</span>' +
                    '<button class="btn-logout" onclick="logout()">退出</button>';
            } else {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="login.html">登录</a>' +
                    '<a href="register.html">注册</a>';
            }
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(text, type) {
            var el = document.getElementById('toast');
            el.textContent = text;
            el.className = 'toast ' + (type || '') + ' show';
            clearTimeout(el._timer);
            el._timer = setTimeout(function() { el.className = 'toast'; }, 3000);
        }

        function getStatusLabel(status) {
            var map = {
                active: '🚀 运营中',
                retired: '🔄 已退役',
                preserved: '🏛️ 保留/收藏',
                scrapped: '💔 已报废'
            };
            return map[status] || status || '未知';
        }

        function getStatusClass(status) {
            var map = { active: 'active-status', retired: 'retired-status', preserved: 'preserved-status' };
            return map[status] || '';
        }

        function getSourceLabel(source) {
            var map = { official: '🏢 官方认证', user: '👤 用户投稿' };
            return map[source] || source || '用户投稿';
        }

        function getSourceClass(source) {
            var map = { official: 'official', user: 'user' };
            return map[source] || 'user';
        }

        function getVehicleTypeLabel(type) {
            var map = {
                single_decker: '单层巴士',
                double_decker: '双层巴士',
                articulated: '铰接巴士',
                minibus: '小巴',
                coach: '旅游大巴',
                electric: '纯电动巴士',
                hybrid: '混动巴士',
                trolleybus: '无轨电车'
            };
            return map[type] || type || '巴士';
        }

        // ============================================================
        //  数据状态
        // ============================================================
        var allVehicles = [];
        var filteredVehicles = [];
        var currentSourceFilter = 'all';
        var operators = [];
        var photoCounts = {};
        var vehicleCovers = {};
        var vehicleModelsCache = [];
        var isLoadingMore = false;
        var pageSize = 20;
        var currentPage = 0;
        var hasMoreData = true;

        // ============================================================
        //  加载车辆数据（分页 + 懒加载）
        // ============================================================
        function loadVehicles(reset) {
            if (reset === undefined) reset = true;
            if (reset) {
                currentPage = 0;
                allVehicles = [];
                hasMoreData = true;
                document.getElementById('vehicleGrid').innerHTML =
                    '<div class="loading-spinner"><span class="spinner">⟳</span><p style="margin-top:8px;">加载巴士档案...</p></div>';
            }

            if (!supabaseClient) return;
            if (isLoadingMore) return;
            if (!hasMoreData && !reset) return;

            isLoadingMore = true;

            // 加载运营公司列表
            if (operators.length === 0) {
                supabaseClient
                    .from('operators')
                    .select('id, name, short_name')
                    .eq('status', 'approved')
                    .order('name')
                    .then(function(res) {
                        if (!res.error) {
                            operators = res.data || [];
                            populateOperatorFilter();
                        }
                    })
                    .catch(function(err) { console.warn('加载运营商失败:', err); });
            }

            // 加载车型缓存
            if (vehicleModelsCache.length === 0) {
                supabaseClient
                    .from('vehicle_models')
                    .select('id, name, manufacturer')
                    .eq('status', 'approved')
                    .then(function(res) {
                        if (!res.error) {
                            vehicleModelsCache = res.data || [];
                            console.log('✅ 已加载 ' + vehicleModelsCache.length + ' 个车型缓存');
                        }
                    })
                    .catch(function(err) { console.warn('加载车型缓存失败:', err); });
            }

            var offset = currentPage * pageSize;

            supabaseClient
                .from('vehicles')
                .select('*')
                .eq('status', 'approved')
                .order('created_at', { ascending: false })
                .range(offset, offset + pageSize - 1)
                .then(function(res) {
                    if (res.error) throw new Error(res.error.message);
                    var newVehicles = res.data || [];

                    if (newVehicles.length < pageSize) {
                        hasMoreData = false;
                    }

                    if (reset) {
                        allVehicles = newVehicles;
                    } else {
                        allVehicles = allVehicles.concat(newVehicles);
                    }

                    currentPage++;

                    // 加载照片数量
                    loadPhotoCounts(function() {
                        applyFilters();
                        updateStats();
                        renderNav();
                        isLoadingMore = false;
                    });
                })
                .catch(function(error) {
                    console.error('加载车辆失败:', error);
                    document.getElementById('vehicleGrid').innerHTML =
                        '<div class="empty-state"><span class="icon">❌</span><p>加载失败：' + escapeHtml(error.message) +
                        '</p></div>';
                    isLoadingMore = false;
                });
        }

        // ============================================================
        //  加载照片数据
        // ============================================================
        function loadPhotoCounts(callback) {
            var vehicleIds = allVehicles.map(function(v) { return v.id; });
            if (vehicleIds.length === 0) {
                if (callback) callback();
                return;
            }

            supabaseClient
                .from('user_photos')
                .select('vehicle_id, photo_url')
                .eq('status', 'approved')
                .in('vehicle_id', vehicleIds)
                .then(function(res) {
                    if (!res.error) {
                        var photos = res.data || [];
                        photoCounts = {};
                        vehicleCovers = {};

                        photos.forEach(function(p) {
                            if (p.vehicle_id) {
                                photoCounts[p.vehicle_id] = (photoCounts[p.vehicle_id] || 0) + 1;
                                if (!vehicleCovers[p.vehicle_id]) {
                                    vehicleCovers[p.vehicle_id] = p.photo_url;
                                }
                            }
                        });
                    }
                    if (callback) callback();
                })
                .catch(function(err) {
                    console.warn('加载照片数据失败:', err);
                    if (callback) callback();
                });
        }

        // ============================================================
        //  更新统计
        // ============================================================
        function updateStats() {
            var total = allVehicles.length;
            var official = allVehicles.filter(function(v) {
                return v.data_source === 'official' || v.verified === true;
            }).length;
            var user = allVehicles.filter(function(v) {
                return v.data_source === 'user' || v.verified !== true;
            }).length;

            var operatorSet = new Set();
            var modelSet = new Set();
            allVehicles.forEach(function(v) {
                if (v.operator_id) operatorSet.add(v.operator_id);
                if (v.model) modelSet.add(v.model);
            });

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statOfficial').textContent = official;
            document.getElementById('statUser').textContent = user;
            document.getElementById('statOperators').textContent = operatorSet.size;
            document.getElementById('statModels').textContent = modelSet.size;
            document.getElementById('totalBadge').textContent = total + ' 辆';
        }

        // ============================================================
        //  填充公司筛选
        // ============================================================
        function populateOperatorFilter() {
            var select = document.getElementById('operatorFilter');
            var currentValue = select.value;
            select.innerHTML = '<option value="all">全部公司</option>';
            operators.forEach(function(op) {
                var displayName = op.short_name || op.name;
                select.innerHTML += '<option value="' + op.id + '">' + escapeHtml(displayName) + '</option>';
            });
            if (currentValue) select.value = currentValue;
        }

        // ============================================================
        //  筛选与搜索
        // ============================================================
        function applyFilters() {
            var search = document.getElementById('searchInput').value.trim().toLowerCase();
            var status = document.getElementById('statusFilter').value;
            var operatorId = document.getElementById('operatorFilter').value;
            var sort = document.getElementById('sortFilter').value;

            filteredVehicles = allVehicles.filter(function(v) {
                if (search) {
                    var searchable = (v.fleet_number || '') + ' ' +
                        (v.license_plate || '') + ' ' +
                        (v.model || '') + ' ' +
                        (v.manufacturer || '');
                    if (!searchable.toLowerCase().includes(search)) return false;
                }

                if (status !== 'all' && v.service_status !== status) return false;

                if (operatorId !== 'all' && v.operator_id != operatorId) return false;

                if (currentSourceFilter !== 'all') {
                    var isOfficial = v.data_source === 'official' || v.verified === true;
                    if (currentSourceFilter === 'official' && !isOfficial) return false;
                    if (currentSourceFilter === 'user' && isOfficial) return false;
                }

                return true;
            });

            filteredVehicles.sort(function(a, b) {
                switch (sort) {
                    case 'newest':
                        return new Date(b.created_at) - new Date(a.created_at);
                    case 'oldest':
                        return new Date(a.created_at) - new Date(b.created_at);
                    case 'views':
                        return (b.views || 0) - (a.views || 0);
                    case 'likes':
                        return (b.likes || 0) - (a.likes || 0);
                    case 'photos':
                        var aPhotos = photoCounts[a.id] || 0;
                        var bPhotos = photoCounts[b.id] || 0;
                        return bPhotos - aPhotos;
                    default:
                        return 0;
                }
            });

            renderVehicles(filteredVehicles);
        }

        function setSourceFilter(source) {
            currentSourceFilter = source;
            document.querySelectorAll('[data-source]').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.source === source);
            });
            applyFilters();
        }

        // ============================================================
        //  获取车型显示名称
        // ============================================================
        function getModelDisplay(vehicle) {
            // 如果有 model 字段，直接使用
            if (vehicle.model) {
                return vehicle.model;
            }
            // 如果有 model_id，从缓存中查找
            if (vehicle.model_id) {
                var cached = vehicleModelsCache.find(function(m) { return m.id == vehicle.model_id; });
                if (cached) {
                    return cached.name;
                }
            }
            return null;
        }

        // ============================================================
        //  获取车辆封面图
        // ============================================================
        function getVehicleCover(v) {
            if (v.cover_photo) return v.cover_photo;
            if (v.photos && v.photos.length > 0) return v.photos[0];
            if (vehicleCovers[v.id]) return vehicleCovers[v.id];
            return null;
        }

        // ============================================================
        //  懒加载图片
        // ============================================================
        function lazyLoadImages() {
            if (!('IntersectionObserver' in window)) {
                document.querySelectorAll('.lazy-img[data-src]').forEach(function(img) {
                    var src = img.dataset.src;
                    if (src) {
                        img.src = src;
                        img.onload = function() { img.classList.add('loaded'); };
                    }
                });
                return;
            }

            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        var img = entry.target;
                        var src = img.dataset.src;
                        if (src) {
                            img.src = src;
                            img.onload = function() { img.classList.add('loaded'); };
                            img.onerror = function() {
                                img.classList.add('loaded');
                                img.style.background = '#f5f7fa';
                            };
                            observer.unobserve(img);
                        }
                    }
                });
            }, {
                rootMargin: '100px',
                threshold: 0.01
            });

            document.querySelectorAll('.lazy-img[data-src]').forEach(function(img) {
                observer.observe(img);
            });
        }

        // ============================================================
        //  渲染车辆卡片
        // ============================================================
        function renderVehicles(vehicles) {
            var grid = document.getElementById('vehicleGrid');

            if (!vehicles || vehicles.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state"><span class="icon">🚌</span><p>没有找到匹配的巴士</p><div class="sub">试试调整筛选条件</div></div>';
                return;
            }

            var html = '';
            vehicles.forEach(function(v, index) {
                var coverPhoto = getVehicleCover(v);
                var photoCount = photoCounts[v.id] || 0;
                var isOfficial = v.data_source === 'official' || v.verified === true;
                var sourceClass = isOfficial ? 'official' : 'user';
                var sourceLabel = isOfficial ? '🏢 官方认证' : '👤 用户投稿';
                var statusLabel = getStatusLabel(v.service_status);
                var statusClass = getStatusClass(v.service_status);
                var operatorName = getOperatorName(v.operator_id);
                var modelDisplay = getModelDisplay(v);
                var typeLabel = getVehicleTypeLabel(v.vehicle_type);

                // 标题显示
                var displayName = '';
                if (v.license_plate) {
                    displayName = '<span class="plate-text">' + escapeHtml(v.license_plate) + '</span>';
                } else if (v.fleet_number) {
                    displayName = '<span class="fleet-number">' + escapeHtml(v.fleet_number) + '</span>';
                } else if (v.model) {
                    displayName = escapeHtml(v.model);
                } else {
                    displayName = '未命名巴士';
                }

                // 封面图（懒加载）
                var thumbHtml = '';
                if (coverPhoto) {
                    thumbHtml = '<img class="lazy-img" data-src="' + escapeHtml(coverPhoto) + '" alt="' + escapeHtml(v
                        .license_plate || v.fleet_number || v.model || '巴士') + '" />';
                } else {
                    thumbHtml = '<div class="lazy-img placeholder">🚌</div>';
                }

                // 车型显示
                var modelHtml = '';
                if (modelDisplay) {
                    modelHtml = '<div class="vehicle-model"><span class="model-tag">🚌 ' + escapeHtml(modelDisplay) +
                        '</span></div>';
                }

                // 地区信息
                var locationParts = [];
                if (v.country_name) locationParts.push(v.country_name);
                if (v.province_name) locationParts.push(v.province_name);
                if (v.city_name) locationParts.push(v.city_name);
                var locationText = locationParts.length > 0 ? locationParts.join(' → ') : '📍 位置未标注';

                // 使用延迟动画
                var delay = Math.min(index * 0.05, 0.5);

                html +=
                    '<div class="vehicle-card" style="animation-delay:' + delay + 's" onclick="window.location.href=\'vehicle.html?id=' +
                    v.id + '\'">' +
                    '<div class="card-thumb">' +
                    thumbHtml +
                    '<div class="badges">' +
                    '<span class="badge ' + sourceClass + '">' + sourceLabel + '</span>' +
                    (v.service_status ? '<span class="badge ' + statusClass + '">' + statusLabel + '</span>' : '') +
                    '</div>' +
                    (photoCount > 0 ? '<span class="photo-count">📸 ' + photoCount + ' 张</span>' : '') +
                    '</div>' +
                    '<div class="card-body">' +
                    '<div class="vehicle-name">' + displayName + '</div>' +
                    modelHtml +
                    (operatorName ? '<div class="vehicle-operator">🏢 ' + escapeHtml(operatorName) + '</div>' : '') +
                    '<div class="vehicle-location">📍 ' + escapeHtml(locationText) + '</div>' +
                    '<div class="vehicle-meta">' +
                    (v.manufacturer ? '<span>🏭 ' + escapeHtml(v.manufacturer) + '</span>' : '') +
                    (v.vehicle_type ? '<span>🚌 ' + typeLabel + '</span>' : '') +
                    (v.livery_name ? '<span>🎨 ' + escapeHtml(v.livery_name) + '</span>' : '') +
                    '</div>' +
                    '<div class="vehicle-stats">' +
                    '<span>👁️ <span class="num">' + (v.views || 0) + '</span></span>' +
                    '<span>❤️ <span class="num">' + (v.likes || 0) + '</span></span>' +
                    '<span>📸 <span class="num">' + photoCount + '</span></span>' +
                    '<span style="margin-left:auto;color:#bbb;">' + formatDate(v.created_at) + '</span>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
            });

            grid.innerHTML = html;

            // 启动懒加载
            setTimeout(function() {
                lazyLoadImages();
            }, 100);

            // 滚动加载更多
            setupInfiniteScroll();
        }

        // ============================================================
        //  无限滚动加载更多
        // ============================================================
        var scrollObserver = null;

        function setupInfiniteScroll() {
            if (scrollObserver) {
                scrollObserver.disconnect();
                scrollObserver = null;
            }

            var sentinel = document.querySelector('.scroll-sentinel');
            if (!sentinel && hasMoreData && allVehicles.length > 0) {
                var grid = document.getElementById('vehicleGrid');
                var sentinelEl = document.createElement('div');
                sentinelEl.className = 'scroll-sentinel';
                sentinelEl.style.cssText = 'grid-column:1/-1;height:20px;text-align:center;color:#999;font-size:12px;padding:10px 0;';
                sentinelEl.textContent = '⏳ 加载更多...';
                grid.appendChild(sentinelEl);
            }

            var sentinelEl = document.querySelector('.scroll-sentinel');
            if (!sentinelEl) return;

            if ('IntersectionObserver' in window) {
                scrollObserver = new IntersectionObserver(function(entries) {
                    if (entries[0].isIntersecting && hasMoreData && !isLoadingMore) {
                        loadVehicles(false);
                    }
                }, {
                    rootMargin: '200px',
                    threshold: 0.1
                });
                scrollObserver.observe(sentinelEl);
            }
        }

        // ============================================================
        //  辅助函数
        // ============================================================
        function getOperatorName(id) {
            if (!id) return null;
            var op = operators.find(function(o) { return o.id == id; });
            return op ? (op.short_name || op.name) : null;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '未知';
            try {
                var d = new Date(dateStr);
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            } catch (e) {
                return dateStr;
            }
        }

        function refreshData() {
            showToast('⟳ 刷新中...', '');
            loadVehicles(true);
        }

        // ============================================================
        //  启动
        // ============================================================
        renderNav();
        loadVehicles(true);

        console.log('🚌 巴士档案主页已加载（懒加载 + 车型关联）');
        console.log('✅ 车型从 vehicle_models 表关联显示');
        console.log('✅ 图片懒加载，滚动时自动加载');
        console.log('✅ 无限滚动分页加载（每页20辆）');
        console.log('✅ 入口：🌍 上传地区 | 🏢 上传公司 | 🚌 上传线路');
    </script>
</body>
</html>
