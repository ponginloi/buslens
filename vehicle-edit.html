        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            border: 1px solid rgba(255, 255, 255, 0.1);

            pointer-events: none;

            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            border-color: #4caf50;
        }
        .toast.error {
            border-color: #f44336;
        }

        /* ===== Lightbox ===== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 99998;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .lightbox.active {
            display: flex;

        .lightbox img {

            object-fit: contain;

        }
        .lightbox .close-lightbox {
            position: absolute;
            top: 16px;
            right: 20px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .lightbox .close-lightbox:hover {
            transform: scale(1.2);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {

            .navbar .nav-links a {

            }
            .vehicle-detail .cover-section {

            .vehicle-detail .info-section {
                padding: 16px 18px 20px;
            }
            .vehicle-detail .info-section .header-row .title {

                font-size: 13px;
            }
            .spot-map-section .map-header .view-all {

    </style>

<body>

    <div class="container">
        <!-- 导航栏 -->
        <nav class="navbar">
            <a href="index.html" class="brand"><span>🚌</span> BusLens</a>
            <div class="nav-links" id="navLinks"></div>
        </nav>

        <!-- 返回栏 -->
        <div class="back-bar">
            <a href="vehicles.html">← 返回巴士档案</a>
            <div class="actions">
                <button class="btn-suggest" onclick="suggestEdit()">✏️ 建议修改</button>
                <button class="btn-edit" onclick="editVehicle()">📝 编辑</button>
            </div>
        </div>

        <!-- 详情内容 -->
        <div id="vehicleContent">
            <div class="loading-state">
                <span class="spinner">⟳</span>
                <p>加载车辆信息...</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox">×</span>
        <img id="lightboxImg" src="" alt="预览">
    </div>

    <script>
        // ============================================================
        //  Supabase 客户端
        // ============================================================
        var supabaseClient = null;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  用户状态
        // ============================================================
        function getCurrentUser() {
            try {
                var raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            window.location.href = 'index.html';
        }

        function renderNav() {
            var nav = document.getElementById('navLinks');
            var user = getCurrentUser();
            if (user) {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="profile.html">👤 个人中心</a>' +
                    '<a href="upload.html">📤 新机位</a>' +
                    '<span class="user-name">👤 ' + escapeHtml(user.username) + '</span>' +
                    '<button class="btn-logout" onclick="logout()">退出</button>';
            } else {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="login.html">登录</a>' +
                    '<a href="register.html">注册</a>';
            }
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(text, type) {
            var el = document.getElementById('toast');
            el.textContent = text;
            el.className = 'toast ' + (type || '') + ' show';
            clearTimeout(el._timer);
            el._timer = setTimeout(function() {
                el.className = 'toast';
            }, 3000);
        }

        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        function getStatusLabel(status) {
            var map = {
                active: '🚀 运营中',
                retired: '🔄 已退役',
                preserved: '🏛️ 保留/收藏',
                scrapped: '💔 已报废',
                unknown: '❓ 未知'
            };
            return map[status] || status || '未知';
        }

        function getStatusClass(status) {
            var map = {
                active: 'active',
                retired: 'retired',
                preserved: 'preserved',
                scrapped: 'retired'
            };
            return map[status] || '';
        }

        function getSourceLabel(source) {
            var map = {
                official: '🏢 官方认证',
                user: '👤 用户投稿',
                mixed: '📋 混合来源'
            };
            return map[source] || source || '👤 用户投稿';
        }

        function getSourceClass(source) {
            var map = {
                official: 'official',
                user: 'user',
                mixed: 'user'
            };
            return map[source] || 'user';
        }

        function getVehicleTypeLabel(type) {
            var map = {
                single_decker: '单层巴士',
                double_decker: '双层巴士',
                articulated: '铰接巴士',
                minibus: '小巴',
                coach: '旅游大巴',
                electric: '纯电动巴士',
                hybrid: '混动巴士',
                trolleybus: '无轨电车'
            };
            return map[type] || type || '巴士';
        }

        function getRankLabel(rank) {
            var map = {
                high: '上等 ⭐⭐⭐',
                medium: '中等 ⭐⭐',
                low: '下等 ⭐'
            };
            return map[rank] || rank;
        }

        function getRankClass(rank) {
            var map = {
                high: 'high',
                medium: 'medium',
                low: 'low'
            };
            return map[rank] || '';
        }

        // ============================================================
        //  获取车辆详情
        // ============================================================
        var vehicleData = null;
        var operators = [];
        var relatedSpots = [];

        function getVehicleId() {
            var params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function loadVehicle() {
            var id = getVehicleId();
            if (!id) {
                document.getElementById('vehicleContent').innerHTML =
                    '<div class="empty-state"><span class="icon">❌</span><p>未指定车辆 ID</p><div class="sub"><a href="vehicles.html">返回档案列表</a></div></div>';
                return;
            }

            // 加载运营商列表
            supabaseClient
                .from('operators')
                .select('*')
                .then(function(res) {
                    if (!res.error) {
                        operators = res.data || [];
                    }
                })
                .catch(function(err) {
                    console.warn('加载运营商失败:', err);
                });

            // 加载车辆详情
            supabaseClient
                .from('vehicles')
                .select('*')
                .eq('id', id)
                .single()
                .then(function(res) {
                    if (res.error) {
                        if (res.error.code === 'PGRST116') {
                            document.getElementById('vehicleContent').innerHTML =
                                '<div class="empty-state"><span class="icon">🔍</span><p>未找到该车辆</p><div class="sub">车辆可能已被删除或 ID 不正确</div></div>';
                        } else {
                            throw new Error(res.error.message);
                        }
                        return;
                    }
                    vehicleData = res.data;
                    // 更新浏览量
                    supabaseClient
                        .from('vehicles')
                        .update({ views: (vehicleData.views || 0) + 1 })
                        .eq('id', id)
                        .then(function() {})
                        .catch(function(err) {
                            console.warn('更新浏览量失败:', err);
                        });
                    // 加载关联机位
                    loadRelatedSpots();
                    renderVehicle();
                })
                .catch(function(error) {
                    console.error('加载车辆失败:', error);
                    document.getElementById('vehicleContent').innerHTML =
                        '<div class="empty-state"><span class="icon">❌</span><p>加载失败：' + escapeHtml(error.message) +
                        '</p></div>';
                });
        }

        function loadRelatedSpots() {
            if (!vehicleData) return;
            // 如果有 related_spot_ids，加载这些机位
            var spotIds = vehicleData.related_spot_ids || [];
            if (spotIds.length === 0) {
                relatedSpots = [];
                return;
            }
            supabaseClient
                .from('spots')
                .select('id, name, lng, lat, rank, status')
                .in('id', spotIds)
                .then(function(res) {
                    if (res.error) {
                        console.warn('加载关联机位失败:', res.error);
                        return;
                    }
                    relatedSpots = res.data || [];
                    renderSpotMap();
                })
                .catch(function(err) {
                    console.warn('加载关联机位失败:', err);
                });
        }

        // ============================================================
        //  渲染车辆详情
        // ============================================================
        function renderVehicle() {
            var v = vehicleData;
            if (!v) return;

            var isOfficial = v.data_source === 'official' || v.verified === true;
            var sourceClass = getSourceClass(v.data_source);
            var sourceLabel = getSourceLabel(v.data_source);
            var statusLabel = getStatusLabel(v.service_status);
            var statusClass = getStatusClass(v.service_status);
            var typeLabel = getVehicleTypeLabel(v.vehicle_type);
            var rankLabel = getRankLabel(v.rank);
            var rankClass = getRankClass(v.rank);

            var operatorName = getOperatorName(v.current_operator_id);
            var formerOperators = (v.former_operator_ids || []).map(function(id) {
                return getOperatorName(id);
            }).filter(function(name) { return name; });

            var coverPhoto = v.cover_photo || (v.photos && v.photos.length > 0 ? v.photos[0] : null);
            var photos = v.photos || [];

            // 封面图
            var coverHtml = '';
            if (coverPhoto) {
                coverHtml = '<img src="' + escapeHtml(coverPhoto) + '" alt="' + escapeHtml(v.fleet_number || v.model || '巴士') +
                    '" onclick="openLightbox(\'' + escapeHtml(coverPhoto) + '\')" />';
            } else {
                coverHtml = '<div class="no-image">🚌</div>';
            }

            // 基本信息网格
            var infoHtml = '';
            var infoItems = [
                { label: '车队编号', value: v.fleet_number || '-' },
                { label: '车牌号', value: v.license_plate || '-' },
                { label: '车型', value: v.model || '-' },
                { label: '制造商', value: v.manufacturer || '-' },
                { label: '车辆类型', value: typeLabel },
                { label: '等级', value: rankLabel ? '<span class="tag ' + rankClass + '">' + rankLabel + '</span>' : '-' },
                { label: '车长', value: v.length ? v.length + ' 米' : '-' },
                { label: '载客量', value: v.total_capacity ? v.total_capacity + ' 人' : '-' },
                { label: '运营公司', value: operatorName || '-' },
                { label: '前属公司', value: formerOperators.length > 0 ? formerOperators.join('、') : '-' },
                { label: '服役状态', value: statusLabel },
                { label: '投入日期', value: v.service_start_date || '-' },
                { label: '退役日期', value: v.service_end_date || '-' },
                { label: '退役原因', value: v.retirement_reason || '-' },
                { label: '涂装名称', value: v.livery_name || '-' },
                { label: '涂装颜色', value: v.livery_colors && v.livery_colors.length > 0 ?
                    v.livery_colors.map(function(c) {
                        return '<span class="livery-color" style="background:' + c + ';"></span>';
                    }).join(' ') :
                    '-'
                },
            ];

            infoHtml = infoItems.map(function(item) {
                return '<div class="info-item">' +
                    '<span class="label">' + item.label + '</span>' +
                    '<span class="value">' + item.value + '</span>' +
                    '</div>';
            }).join('');

            // 描述
            var descHtml = '';
            if (v.description) {
                descHtml = '<div class="description-box">' +
                    '<div class="label">📝 描述</div>' +
                    '<div class="content">' + escapeHtml(v.description) + '</div>' +
                    '</div>';
            }

            // 照片墙
            var photoHtml = '';
            if (photos.length > 0) {
                var photoItems = photos.map(function(url) {
                    return '<div class="photo-item" onclick="openLightbox(\'' + escapeHtml(url) + '\')">' +
                        '<img src="' + escapeHtml(url) + '" loading="lazy" />' +
                        '</div>';
                }).join('');
                photoHtml = '<div class="photo-wall">' +
                    '<div class="section-title">📸 照片墙 <span class="count">共 ' + photos.length + ' 张</span></div>' +
                    '<div class="photo-grid">' + photoItems + '</div>' +
                    '</div>';
            } else {
                photoHtml = '<div class="photo-wall"><div class="section-title">📸 照片墙 <span class="count">暂无照片</span></div>' +
                    '<div class="photo-empty">还没有上传照片</div></div>';
            }

            // 机位地图占位
            var spotMapHtml = '<div class="spot-map-section" id="spotMapSection">' +
                '<div class="map-header">' +
                '<div class="title">🗺️ 出现机位 <span class="count" id="spotCount">' + (relatedSpots.length || 0) +
                ' 个</span></div>' +
                '<a href="vehicles.html?spot_id=' + v.id + '" class="view-all">查看全部 →</a>' +
                '</div>' +
                '<div id="spotMapContainer">' +
                '<div class="map-placeholder" id="spotMapPlaceholder">' +
                '<span class="icon">🗺️</span>' +
                '<p>加载地图中...</p>' +
                '</div>' +
                '</div>' +
                '</div>';

            // 贡献者
            var contributorHtml = '';
            var contributors = [];
            if (v.created_by) contributors.push({ name: v.created_by, role: '创建者' });
            // TODO: 从 vehicle_contributors 表读取更多贡献者
            if (contributors.length > 0) {
                contributorHtml = '<div class="contributors-section">' +
                    '<div class="title">👥 贡献者</div>' +
                    '<div class="contributors-list">' +
                    contributors.map(function(c) {
                        return '<span class="contributor">👤 ' + escapeHtml(c.name) +
                            ' <span class="role">' + escapeHtml(c.role) + '</span></span>';
                    }).join('') +
                    '</div>' +
                    '</div>';
            }

            // 组装完整 HTML
            var html = '';
            html += '<div class="vehicle-detail">';
            html += '<div class="cover-section">' +
                coverHtml +
                '<div class="cover-badges">' +
                '<span class="badge ' + sourceClass + '">' + sourceLabel + '</span>' +
                (v.service_status ? '<span class="badge ' + statusClass + '">' + statusLabel + '</span>' : '') +
                (v.verified ? '<span class="badge official">✅ 已验证</span>' : '') +
                '</div>' +
                '</div>';

            html += '<div class="info-section">';
            html += '<div class="header-row">' +
                '<div class="title">' +
                (v.fleet_number ? '<span class="fleet">' + escapeHtml(v.fleet_number) + '</span>' : '') +
                (v.model ? escapeHtml(v.model) : '未命名巴士') +
                (v.license_plate ? '<span class="plate">' + escapeHtml(v.license_plate) + '</span>' : '') +
                '</div>' +
                '<div class="stats">' +
                '<span>👁️ <span class="num">' + (v.views || 0) + '</span></span>' +
                '<span>❤️ <span class="num">' + (v.likes || 0) + '</span></span>' +
                '<span>📸 <span class="num">' + photos.length + '</span></span>' +
                '<span>📍 <span class="num">' + (relatedSpots.length || 0) + '</span></span>' +
                '</div>' +
                '</div>';

            html += '<div class="info-grid">' + infoHtml + '</div>';
            html += descHtml;
            html += photoHtml;
            html += spotMapHtml;
            html += contributorHtml;
            html += '</div>';
            html += '</div>';

            document.getElementById('vehicleContent').innerHTML = html;

            // 渲染机位地图
            renderSpotMap();

            // 更新导航
            renderNav();
        }

        // ============================================================
        //  获取运营商名称
        // ============================================================
        function getOperatorName(id) {
            if (!id) return null;
            var op = operators.find(function(o) { return o.id == id; });
            return op ? op.name : null;
        }

        // ============================================================
        //  渲染机位地图
        // ============================================================
        var spotMap = null;
        var spotMarkers = [];

        function renderSpotMap() {
            if (relatedSpots.length === 0) {
                var placeholder = document.getElementById('spotMapPlaceholder');
                if (placeholder) {
                    placeholder.innerHTML = '<span class="icon">📍</span><p>暂无关联机位</p>';
                }
                var count = document.getElementById('spotCount');
                if (count) count.textContent = '0 个';
                return;
            }

            var count = document.getElementById('spotCount');
            if (count) count.textContent = relatedSpots.length + ' 个';

            // 加载高德地图
            if (typeof AMap === 'undefined') {
                loadAmapForSpotMap();
                return;
            }
            initSpotMap();
        }

        function loadAmapForSpotMap() {
            fetch('https://keeybzxxkjxvlvhjjdpr.supabase.co/functions/v1/get-amap-config')
                .then(function(response) { return response.json(); })
                .then(function(config) {
                    if (!config || !config.key) {
                        console.error('❌ 获取高德配置失败');
                        return;
                    }
                    window._AMapSecurityConfig = {
                        securityJsCode: config.security
                    };
                    if (typeof AMap !== 'undefined') {
                        initSpotMap();
                        return;
                    }
                    var script = document.createElement('script');
                    script.src = 'https://webapi.amap.com/maps?v=2.0&key=' + config.key;
                    script.onload = function() {
                        console.log('✅ 高德地图加载成功（机位地图）');
                        initSpotMap();
                    };
                    script.onerror = function() {
                        console.error('❌ 高德地图加载失败');
                        var placeholder = document.getElementById('spotMapPlaceholder');
                        if (placeholder) {
                            placeholder.innerHTML = '<span class="icon">⚠️</span><p>地图加载失败</p>';
                        }
                    };
                    document.head.appendChild(script);
                })
                .catch(function(error) {
                    console.error('❌ 获取高德配置失败:', error);
                });
        }

        function initSpotMap() {
            if (typeof AMap === 'undefined') {
                console.error('❌ AMap 未加载');
                return;
            }

            var container = document.getElementById('spotMapContainer');
            if (!container) return;

            var placeholder = document.getElementById('spotMapPlaceholder');
            if (placeholder) placeholder.style.display = 'none';

            if (spotMap) {
                spotMap.destroy();
                spotMap = null;
                spotMarkers = [];
            }

            // 计算中心点
            var lngs = relatedSpots.map(function(s) { return s.lng; });
            var lats = relatedSpots.map(function(s) { return s.lat; });
            var centerLng = lngs.reduce(function(a, b) { return a + b; }, 0) / lngs.length;
            var centerLat = lats.reduce(function(a, b) { return a + b; }, 0) / lats.length;

            spotMap = new AMap.Map('spotMapContainer', {
                zoom: 12,
                center: [centerLng, centerLat],
                mapStyle: 'amap://styles/whitesmoke',
                viewMode: '2D',
                pitch: 0,
                showIndoorMap: false
            });

            // 添加标记
            relatedSpots.forEach(function(spot) {
                var color = spot.rank === 'high' ? '#ff4444' :
                    spot.rank === 'medium' ? '#ffbb33' : '#00c851';
                var markerContent = document.createElement('div');
                markerContent.style.cssText =
                    'width: 28px; height: 28px;' +
                    'background: ' + color + ';' +
                    'border-radius: 50%;' +
                    'border: 2px solid white;' +
                    'box-shadow: 0 2px 8px rgba(0,0,0,0.3);' +
                    'display: flex; align-items: center; justify-content: center;' +
                    'font-size: 12px; color: white; cursor: pointer;';
                markerContent.textContent = '📍';

                var marker = new AMap.Marker({
                    position: [spot.lng, spot.lat],
                    content: markerContent,
                    offset: new AMap.Pixel(-14, -14),
                    title: spot.name,
                });

                // 点击跳转到机位页面
                marker.on('click', function() {
                    window.open('index.html?spot_id=' + spot.id, '_blank');
                });

                spotMap.add(marker);
                spotMarkers.push(marker);
            });

            // 自适应视野
            if (relatedSpots.length > 1) {
                spotMap.setFitView(spotMarkers, false, [40, 40, 40, 40]);
            }

            console.log('✅ 机位地图加载完成，共 ' + relatedSpots.length + ' 个标记');
        }

        // ============================================================
        //  操作按钮
        // ============================================================
        function editVehicle() {
            var user = getCurrentUser();
            if (!user) {
                showToast('请先登录才能编辑', 'error');
                return;
            }
            var id = getVehicleId();
            if (id) {
                window.location.href = 'vehicle-edit.html?id=' + id;
            }
        }

        function suggestEdit() {
            var user = getCurrentUser();
            if (!user) {
                showToast('请先登录才能提交建议', 'error');
                return;
            }
            showToast('✏️ 建议修改功能开发中，敬请期待', '');
        }

        // ============================================================
        //  启动
        // ============================================================
        renderNav();
        loadVehicle();

        console.log('🚌 车辆详情页已加载');
        console.log('📋 显示车辆完整信息、照片墙、关联机位地图');
        console.log('🗺️ 机位地图使用高德地图展示');
    </script>

</body>
</html>
