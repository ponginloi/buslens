    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        .navbar .brand {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
        }
        .navbar .brand span {
            font-size: 24px;
        }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .navbar .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }
        .navbar .nav-links a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        .navbar .nav-links a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .navbar .nav-links .user-name {
            color: rgba(255, 255, 255, 0.85);
            padding: 5px 10px;
            font-size: 13px;
        }
        .navbar .nav-links .btn-logout {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .navbar .nav-links .btn-logout:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .back-bar {
            margin-bottom: 16px;
        }
        .back-bar a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-bar a:hover {
            text-decoration: underline;
        }

        .form-card {
            background: white;
            border-radius: 16px;
            padding: 32px 36px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .form-card .form-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .form-card .form-sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group label .required {
            color: #f44336;
        }
        .form-group label .hint-text {
            font-weight: 400;
            color: #999;
            font-size: 12px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
            font-family: inherit;
            background: #fff;
            color: #333;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1a73e8;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .section-divider {
            margin-top: 8px;
            padding-top: 14px;
            border-top: 1px solid #f0f0f0;
        }
        .section-divider .section-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .form-group .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-group .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            font-size: 14px;
            color: #555;
            cursor: pointer;
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .form-group .radio-group label:hover {
            border-color: #1a73e8;
        }
        .form-group .radio-group input[type="radio"] {
            accent-color: #1a73e8;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .form-group .radio-group input[type="radio"]:checked+span {
            font-weight: 500;
            color: #1a73e8;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .message.error {
            display: block;
            background: #fee8e8;
            color: #d32f2f;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .message.loading {
            display: block;
            background: #e8f0fe;
            color: #1a73e8;
        }
        .message.warning {
            display: block;
            background: #fff3e0;
            color: #e65100;
        }

        .photo-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));

            margin-top: 10px;
        }
        .photo-preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
            aspect-ratio: 4/3;
            background: #f5f5f5;
        }
        .photo-preview-item img {

        }
        .photo-preview-item .remove-photo-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.6);

            border-radius: 50%;

            font-size: 16px;

        .photo-preview-item .remove-photo-btn:hover {

        }

        }

        .toast {
            position: fixed;

            left: 50%;
            transform: translateX(-50%);

        }
        .toast.show {

        }
        .toast.success {

        }

            }

                padding: 20px 16px;
            }
            .form-card .form-title {
                font-size: 18px;
            }
        }
    </style>

    <script>
        // ============================================================
        //  Supabase 客户端
        // ============================================================
        var supabaseClient = null;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  用户状态
        // ============================================================
        function getCurrentUser() {
            try {
                var raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            window.location.href = 'index.html';
        }

        function renderNav() {
            var nav = document.getElementById('navLinks');
            var user = getCurrentUser();

            if (user) {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="profile.html">👤 个人中心</a>' +
                    '<a href="upload.html">📤 新机位</a>' +
                    '<span class="user-name">👤 ' + escapeHtml(user.username) + '</span>' +
                    '<button class="btn-logout" onclick="logout()">退出</button>';
            } else {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="login.html">登录</a>' +
                    '<a href="register.html">注册</a>';
            }
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(text, type) {
            var el = document.getElementById('toast');
            el.textContent = text;
            el.className = 'toast ' + (type || '') + ' show';
            clearTimeout(el._timer);
            el._timer = setTimeout(function() { el.className = 'toast'; }, 3000);
        }

        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        // ============================================================
        //  图片处理
        // ============================================================
        function processImageWithCanvas(file, options, username) {
            var defaults = {
                maxWidth: 1920,
                maxHeight: 1080,
                quality: 0.85,
                maxSizeMB: 4.5,
                barHeight: 50,
                watermarkText: 'BusLens',
                copyrightText: '© 2026 ' + (username || '用户') + ' 版权所有'
            };
            var opt = Object.assign({}, defaults, options);
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var width = img.width;
                        var height = img.height;
                        if (width > opt.maxWidth) {
                            height = height * opt.maxWidth / width;
                            width = opt.maxWidth;
                        }
                        if (height > opt.maxHeight) {
                            width = width * opt.maxHeight / height;
                            height = opt.maxHeight;
                        }
                        var finalWidth = Math.round(width);
                        var finalHeight = Math.round(height);
                        var barHeight = opt.barHeight;
                        var totalHeight = finalHeight + barHeight;
                        var canvas = document.createElement('canvas');
                        canvas.width = finalWidth;
                        canvas.height = totalHeight;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, finalWidth, finalHeight);
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(0, finalHeight, finalWidth, barHeight);
                        var fontSize = Math.max(11, Math.min(16, Math.round(finalWidth * 0.012)));
                        ctx.textBaseline = 'middle';
                        ctx.textAlign = 'left';
                        ctx.font = 'bold ' + fontSize + 'px Arial, sans-serif';
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText(opt.watermarkText, 14, finalHeight + barHeight / 2 + 1);
                        ctx.textAlign = 'right';
                        ctx.font = fontSize + 'px Arial, sans-serif';
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText(opt.copyrightText, finalWidth - 14, finalHeight + barHeight / 2 + 1);
                        var watermarkFontSize = Math.max(40, Math.min(90, Math.round(finalWidth * 0.048)));
                        ctx.save();
                        ctx.globalAlpha = 0.75;
                        ctx.font = 'bold ' + watermarkFontSize + 'px Arial, sans-serif';
                        ctx.textBaseline = 'bottom';
                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#FFFFFF';
                        var padding = Math.max(16, Math.round(finalWidth * 0.02));
                        ctx.fillText(opt.watermarkText, padding, finalHeight - padding);
                        ctx.restore();
                        var quality = opt.quality;
                        var needCompress = file.size > opt.maxSizeMB * 1024 * 1024;

                        function tryExport() {
                            canvas.toBlob(function(blob) {
                                if (needCompress && blob.size > opt.maxSizeMB * 1024 * 1024 && quality > 0.1) {
                                    quality -= 0.05;
                                    tryExport();
                                    return;
                                }
                                var originalName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
                                var processedFile = new File([blob], originalName, { type: 'image/jpeg' });
                                console.log('✅ 处理完成：' +
                                    (file.size / 1024 / 1024).toFixed(2) + 'MB → ' +
                                    (blob.size / 1024 / 1024).toFixed(2) + 'MB'
                                );
                                resolve(processedFile);
                            }, 'image/jpeg', quality);
                        }
                        tryExport();
                    };
                    img.onerror = function() { reject(new Error('图片加载失败')); };
                    img.src = e.target.result;
                };
                reader.onerror = function() { reject(new Error('文件读取失败')); };
                reader.readAsDataURL(file);
            });
        }

        async function uploadToImgBB(file) {
            var user = getCurrentUser();
            if (!user) throw new Error('请先登录再上传图片');
            var formData = new FormData();
            formData.append('image', file);
            var response = await fetch(
                'https://keeybzxxkjxvlvhjjdpr.supabase.co/functions/v1/upload-image', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + (user.access_token || '') },
                    body: formData
                }
            );
            var result = await response.json();
            if (!response.ok || !result.success) {
                throw new Error(result.error || '上传失败');
            }
            return result.url;
        }

        // ============================================================
        //  照片预览
        // ============================================================
        var coverPhotoFile = null;
        var morePhotoFiles = [];

        document.getElementById('coverPhoto').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            if (file.size > 50 * 1024 * 1024) {
                alert('照片大小不能超过 50MB');
                this.value = '';
                return;
            }
            coverPhotoFile = file;
            renderPhotoPreview();
        });

        document.getElementById('morePhotos').addEventListener('change', function(e) {
            var files = e.target.files;
            if (files.length === 0) return;
            if (morePhotoFiles.length + files.length > 10) {
                alert('最多只能上传 10 张照片');
                this.value = '';
                return;
            }
            for (var i = 0; i < files.length; i++) {
                if (files[i].size > 50 * 1024 * 1024) {
                    alert('单张照片不能超过 50MB');
                    this.value = '';
                    return;
                }
                morePhotoFiles.push(files[i]);
            }
            renderPhotoPreview();
            this.value = '';
        });

        function renderPhotoPreview() {
            var grid = document.getElementById('photoPreview');
            var allPhotos = [];

            if (coverPhotoFile) {
                allPhotos.push({ file: coverPhotoFile, isCover: true });
            }
            morePhotoFiles.forEach(function(f) {
                allPhotos.push({ file: f, isCover: false });
            });

            if (allPhotos.length === 0) {
                grid.style.display = 'none';
                grid.innerHTML = '';
                return;
            }

            grid.style.display = 'grid';
            grid.innerHTML = '';
            allPhotos.forEach(function(item, index) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    var div = document.createElement('div');
                    div.className = 'photo-preview-item';
                    var isCover = item.isCover ? '⭐ 封面' : '';
                    div.innerHTML =
                        '<img src="' + ev.target.result + '" />' +
                        '<button type="button" class="remove-photo-btn" onclick="removePhoto(' + index +
                        ')">×</button>' +
                        '<span class="photo-index">' + (index + 1) + '/' + allPhotos.length + (isCover ? ' 📌' : '') +
                        '</span>';
                    grid.appendChild(div);
                };
                reader.readAsDataURL(item.file);
            });
        }

        function removePhoto(index) {
            var allPhotos = [];
            if (coverPhotoFile) allPhotos.push({ file: coverPhotoFile, isCover: true });
            morePhotoFiles.forEach(function(f) {
                allPhotos.push({ file: f, isCover: false });
            });

            if (index < allPhotos.length) {
                var removed = allPhotos[index];
                if (removed.isCover) {
                    coverPhotoFile = null;
                    document.getElementById('coverPhoto').value = '';
                } else {
                    var moreIndex = index - (coverPhotoFile ? 1 : 0);
                    morePhotoFiles.splice(moreIndex, 1);
                }
                renderPhotoPreview();
            }
        }

        // ============================================================
        //  四级联动：国家 → 省份 → 城市 → 公司
        // ============================================================
        var countriesCache = [];
        var provincesCache = [];
        var citiesCache = [];
        var operatorsCache = [];

        function loadCountries() {
            supabaseClient
                .from('countries')
                .select('id, name')
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        countriesCache = res.data || [];
                        var select = document.getElementById('countrySelect');
                        select.innerHTML = '<option value="">请选择国家...</option>';
                        countriesCache.forEach(function(c) {
                            select.innerHTML += '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
                        });
                    }
                });
        }

        function loadProvinces() {
            var countryId = document.getElementById('countrySelect').value;
            var provinceSelect = document.getElementById('provinceSelect');
            var citySelect = document.getElementById('citySelect');
            var operatorSelect = document.getElementById('operatorSelect');

            citySelect.innerHTML = '<option value="">请先选择省份...</option>';
            operatorSelect.innerHTML = '<option value="">请先选择城市...</option>';

            if (!countryId) {
                provinceSelect.innerHTML = '<option value="">请先选择国家...</option>';
                return;
            }

            supabaseClient
                .from('provinces')
                .select('id, name')
                .eq('country_id', countryId)
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        provincesCache = res.data || [];
                        provinceSelect.innerHTML = '<option value="">请选择省份...</option>';
                        provincesCache.forEach(function(p) {
                            provinceSelect.innerHTML += '<option value="' + p.id + '">' + escapeHtml(p.name) +
                                '</option>';
                        });
                    }
                });
        }

        function loadCities() {
            var provinceId = document.getElementById('provinceSelect').value;
            var citySelect = document.getElementById('citySelect');
            var operatorSelect = document.getElementById('operatorSelect');

            operatorSelect.innerHTML = '<option value="">请先选择城市...</option>';

            if (!provinceId) {
                citySelect.innerHTML = '<option value="">请先选择省份...</option>';
                return;
            }

            supabaseClient
                .from('cities')
                .select('id, name')
                .eq('province_id', provinceId)
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        citiesCache = res.data || [];
                        citySelect.innerHTML = '<option value="">请选择城市...</option>';
                        citiesCache.forEach(function(c) {
                            citySelect.innerHTML += '<option value="' + c.id + '">' + escapeHtml(c.name) +
                                '</option>';
                        });
                    }
                });
        }

        function loadOperators() {
            var cityId = document.getElementById('citySelect').value;
            var operatorSelect = document.getElementById('operatorSelect');

            if (!cityId) {
                operatorSelect.innerHTML = '<option value="">请先选择城市...</option>';
                return;
            }

            supabaseClient
                .from('operators')
                .select('id, name, short_name')
                .eq('city_id', cityId)
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        operatorsCache = res.data || [];
                        operatorSelect.innerHTML = '<option value="">请选择运营公司...</option>';
                        operatorsCache.forEach(function(op) {
                            var displayName = op.short_name || op.name;
                            operatorSelect.innerHTML += '<option value="' + op.id + '">' + escapeHtml(displayName) +
                                '</option>';
                        });
                    }
                });
        }

        // ============================================================
        //  加载路线（根据城市）
        // ============================================================
        function loadRoutes() {
            var cityId = document.getElementById('citySelect').value;
            var routeSelect = document.getElementById('routeSelect');

            if (!cityId) {
                routeSelect.innerHTML = '<option value="">请先选择城市...</option>';
                return;
            }

            supabaseClient
                .from('routes')
                .select('id, route_number, operator_name')
                .eq('city_id', cityId)
                .eq('status', 'approved')
                .order('route_number')
                .then(function(res) {
                    if (!res.error) {
                        routeSelect.innerHTML = '<option value="">请选择路线...</option>';
                        (res.data || []).forEach(function(r) {
                            var label = r.route_number;
                            if (r.operator_name) label += ' (' + r.operator_name + ')';
                            routeSelect.innerHTML += '<option value="' + r.id + '">' + escapeHtml(label) +
                                '</option>';
                        });
                    }
                });
        }

        // 当城市变化时，同时加载公司和路线
        var originalLoadOperators = loadOperators;
        loadOperators = function() {
            originalLoadOperators();
            loadRoutes();
        };

        // ============================================================
        //  提交表单
        // ============================================================
        document.getElementById('vehicleForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var user = getCurrentUser();
            if (!user) {
                showMessage('❌ 请先登录再创建车辆档案', 'error');
                return;
            }

            var model = document.getElementById('model').value.trim();
            if (!model) {
                showMessage('❌ 请填写车型', 'error');
                return;
            }

            // 验证地区
            var countryId = document.getElementById('countrySelect').value;
            var provinceId = document.getElementById('provinceSelect').value;
            var cityId = document.getElementById('citySelect').value;
            var operatorId = document.getElementById('operatorSelect').value;

            if (!countryId) { showMessage('❌ 请选择国家/地区', 'error'); return; }
            if (!provinceId) { showMessage('❌ 请选择省份/州', 'error'); return; }
            if (!cityId) { showMessage('❌ 请选择城市', 'error'); return; }

            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 提交中...';
            showMessage('⏳ 正在处理...', 'loading');

            try {
                // 上传封面照片
                var coverUrl = null;
                if (coverPhotoFile) {
                    var processedCover = await processImageWithCanvas(coverPhotoFile, {
                        maxWidth: 1920,
                        maxHeight: 1080,
                        quality: 0.85,
                        maxSizeMB: 4.5,
                        barHeight: 50,
                        watermarkText: 'BusLens',
                        copyrightText: '© 2026 ' + user.username + ' 版权所有'
                    }, user.username);
                    coverUrl = await uploadToImgBB(processedCover);
                }

                // 上传更多照片
                var photoUrls = [];
                if (morePhotoFiles.length > 0) {
                    for (var i = 0; i < morePhotoFiles.length; i++) {
                        var processedPhoto = await processImageWithCanvas(morePhotoFiles[i], {
                            maxWidth: 1920,
                            maxHeight: 1080,
                            quality: 0.85,
                            maxSizeMB: 4.5,
                            barHeight: 50,
                            watermarkText: 'BusLens',
                            copyrightText: '© 2026 ' + user.username + ' 版权所有'
                        }, user.username);
                        var url = await uploadToImgBB(processedPhoto);
                        photoUrls.push(url);
                    }
                }

                // 构建数据
                var data = {
                    fleet_number: document.getElementById('fleetNumber').value.trim() || null,
                    license_plate: document.getElementById('licensePlate').value.trim() || null,
                    model: model,
                    manufacturer: document.getElementById('manufacturer').value.trim() || null,
                    vehicle_type: document.getElementById('vehicleType').value || null,
                    rank: document.getElementById('rank').value || null,
                    length: parseFloat(document.getElementById('length').value) || null,
                    total_capacity: parseInt(document.getElementById('totalCapacity').value) || null,

                    // 地区
                    country_id: countryId || null,
                    province_id: provinceId || null,
                    city_id: cityId || null,

                    // 公司
                    operator_id: operatorId || null,

                    // 路线
                    route_id: document.getElementById('routeSelect').value || null,
                    route_type: document.getElementById('routeType').value || null,

                    // 运营信息
                    service_status: document.getElementById('serviceStatus').value || 'active',
                    service_start_date: document.getElementById('serviceStartDate').value || null,
                    service_end_date: document.getElementById('serviceEndDate').value || null,
                    retirement_reason: document.getElementById('retirementReason').value.trim() || null,

                    // 涂装
                    livery_name: document.getElementById('liveryName').value.trim() || null,
                    livery_colors: document.getElementById('liveryColors').value.trim() ? [document.getElementById(
                        'liveryColors').value.trim()] : null,
                    livery_description: document.getElementById('liveryDescription').value.trim() || null,

                    // 描述
                    description: document.getElementById('description').value.trim() || null,

                    // 照片
                    cover_photo: coverUrl,
                    photos: photoUrls.length > 0 ? photoUrls : null,

                    // 元数据
                    created_by: user.username,
                    data_source: 'user',
                    status: 'pending',
                    created_at: new Date().toISOString()
                };

                // 提交到数据库
                var { error } = await supabaseClient
                    .from('vehicles')
                    .insert([data]);

                if (error) throw new Error(error.message);

                showMessage('✅ 车辆档案已提交，等待管理员审核！', 'success');
                btn.textContent = '✅ 已提交';

                // 重置表单
                document.getElementById('vehicleForm').reset();
                coverPhotoFile = null;
                morePhotoFiles = [];
                renderPhotoPreview();

                // 重置地区选择
                document.getElementById('countrySelect').selectedIndex = 0;
                document.getElementById('provinceSelect').innerHTML = '<option value="">请先选择国家...</option>';
                document.getElementById('citySelect').innerHTML = '<option value="">请先选择省份...</option>';
                document.getElementById('operatorSelect').innerHTML = '<option value="">请先选择城市...</option>';
                document.getElementById('routeSelect').innerHTML = '<option value="">请先选择城市...</option>';

                setTimeout(function() {
                    window.location.href = 'vehicles.html';
                }, 2000);

            } catch (error) {
                console.error('提交失败:', error);
                showMessage('❌ 提交失败：' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '📤 提交审核';
            }
        });

        // ============================================================
        //  启动
        // ============================================================
        renderNav();
        loadCountries();

        console.log('🚌 车辆档案创建页面已加载');
        console.log('✅ 四级联动：国家→省份→城市→公司');
        console.log('✅ 路线从数据库选择');
        console.log('✅ 路线类型下拉选择');
        console.log('✅ 其他字段自由填写');
    </script>
</body>
</html>
