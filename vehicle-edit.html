        .loading-spinner {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .loading-spinner .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-size: 32px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            border-color: #4caf50;
        }
        .toast.error {
            border-color: #f44336;
        }

                <button class="btn-secondary" onclick="refreshData()">⟳ 刷新</button>
            </div>
        </div>

        <!-- 统计条 -->
        <div class="stats-row" id="statsRow">
            <div class="stat-item">
                <div class="num" id="statVehicles">0</div>
                <div class="label">🚌 车辆</div>
            </div>
            <div class="stat-item">
                <div class="num" id="statPhotos">0</div>
                <div class="label">📸 照片档案</div>
            </div>
            <div class="stat-item">
                <div class="num" id="statOperators">0</div>
                <div class="label">🏢 运营公司</div>
            </div>
            <div class="stat-item">
                <div class="num" id="statModels">0</div>
                <div class="label">🚌 车型</div>
            </div>
        </div>

        <!-- Tab 栏 -->
        <div class="tab-bar">
            <button class="tab active" data-tab="vehicles" onclick="switchTab('vehicles')">
                🚌 车辆档案 <span class="badge" id="vehicleBadge">0</span>
            </button>
            <button class="tab" data-tab="photos" onclick="switchTab('photos')">
                📸 照片档案 <span class="badge" id="photoBadge">0</span>
            </button>
        </div>

        <!-- Tab 内容 -->
        <div id="tabVehicles" class="tab-content active">
            <!-- 车辆筛选栏 -->
            <div class="filter-bar" id="vehicleFilterBar">
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="vehicleSearchInput" placeholder="搜索车队编号、车牌、型号..." oninput="applyVehicleFilters()">
                </div>
                <div class="filter-group">
                    <label>📌 来源</label>
                    <select id="vehicleSourceFilter" onchange="applyVehicleFilters()">
                        <option value="all">全部</option>
                        <option value="official">官方</option>
                        <option value="user">用户</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>📊 状态</label>
                    <select id="vehicleStatusFilter" onchange="applyVehicleFilters()">
                        <option value="all">全部状态</option>
                        <option value="active">运营中</option>
                        <option value="retired">已退役</option>
                        <option value="preserved">保留/收藏</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>🏢 公司</label>
                    <select id="vehicleOperatorFilter" onchange="applyVehicleFilters()">
                        <option value="all">全部公司</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>📐 排序</label>
                    <select id="vehicleSortFilter" onchange="applyVehicleFilters()">
                        <option value="newest">最新添加</option>
                        <option value="oldest">最早添加</option>
                        <option value="views">最多浏览</option>
                        <option value="likes">最多点赞</option>
                        <option value="photos">最多照片</option>
                    </select>
                </div>
            </div>
            <div class="vehicle-grid" id="vehicleGrid">
                <div class="loading-spinner">
                    <span class="spinner">⟳</span>
                    <p style="margin-top:8px;">加载车辆档案...</p>
                </div>
            </div>
        </div>

        <div id="tabPhotos" class="tab-content">
            <!-- 照片筛选栏 -->
            <div class="filter-bar" id="photoFilterBar">
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="photoSearchInput" placeholder="搜索车牌号、线路、公司..." oninput="applyPhotoFilters()">
                </div>
                <div class="filter-group">
                    <label>🏢 公司</label>
                    <select id="photoOperatorFilter" onchange="applyPhotoFilters()">
                        <option value="all">全部公司</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>🌍 地区</label>
                    <select id="photoRegionFilter" onchange="applyPhotoFilters()">
                        <option value="all">全部地区</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>📐 排序</label>
                    <select id="photoSortFilter" onchange="applyPhotoFilters()">
                        <option value="newest">最新上传</option>
                        <option value="oldest">最早上传</option>
                        <option value="views">最多浏览</option>
                    </select>
                </div>
            </div>
            <div class="photo-archive-grid" id="photoGrid">
                <div class="loading-spinner">
                    <span class="spinner">⟳</span>
                    <p style="margin-top:8px;">加载照片档案...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox">×</span>
        <img id="lightboxImg" src="" alt="预览">
    </div>

    <script>
        // ============================================================
        //  Supabase 客户端
        // ============================================================
        var supabaseClient = null;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  用户状态
        // ============================================================
        function getCurrentUser() {
            try {
                var raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            window.location.href = 'index.html';
        }

        function renderNav() {
            var nav = document.getElementById('navLinks');
            var user = getCurrentUser();

            if (user) {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="profile.html">👤 个人中心</a>' +
                    '<a href="upload.html">📤 新机位</a>' +
                    '<span class="user-name">👤 ' + escapeHtml(user.username) + '</span>' +
                    '<button class="btn-logout" onclick="logout()">退出</button>';
            } else {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="login.html">登录</a>' +
                    '<a href="register.html">注册</a>';
            }
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(text, type) {
            var el = document.getElementById('toast');
            el.textContent = text;
            el.className = 'toast ' + (type || '') + ' show';
            clearTimeout(el._timer);
            el._timer = setTimeout(function() { el.className = 'toast'; }, 3000);
        }

        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        function getStatusLabel(status) {
            var map = {
                active: '🚀 运营中',
                retired: '🔄 已退役',
                preserved: '🏛️ 保留/收藏',
                scrapped: '💔 已报废'
            };
            return map[status] || status || '未知';
        }

        function getStatusClass(status) {
            var map = { active: 'active-status', retired: 'retired-status', preserved: 'preserved-status' };
            return map[status] || '';
        }

        function getSourceLabel(source) {
            var map = { official: '🏢 官方认证', user: '👤 用户投稿' };
            return map[source] || source || '用户投稿';
        }

        function getSourceClass(source) {
            var map = { official: 'official', user: 'user' };
            return map[source] || 'user';
        }

        function getVehicleTypeLabel(type) {
            var map = {
                single_decker: '单层巴士',
                double_decker: '双层巴士',
                articulated: '铰接巴士',
                minibus: '小巴',
                coach: '旅游大巴',
                electric: '纯电动巴士',
                hybrid: '混动巴士',
                trolleybus: '无轨电车'
            };
            return map[type] || type || '巴士';
        }

        // ============================================================
        //  数据状态
        // ============================================================
        var allVehicles = [];
        var filteredVehicles = [];
        var allPhotos = [];
        var filteredPhotos = [];
        var operators = [];
        var regions = [];

        // ============================================================
        //  Tab 切换
        // ============================================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-bar .tab').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            document.querySelectorAll('.tab-content').forEach(function(el) {
                el.classList.remove('active');
            });
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            if (tab === 'vehicles') {
                applyVehicleFilters();
            } else if (tab === 'photos') {
                applyPhotoFilters();
            }
        }

        // ============================================================
        //  加载所有数据
        // ============================================================
        function loadAllData() {
            loadOperators();
            loadVehicles();
            loadPhotos();
        }

        // ============================================================
        //  加载运营公司
        // ============================================================
        function loadOperators() {
            supabaseClient
                .from('operators')
                .select('id, name, short_name')
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        operators = res.data || [];
                        populateOperatorFilters();
                    }
                })
                .catch(function(err) {
                    console.warn('加载运营商失败:', err);
                });
        }

        function populateOperatorFilters() {
            var selects = ['vehicleOperatorFilter', 'photoOperatorFilter'];
            selects.forEach(function(id) {
                var select = document.getElementById(id);
                if (!select) return;
                var currentVal = select.value;
                select.innerHTML = '<option value="all">全部公司</option>';
                operators.forEach(function(op) {
                    var displayName = op.short_name || op.name;
                    select.innerHTML += '<option value="' + op.id + '">' + escapeHtml(displayName) + '</option>';
                });
                if (currentVal) select.value = currentVal;
            });
        }

        // ============================================================
        //  🚌 加载车辆
        // ============================================================
        function loadVehicles() {
            var grid = document.getElementById('vehicleGrid');
            grid.innerHTML = '<div class="loading-spinner"><span class="spinner">⟳</span><p style="margin-top:8px;">加载车辆档案...</p></div>';

            supabaseClient
                .from('vehicles')
                .select('*')
                .eq('status', 'approved')
                .order('created_at', { ascending: false })
                .then(function(res) {
                    if (res.error) throw new Error(res.error.message);
                    allVehicles = res.data || [];
                    document.getElementById('statVehicles').textContent = allVehicles.length;
                    document.getElementById('vehicleBadge').textContent = allVehicles.length;
                    applyVehicleFilters();
                    updateStats();
                    renderNav();
                })
                .catch(function(error) {
                    console.error('加载车辆失败:', error);
                    grid.innerHTML =
                        '<div class="empty-state"><span class="icon">❌</span><p>加载失败：' + escapeHtml(error.message) +
                        '</p></div>';
                });
        }

        // ============================================================
        //  📸 加载照片（从 user_photos 表读取）
        // ============================================================
        function loadPhotos() {
            var grid = document.getElementById('photoGrid');
            grid.innerHTML = '<div class="loading-spinner"><span class="spinner">⟳</span><p style="margin-top:8px;">加载照片档案...</p></div>';

            // 加载所有已审核通过的照片
            supabaseClient
                .from('user_photos')
                .select('*')
                .eq('status', 'approved')
                .order('created_at', { ascending: false })
                .then(function(res) {
                    if (res.error) throw new Error(res.error.message);
                    var photos = res.data || [];

                    // 获取关联的车辆信息
                    var vehicleIds = photos.map(function(p) { return p.vehicle_id; }).filter(function(id) { return id; });
                    if (vehicleIds.length > 0) {
                        supabaseClient
                            .from('vehicles')
                            .select('id, fleet_number, license_plate, model, operator_name')
                            .in('id', vehicleIds)
                            .then(function(vRes) {
                                if (!vRes.error) {
                                    var vehicleMap = {};
                                    (vRes.data || []).forEach(function(v) {
                                        vehicleMap[v.id] = v;
                                    });
                                    photos.forEach(function(p) {
                                        if (p.vehicle_id && vehicleMap[p.vehicle_id]) {
                                            p._vehicle = vehicleMap[p.vehicle_id];
                                        }
                                    });
                                }
                                allPhotos = photos;
                                document.getElementById('statPhotos').textContent = allPhotos.length;
                                document.getElementById('photoBadge').textContent = allPhotos.length;
                                applyPhotoFilters();
                                updateStats();
                            })
                            .catch(function() {
                                allPhotos = photos;
                                document.getElementById('statPhotos').textContent = allPhotos.length;
                                document.getElementById('photoBadge').textContent = allPhotos.length;
                                applyPhotoFilters();
                                updateStats();
                            });
                    } else {
                        allPhotos = photos;
                        document.getElementById('statPhotos').textContent = allPhotos.length;
                        document.getElementById('photoBadge').textContent = allPhotos.length;
                        applyPhotoFilters();
                        updateStats();
                    }
                })
                .catch(function(error) {
                    console.error('加载照片失败:', error);
                    grid.innerHTML =
                        '<div class="empty-state"><span class="icon">❌</span><p>加载失败：' + escapeHtml(error.message) +
                        '</p></div>';
                });
        }

        // ============================================================
        //  更新统计
        // ============================================================
        function updateStats() {
            var operatorSet = new Set();
            var modelSet = new Set();
            allVehicles.forEach(function(v) {
                if (v.operator_id) operatorSet.add(v.operator_id);
                if (v.model) modelSet.add(v.model);
            });
            document.getElementById('statOperators').textContent = operatorSet.size;
            document.getElementById('statModels').textContent = modelSet.size;
            document.getElementById('totalBadge').textContent = (allVehicles.length + allPhotos.length) + ' 项';
        }

        // ============================================================
        //  🚌 车辆筛选
        // ============================================================
        function applyVehicleFilters() {
            var search = document.getElementById('vehicleSearchInput').value.trim().toLowerCase();
            var source = document.getElementById('vehicleSourceFilter').value;
            var status = document.getElementById('vehicleStatusFilter').value;
            var operatorId = document.getElementById('vehicleOperatorFilter').value;
            var sort = document.getElementById('vehicleSortFilter').value;

            filteredVehicles = allVehicles.filter(function(v) {
                if (search) {
                    var searchable = (v.fleet_number || '') + ' ' + (v.license_plate || '') + ' ' + (v.model || '');
                    if (!searchable.toLowerCase().includes(search)) return false;
                }
                if (source !== 'all') {
                    var isOfficial = v.data_source === 'official' || v.verified === true;
                    if (source === 'official' && !isOfficial) return false;
                    if (source === 'user' && isOfficial) return false;
                }
                if (status !== 'all' && v.service_status !== status) return false;
                if (operatorId !== 'all' && v.operator_id != operatorId) return false;
                return true;
            });

            filteredVehicles.sort(function(a, b) {
                switch (sort) {
                    case 'newest':
                        return new Date(b.created_at) - new Date(a.created_at);
                    case 'oldest':
                        return new Date(a.created_at) - new Date(b.created_at);
                    case 'views':
                        return (b.views || 0) - (a.views || 0);
                    case 'likes':
                        return (b.likes || 0) - (a.likes || 0);
                    case 'photos':
                        var aPhotos = (a.photos || []).length;
                        var bPhotos = (b.photos || []).length;
                        return bPhotos - aPhotos;
                    default:
                        return 0;
                }
            });

            renderVehicles(filteredVehicles);
        }

        function renderVehicles(vehicles) {
            var grid = document.getElementById('vehicleGrid');
            if (!vehicles || vehicles.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state"><span class="icon">🚌</span><p>没有找到匹配的车辆</p></div>';
                return;
            }

            var html = '';
            vehicles.forEach(function(v) {
                var coverPhoto = v.cover_photo || (v.photos && v.photos.length > 0 ? v.photos[0] : null);
                var photoCount = (v.photos || []).length;
                var isOfficial = v.data_source === 'official' || v.verified === true;
                var sourceClass = isOfficial ? 'official' : 'user';
                var sourceLabel = isOfficial ? '🏢 官方认证' : '👤 用户投稿';
                var statusLabel = getStatusLabel(v.service_status);
                var statusClass = getStatusClass(v.service_status);
                var operatorName = getOperatorName(v.operator_id);
                var typeLabel = getVehicleTypeLabel(v.vehicle_type);

                var thumbHtml = '';
                if (coverPhoto) {
                    thumbHtml = '<img src="' + escapeHtml(coverPhoto) + '" alt="' + escapeHtml(v.fleet_number || v.model ||
                        '巴士') + '" loading="lazy" />';
                } else {
                    thumbHtml = '<div class="no-image">🚌</div>';
                }

                html +=
                    '<div class="vehicle-card" onclick="window.location.href=\'vehicle.html?id=' + v.id + '\'">' +
                    '<div class="card-thumb">' +
                    thumbHtml +
                    '<div class="badges">' +
                    '<span class="badge ' + sourceClass + '">' + sourceLabel + '</span>' +
                    (v.service_status ? '<span class="badge ' + statusClass + '">' + statusLabel + '</span>' : '') +
                    '</div>' +
                    (photoCount > 0 ? '<span class="photo-count">📸 ' + photoCount + ' 张</span>' : '') +
                    '</div>' +
                    '<div class="card-body">' +
                    '<div class="vehicle-name">' +
                    (v.fleet_number ? '<span class="fleet-number">' + escapeHtml(v.fleet_number) + '</span>' : '') +
                    (v.model ? escapeHtml(v.model) : '未命名巴士') +
                    (v.license_plate ? '<span class="license-plate">' + escapeHtml(v.license_plate) + '</span>' : '') +
                    '</div>' +
                    '<div class="vehicle-meta">' +
                    (operatorName ? '<span>🏢 <span class="operator-name">' + escapeHtml(operatorName) + '</span></span>' :
                        '') +
                    (v.manufacturer ? '<span>🏭 ' + escapeHtml(v.manufacturer) + '</span>' : '') +
                    (v.vehicle_type ? '<span>🚌 ' + typeLabel + '</span>' : '') +
                    (v.livery_name ? '<span>🎨 ' + escapeHtml(v.livery_name) + '</span>' : '') +
                    '</div>' +
                    '<div class="vehicle-stats">' +
                    '<span>👁️ <span class="num">' + (v.views || 0) + '</span></span>' +
                    '<span>❤️ <span class="num">' + (v.likes || 0) + '</span></span>' +
                    '<span>📸 <span class="num">' + photoCount + '</span></span>' +
                    '<span style="margin-left:auto;color:#bbb;">' + formatDate(v.created_at) + '</span>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
            });
            grid.innerHTML = html;
        }

        // ============================================================
        //  📸 照片筛选
        // ============================================================
        function applyPhotoFilters() {
            var search = document.getElementById('photoSearchInput').value.trim().toLowerCase();
            var operatorId = document.getElementById('photoOperatorFilter').value;
            var sort = document.getElementById('photoSortFilter').value;

            filteredPhotos = allPhotos.filter(function(p) {
                if (search) {
                    var vehicle = p._vehicle || null;
                    var searchable = (vehicle ? vehicle.license_plate || '' : '') + ' ' +
                        (p.route_number || '') + ' ' +
                        (p.operator_name || '') + ' ' +
                        (vehicle ? vehicle.fleet_number || '' : '');
                    if (!searchable.toLowerCase().includes(search)) return false;
                }
                if (operatorId !== 'all') {
                    var vehicle = p._vehicle || null;
                    if (!vehicle || vehicle.operator_id != operatorId) return false;
                }
                return true;
            });

            filteredPhotos.sort(function(a, b) {
                switch (sort) {
                    case 'newest':
                        return new Date(b.created_at) - new Date(a.created_at);
                    case 'oldest':
                        return new Date(a.created_at) - new Date(b.created_at);
                    case 'views':
                        return (b.views || 0) - (a.views || 0);
                    default:
                        return 0;
                }
            });

            renderPhotos(filteredPhotos);
        }

        function renderPhotos(photos) {
            var grid = document.getElementById('photoGrid');
            if (!photos || photos.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state"><span class="icon">📸</span><p>没有找到匹配的照片档案</p></div>';
                return;
            }

            var html = '';
            photos.forEach(function(p) {
                var vehicle = p._vehicle || null;
                var plateText = vehicle && vehicle.license_plate ? vehicle.license_plate : null;
                var fleetText = vehicle && vehicle.fleet_number ? vehicle.fleet_number : null;
                var operatorText = p.operator_name || (vehicle ? vehicle.operator_name : null);
                var routeText = p.route_number || null;
                var countryText = p.country_name || '';
                var provinceText = p.province_name || '';
                var cityText = p.city_name || '';
                var locationText = [countryText, provinceText, cityText].filter(function(s) { return s; }).join(' → ');
                var spotLink = p.spot_id ? 'index.html?spot_id=' + p.spot_id : null;

                var displayName = '';
                if (plateText) {
                    displayName = plateText;
                } else if (fleetText) {
                    displayName = fleetText;
                } else {
                    displayName = '📸 照片档案';
                }

                html +=
                    '<div class="photo-archive-card" onclick="' + (spotLink ? 'window.open(\'' + spotLink +
                    '\',\'_blank\')' : 'openLightbox(\'' + escapeHtml(p.photo_url) + '\')') + '">' +
                    '<div class="card-thumb">' +
                    '<img src="' + escapeHtml(p.photo_url) + '" alt="' + escapeHtml(displayName) +
                    '" loading="lazy" />' +
                    '<span class="badge-status">✅ 已归档</span>' +
                    (plateText ? '<span class="badge-vehicle">🚗 ' + escapeHtml(plateText) + '</span>' : '') +
                    '</div>' +
                    '<div class="card-body">' +
                    '<div class="photo-plate">' +
                    (plateText ? '<span class="plate-text">' + escapeHtml(plateText) + '</span>' :
                        '<span class="no-plate">📸 照片档案</span>') +
                    '</div>' +
                    '<div class="photo-meta">' +
                    (operatorText ? '<span>🏢 <span class="operator-name">' + escapeHtml(operatorText) + '</span></span>' :
                        '') +
                    (routeText ? '<span class="route-tag">🚌 ' + escapeHtml(routeText) + '</span>' : '') +
                    (fleetText ? '<span>🚌 ' + escapeHtml(fleetText) + '</span>' : '') +
                    '</div>' +
                    '<div class="photo-location">' +
                    (locationText ? '<span>📍 ' + escapeHtml(locationText) + '</span>' : '<span style="color:#bbb;">📍 位置未标注</span>') +
                    (spotLink ? '<a href="' + spotLink + '" class="spot-link" target="_blank">📍 查看机位</a>' :
                        '<span style="color:#bbb;">无关联机位</span>') +
                    '<span class="uploader">👤 ' + escapeHtml(p.uploader || '未知') + '</span>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
            });
            grid.innerHTML = html;
        }

        // ============================================================
        //  辅助函数
        // ============================================================
        function getOperatorName(id) {
            if (!id) return null;
            var op = operators.find(function(o) { return o.id == id; });
            return op ? (op.short_name || op.name) : null;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '未知';
            try {
                var d = new Date(dateStr);
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate())
                    .padStart(2, '0');
            } catch (e) {
                return dateStr;
            }
        }

        function refreshData() {
            showToast('⟳ 刷新中...', '');
            loadAllData();
        }

        // ============================================================
        //  启动
        // ============================================================
        renderNav();
        loadAllData();

        console.log('🚌 巴士档案主页已加载（含照片档案）');
        console.log('📸 照片档案显示车牌号、运营公司、线路、地区信息');
        console.log('✅ 两个 Tab：🚌 车辆档案 | 📸 照片档案');
    </script>
</body>
</html>
