    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        .navbar .brand {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: white;
        }
        .navbar .brand span {
            font-size: 22px;
        }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-wrap: wrap;
        }
        .navbar .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            transition: all 0.2s;
        }
        .navbar .nav-links a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        .navbar .nav-links a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .navbar .nav-links .user-name {
            color: rgba(255, 255, 255, 0.85);
            padding: 4px 8px;
            font-size: 12px;
        }
        .navbar .nav-links .btn-logout {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .navbar .nav-links .btn-logout:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .back-bar {
            margin-bottom: 14px;
        }
        .back-bar a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-bar a:hover {

        }
        .back-bar .hint-box {
            font-size: 12px;
            color: #999;
            background: #f5f7fa;
            padding: 6px 14px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 4px;
        }
        .back-bar .hint-box .highlight {
            color: #1a73e8;
            font-weight: 600;
        }

        /* ===== 表单卡片 ===== */
        .form-card {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .form-card .form-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-card .form-title .mode-badge {
            font-size: 12px;
            font-weight: 400;
            color: white;
            background: #1a73e8;
            padding: 2px 14px;
            border-radius: 20px;
        }
        .form-card .form-sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }
        .form-group label .required {
            color: #f44336;
        }
        .form-group label .hint-text {
            font-weight: 400;
            color: #999;
            font-size: 12px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
            font-family: inherit;
            background: #fff;
            color: #333;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1a73e8;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .form-group .hint .link {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }
        .form-group .hint .link:hover {
            text-decoration: underline;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .section-divider {
            margin-top: 6px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }
        .section-divider .section-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== 状态选择 ===== */
        .status-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .status-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            color: #555;
            flex: 1;
            justify-content: center;
        }
        .status-options label:hover {
            border-color: #1a73e8;
        }
        .status-options input[type="radio"] {
            accent-color: #1a73e8;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .status-options input[type="radio"]:checked+span {
            font-weight: 500;
            color: #1a73e8;
        }

        /* ===== 图片上传 ===== */
        .upload-area {
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .upload-area:hover {
            border-color: #1a73e8;
            background: #f5f8ff;
        }
        .upload-area .icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
        }
        .upload-area .text {
            font-size: 14px;
            color: #666;
        }
        .upload-area .sub {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .upload-area input[type="file"] {
            display: none;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .preview-container .preview-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 4/3;
            background: #f0f0f0;
            border: 2px solid #e0e0e0;
        }
        .preview-container .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-container .preview-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .preview-container .preview-item .remove-btn:hover {
            background: rgba(200, 0, 0, 0.8);
        }
        .preview-container .preview-item .cover-badge {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(26, 115, 232, 0.9);
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 500;
        }

        /* ===== 按钮 ===== */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-delete {
            width: 100%;
            padding: 12px;
            background: #ffebee;
            color: #f44336;
            border: 2px solid #f44336;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-delete:hover {
            background: #f44336;
            color: white;
        }

        /* ===== Message ===== */
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .message.error {
            display: block;
            background: #fee8e8;
            color: #d32f2f;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .message.loading {
            display: block;
            background: #e8f0fe;
            color: #1a73e8;
        }
        .message.warning {
            display: block;
            background: #fff3e0;
            color: #e65100;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            border-color: #4caf50;
        }
        .toast.error {
            border-color: #f44336;
        }

        /* ===== 空状态 ===== */
        .empty-hint {
            padding: 12px 16px;
            background: #fff8e1;
            border-radius: 10px;
            border-left: 4px solid #ff9800;
            font-size: 13px;
            color: #666;

        }
        .empty-hint strong {
            color: #e65100;
        }
        .empty-hint a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }
        .empty-hint a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 16px 14px;
            }
            .form-card .form-title {

            }
            .status-options label {

            }
            .upload-area {
                padding: 20px 12px;
            }
            .upload-area .icon {
                font-size: 28px;
            }
            .preview-container {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
            .back-bar .hint-box {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

                            <input type="radio" name="serviceStatus" value="active" checked>
                            <span>🚀 运营中</span>

                            <input type="radio" name="serviceStatus" value="retired">

                            <input type="radio" name="serviceStatus" value="preserved">

                    <div class="upload-area" id="uploadArea" onclick="document.getElementById('photoInput').click()">
                        <span class="icon">📷</span>
                        <div class="text">点击上传照片</div>
                        <div class="sub">支持 JPG、PNG，单张不超过 50MB</div>
                        <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotoUpload(event)">
                    </div>
                    <div class="preview-container" id="photoPreview"></div>
                    <div class="hint">💡 第一张照片将自动设为封面图</div>
                </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  Supabase 客户端
        // ============================================================
        var supabaseClient = null;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  用户状态
        // ============================================================
        function getCurrentUser() {
            try {
                var raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            window.location.href = 'index.html';
        }

        function renderNav() {
            var nav = document.getElementById('navLinks');
            var user = getCurrentUser();

            if (user) {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="profile.html">👤 个人中心</a>' +
                    '<a href="upload.html">📤 新机位</a>' +
                    '<span class="user-name">👤 ' + escapeHtml(user.username) + '</span>' +
                    '<button class="btn-logout" onclick="logout()">退出</button>';
            } else {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="login.html">登录</a>' +
                    '<a href="register.html">注册</a>';
            }
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(text, type) {
            var el = document.getElementById('toast');
            el.textContent = text;
            el.className = 'toast ' + (type || '') + ' show';
            clearTimeout(el._timer);
            el._timer = setTimeout(function() { el.className = 'toast'; }, 3000);
        }

        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        function hideMessage() {
            var el = document.getElementById('message');
            el.className = 'message';
            el.style.display = 'none';
        }

        // ============================================================
        //  照片上传
        // ============================================================
        var uploadedPhotos = [];

        function handlePhotoUpload(event) {
            var files = event.target.files;
            if (!files || files.length === 0) return;

            for (var i = 0; i < files.length; i++) {
                if (files[i].size > 50 * 1024 * 1024) {
                    showToast('❌ 单张照片不能超过 50MB', 'error');
                    continue;
                }
                var reader = new FileReader();
                reader.onload = function(e) {
                    uploadedPhotos.push({
                        file: files[i],
                        url: e.target.result
                    });
                    renderPhotoPreview();
                };
                reader.readAsDataURL(files[i]);
            }
            event.target.value = '';
        }

        function renderPhotoPreview() {
            var container = document.getElementById('photoPreview');
            if (uploadedPhotos.length === 0) {
                container.innerHTML = '';
                return;
            }
            var html = '';
            uploadedPhotos.forEach(function(p, index) {
                var isCover = index === 0;
                html += '<div class="preview-item">' +
                    '<img src="' + p.url + '" alt="照片' + (index + 1) + '" />' +
                    '<button type="button" class="remove-btn" onclick="removePhoto(' + index + ')">×</button>' +
                    (isCover ? '<span class="cover-badge">📌 封面</span>' : '') +
                    '</div>';
            });
            container.innerHTML = html;
        }

        function removePhoto(index) {
            uploadedPhotos.splice(index, 1);
            renderPhotoPreview();
        }

        // ============================================================
        //  地区数据 + 车型按城市筛选
        // ============================================================
        var countriesCache = [];
        var provincesCache = [];
        var citiesCache = [];
        var operatorsCache = [];
        var allVehicleModels = [];
        var selectedCityName = '';

        function loadCountries() {
            supabaseClient
                .from('countries')
                .select('id, name')
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        countriesCache = res.data || [];
                        var select = document.getElementById('countrySelect');
                        select.innerHTML = '<option value="">请选择国家...</option>';
                        countriesCache.forEach(function(c) {
                            select.innerHTML += '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
                        });
                        checkRegionData();
                    }
                });
        }

        function loadAllVehicleModels() {
            supabaseClient
                .from('vehicle_models')
                .select('id, name, manufacturer, city')
                .eq('status', 'approved')
                .order('manufacturer')
                .then(function(res) {
                    if (!res.error) {
                        allVehicleModels = res.data || [];
                        console.log('✅ 加载车型总数:', allVehicleModels.length);
                        if (selectedCityName) {
                            filterModelsByCity(selectedCityName);
                        }
                    }
                });
        }

        function onCountryChange() {
            var countryId = document.getElementById('countrySelect').value;
            var provinceSelect = document.getElementById('provinceSelect');
            var citySelect = document.getElementById('citySelect');
            var modelSelect = document.getElementById('modelSelect');
            var operatorSelect = document.getElementById('operatorSelect');

            citySelect.innerHTML = '<option value="">请先选择省份...</option>';
            modelSelect.innerHTML = '<option value="">请先选择城市...</option>';
            operatorSelect.innerHTML = '<option value="">请先选择城市...</option>';
            document.getElementById('manufacturer').value = '';

            if (!countryId) {
                provinceSelect.innerHTML = '<option value="">请先选择国家...</option>';
                return;
            }

            supabaseClient
                .from('provinces')
                .select('id, name')
                .eq('country_id', countryId)
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        provincesCache = res.data || [];
                        provinceSelect.innerHTML = '<option value="">请选择省份...</option>';
                        provincesCache.forEach(function(p) {
                            provinceSelect.innerHTML += '<option value="' + p.id + '">' + escapeHtml(p.name) +
                                '</option>';
                        });
                    }
                });
        }

        function onProvinceChange() {
            var provinceId = document.getElementById('provinceSelect').value;
            var citySelect = document.getElementById('citySelect');
            var modelSelect = document.getElementById('modelSelect');
            var operatorSelect = document.getElementById('operatorSelect');

            modelSelect.innerHTML = '<option value="">请先选择城市...</option>';
            operatorSelect.innerHTML = '<option value="">请先选择城市...</option>';
            document.getElementById('manufacturer').value = '';

            if (!provinceId) {
                citySelect.innerHTML = '<option value="">请先选择省份...</option>';
                return;
            }

            supabaseClient
                .from('cities')
                .select('id, name')
                .eq('province_id', provinceId)
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        citiesCache = res.data || [];
                        citySelect.innerHTML = '<option value="">请选择城市...</option>';
                        citiesCache.forEach(function(c) {
                            citySelect.innerHTML += '<option value="' + c.id + '">' + escapeHtml(c.name) +
                                '</option>';
                        });
                    }
                });
        }

        function onCityChange() {
            var cityId = document.getElementById('citySelect').value;
            var cityName = document.getElementById('citySelect').options[document.getElementById('citySelect').selectedIndex]
                ?.text || '';
            selectedCityName = cityName;

            var modelSelect = document.getElementById('modelSelect');
            var operatorSelect = document.getElementById('operatorSelect');
            modelSelect.innerHTML = '<option value="">请选择车型...</option>';
            operatorSelect.innerHTML = '<option value="">请选择运营公司...</option>';
            document.getElementById('manufacturer').value = '';

            if (!cityId) {
                modelSelect.innerHTML = '<option value="">请先选择城市...</option>';
                operatorSelect.innerHTML = '<option value="">请先选择城市...</option>';
                return;
            }

            filterModelsByCity(cityName);
            loadOperatorsByCity(cityId);
        }

        function filterModelsByCity(cityName) {
            var modelSelect = document.getElementById('modelSelect');

            if (!cityName) {
                modelSelect.innerHTML = '<option value="">请先选择城市...</option>';
                return;
            }

            var matched = allVehicleModels.filter(function(m) {
                return m.city && m.city.toLowerCase() === cityName.toLowerCase();
            });

            if (matched.length === 0) {
                matched = allVehicleModels.filter(function(m) {
                    return m.city && m.city.toLowerCase().includes(cityName.toLowerCase());
                });
            }

            if (matched.length === 0) {
                modelSelect.innerHTML = '<option value="">⚠️ 该城市暂无车型，请先上传</option>';
                return;
            }

            modelSelect.innerHTML = '<option value="">请选择车型...</option>';
            matched.forEach(function(m) {
                var displayName = m.manufacturer ? m.manufacturer + ' ' + m.name : m.name;
                modelSelect.innerHTML += '<option value="' + m.id + '" data-manufacturer="' + escapeHtml(m
                    .manufacturer || '') + '">' + escapeHtml(displayName) + '</option>';
            });

            modelSelect.onchange = function() {
                var selected = modelSelect.options[modelSelect.selectedIndex];
                var manufacturer = selected ? selected.dataset.manufacturer || '' : '';
                document.getElementById('manufacturer').value = manufacturer;
            };
        }

        function loadOperatorsByCity(cityId) {
            var operatorSelect = document.getElementById('operatorSelect');

            supabaseClient
                .from('operators')
                .select('id, name, short_name')
                .eq('city_id', cityId)
                .eq('status', 'approved')
                .order('name')
                .then(function(res) {
                    if (!res.error) {
                        operatorsCache = res.data || [];
                        if (operatorsCache.length === 0) {
                            operatorSelect.innerHTML = '<option value="">⚠️ 该城市暂无公司，请先上传</option>';
                            return;
                        }
                        operatorSelect.innerHTML = '<option value="">选择运营公司（选填）...</option>';
                        operatorsCache.forEach(function(op) {
                            var displayName = op.short_name || op.name;
                            operatorSelect.innerHTML += '<option value="' + op.id + '">' + escapeHtml(displayName) +
                                '</option>';
                        });
                    }
                });
        }

        function checkRegionData() {
            var hint = document.getElementById('regionEmptyHint');
            if (countriesCache.length === 0) {
                hint.style.display = 'block';
            } else {
                hint.style.display = 'none';
            }
        }

        // ============================================================
        //  ImgBB 上传
        // ============================================================
        async function uploadToImgBB(file) {
            var user = getCurrentUser();
            if (!user) throw new Error('请先登录');

            var formData = new FormData();
            formData.append('image', file);

            var response = await fetch(
                'https://keeybzxxkjxvlvhjjdpr.supabase.co/functions/v1/upload-image', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + (user.access_token || '') },
                    body: formData
                }
            );
            var result = await response.json();
            if (!response.ok || !result.success) {
                throw new Error(result.error || '上传失败');
            }
            return result.url;
        }

        // ============================================================
        //  提交表单
        // ============================================================
        document.getElementById('vehicleForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var user = getCurrentUser();
            if (!user) {
                showMessage('❌ 请先登录', 'error');
                return;
            }

            var countryId = document.getElementById('countrySelect').value;
            var provinceId = document.getElementById('provinceSelect').value;
            var cityId = document.getElementById('citySelect').value;
            var modelId = document.getElementById('modelSelect').value;
            var serviceStatus = document.querySelector('input[name="serviceStatus"]:checked');

            if (!countryId) { showMessage('❌ 请选择国家/地区', 'error'); return; }
            if (!provinceId) { showMessage('❌ 请选择省份/州', 'error'); return; }
            if (!cityId) { showMessage('❌ 请选择城市', 'error'); return; }
            if (!modelId) { showMessage('❌ 请选择车型', 'error'); return; }
            if (!serviceStatus) { showMessage('❌ 请选择服役状态', 'error'); return; }

            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 处理中...';
            showMessage('⏳ 正在处理...', 'loading');

            try {
                var photoUrls = [];
                for (var i = 0; i < uploadedPhotos.length; i++) {
                    showMessage('📤 上传照片 ' + (i + 1) + '/' + uploadedPhotos.length + '...', 'loading');
                    var url = await uploadToImgBB(uploadedPhotos[i].file);
                    photoUrls.push(url);
                }

                var country = countriesCache.find(function(c) { return c.id == countryId; });
                var province = provincesCache.find(function(p) { return p.id == provinceId; });
                var city = citiesCache.find(function(c) { return c.id == cityId; });
                var model = allVehicleModels.find(function(m) { return m.id == modelId; });
                var operatorId = document.getElementById('operatorSelect').value || null;

                var data = {
                    license_plate: document.getElementById('licensePlate').value.trim() || null,
                    model_id: modelId,
                    model: model ? model.name : null,
                    manufacturer: document.getElementById('manufacturer').value.trim() || null,
                    vehicle_type: document.getElementById('vehicleType').value || null,
                    operator_id: operatorId,
                    country_id: countryId,
                    province_id: provinceId,
                    city_id: cityId,
                    country_name: country ? country.name : null,
                    province_name: province ? province.name : null,
                    city_name: city ? city.name : null,
                    service_status: serviceStatus.value,
                    cover_photo: photoUrls.length > 0 ? photoUrls[0] : null,
                    photos: photoUrls.length > 0 ? photoUrls : null,
                    created_by: user.username,
                    data_source: 'user',
                    status: 'pending'
                };

                var { error } = await supabaseClient
                    .from('vehicles')
                    .insert([data]);

                if (error) throw new Error(error.message);

                showMessage('✅ 车辆档案已提交，等待管理员审核！', 'success');
                btn.textContent = '✅ 已提交';

                setTimeout(function() {
                    window.location.href = 'vehicles.html';
                }, 2000);

            } catch (error) {
                console.error('提交失败:', error);
                showMessage('❌ 提交失败：' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '📤 提交审核';
            }
        });

        // ============================================================
        //  加载编辑数据
        // ============================================================
        function loadEditData() {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id');
            var mode = params.get('mode');

            if (id) {
                document.getElementById('modeBadge').textContent = '✏️ 编辑';
                document.getElementById('formSub').textContent = '编辑车辆信息，修改后重新提交审核';
                document.getElementById('deleteBtn').style.display = 'block';

                supabaseClient
                    .from('vehicles')
                    .select('*')
                    .eq('id', id)
                    .single()
                    .then(function(res) {
                        if (res.error) throw new Error(res.error.message);
                        var v = res.data;
                        setTimeout(function() {
                            fillForm(v);
                        }, 500);
                    })
                    .catch(function(error) {
                        console.error('加载失败:', error);
                        showMessage('❌ 加载失败：' + error.message, 'error');
                    });
            } else if (mode === 'upload') {
                document.getElementById('modeBadge').textContent = '📤 上传';
                document.getElementById('formSub').textContent = '填写车辆信息，提交后等待审核';
            }
        }

        function fillForm(v) {
            if (v.country_id) {
                document.getElementById('countrySelect').value = v.country_id;
                onCountryChange();
                setTimeout(function() {
                    if (v.province_id) {
                        document.getElementById('provinceSelect').value = v.province_id;
                        onProvinceChange();
                        setTimeout(function() {
                            if (v.city_id) {
                                document.getElementById('citySelect').value = v.city_id;
                                onCityChange();
                                setTimeout(function() {
                                    if (v.model_id) {
                                        document.getElementById('modelSelect').value = v.model_id;
                                        var selected = document.getElementById('modelSelect')
                                            .options[document.getElementById('modelSelect')
                                                .selectedIndex];
                                        document.getElementById('manufacturer').value = selected ?
                                            selected.dataset.manufacturer || '' : '';
                                    }
                                    if (v.operator_id) {
                                        document.getElementById('operatorSelect').value = v.operator_id;
                                    }
                                }, 300);
                            }
                        }, 300);
                    }
                }, 300);
            }

            document.getElementById('licensePlate').value = v.license_plate || '';
            document.getElementById('vehicleType').value = v.vehicle_type || '';

            if (v.service_status) {
                document.querySelector('input[name="serviceStatus"][value="' + v.service_status + '"]').checked = true;
            }

            if (v.photos && v.photos.length > 0) {
                v.photos.forEach(function(url) {
                    uploadedPhotos.push({ file: null, url: url, existing: true });
                });
                renderPhotoPreview();
            }
        }

        // ============================================================
        //  删除车辆
        // ============================================================
        async function deleteVehicle() {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id');
            if (!id) return;

            if (!confirm('⚠️ 确定要删除这辆巴士吗？此操作不可恢复！')) return;

            try {
                var { error } = await supabaseClient
                    .from('vehicles')
                    .delete()
                    .eq('id', id);

                if (error) throw new Error(error.message);

                showToast('✅ 已删除', 'success');
                setTimeout(function() {
                    window.location.href = 'vehicles.html';
                }, 1000);
            } catch (error) {
                showToast('❌ 删除失败：' + error.message, 'error');
            }
        }

        // ============================================================
        //  启动
        // ============================================================
        renderNav();
        loadCountries();
        loadAllVehicleModels();
        loadEditData();

        console.log('🚌 车辆编辑页面已加载（简化版）');
        console.log('✅ 移除了：车队编号、涂装、描述、日期、车长、载客量');
        console.log('✅ 保留：地区联动、车型按城市筛选、车牌、类型、公司、状态、照片');
    </script>
</body>
