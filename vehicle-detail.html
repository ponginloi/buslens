    <div class="toast" id="toast"></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox">×</span>
        <img id="lightboxImg" src="" alt="预览">
    </div>

    <script>
        // ============================================================
        //  Supabase 客户端
        // ============================================================
        var supabaseClient = null;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  用户状态
        // ============================================================
        function getCurrentUser() {
            try {
                var raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function isAdmin() {
            var user = getCurrentUser();
            if (!user) return false;
            return ADMIN_USERNAMES.indexOf(user.username) !== -1;
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            window.location.href = 'index.html';
        }

        function renderNav() {
            var nav = document.getElementById('navLinks');
            var user = getCurrentUser();

            if (user) {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="profile.html">👤 个人中心</a>' +
                    '<a href="upload.html">📤 新机位</a>' +
                    '<span class="user-name">👤 ' + escapeHtml(user.username) + '</span>' +
                    '<button class="btn-logout" onclick="logout()">退出</button>';
            } else {
                nav.innerHTML =
                    '<a href="index.html">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html" class="active">🚌 档案</a>' +
                    '<a href="login.html">登录</a>' +
                    '<a href="register.html">注册</a>';
            }
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(text, type) {
            var el = document.getElementById('toast');
            el.textContent = text;
            el.className = 'toast ' + (type || '') + ' show';
            clearTimeout(el._timer);
            el._timer = setTimeout(function() { el.className = 'toast'; }, 3000);
        }

        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        // ============================================================
        //  获取车辆 ID
        // ============================================================
        function getVehicleId() {
            var params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // ============================================================
        //  加载车辆详情
        // ============================================================
        var vehicleData = null;
        var relatedSpots = [];
        var vehiclePhotos = [];
        var operatorsCache = [];
        var vehicleModelsCache = [];

        function loadVehicle() {
            var id = getVehicleId();
            if (!id) {
                document.getElementById('vehicleContent').innerHTML =
                    '<div class="empty-state"><span class="icon">❌</span><p>未指定车辆 ID</p><div class="sub"><a href="vehicles.html">返回档案列表</a></div></div>';
                return;
            }

            // 加载运营商列表
            supabaseClient
                .from('operators')
                .select('id, name, short_name')
                .then(function(res) {
                    if (!res.error) {
                        operatorsCache = res.data || [];
                    }
                })
                .catch(function(err) {
                    console.warn('加载运营商失败:', err);
                });

            // 加载车型缓存
            supabaseClient
                .from('vehicle_models')
                .select('id, name, manufacturer')
                .eq('status', 'approved')
                .then(function(res) {
                    if (!res.error) {
                        vehicleModelsCache = res.data || [];
                    }
                })
                .catch(function(err) {
                    console.warn('加载车型缓存失败:', err);
                });

            // 加载车辆详情
            supabaseClient
                .from('vehicles')
                .select('*')
                .eq('id', id)
                .single()
                .then(function(res) {
                    if (res.error) {
                        if (res.error.code === 'PGRST116') {
                            document.getElementById('vehicleContent').innerHTML =
                                '<div class="empty-state"><span class="icon">🔍</span><p>未找到该车辆</p><div class="sub">车辆可能已被删除或 ID 不正确</div></div>';
                        } else {
                            throw new Error(res.error.message);
                        }
                        return;
                    }
                    vehicleData = res.data;

                    // 更新浏览量
                    supabaseClient
                        .from('vehicles')
                        .update({ views: (vehicleData.views || 0) + 1 })
                        .eq('id', id)
                        .then(function() {})
                        .catch(function(err) {
                            console.warn('更新浏览量失败:', err);
                        });

                    // 加载关联机位
                    loadRelatedSpots();
                    // 加载车辆照片
                    loadVehiclePhotos(id);
                    // 渲染车辆信息
                    renderVehicle();
                })
                .catch(function(error) {
                    console.error('加载车辆失败:', error);
                    document.getElementById('vehicleContent').innerHTML =
                        '<div class="empty-state"><span class="icon">❌</span><p>加载失败：' + escapeHtml(error.message) +
                        '</p></div>';
                });
        }

        // ============================================================
        //  加载关联机位
        // ============================================================
        function loadRelatedSpots() {
            if (!vehicleData) return;
            var spotIds = vehicleData.related_spot_ids || [];
            if (spotIds.length === 0) {
                relatedSpots = [];
                renderRelatedSpots();
                return;
            }
            supabaseClient
                .from('spots')
                .select('id, name, lng, lat, rank, status')
                .in('id', spotIds)
                .then(function(res) {
                    if (res.error) {
                        console.warn('加载关联机位失败:', res.error);
                        return;
                    }
                    relatedSpots = res.data || [];
                    renderRelatedSpots();
                })
                .catch(function(err) {
                    console.warn('加载关联机位失败:', err);
                });
        }

        function renderRelatedSpots() {
            var container = document.getElementById('relatedSpotsContainer');
            if (!container) return;

            if (relatedSpots.length === 0) {
                container.innerHTML = '<span class="no-spots">📍 暂无关联机位</span>';
                return;
            }

            var rankMap = { high: '上等', medium: '中等', low: '下等' };

            var html = '';
            relatedSpots.forEach(function(spot) {
                var rankClass = spot.rank || 'medium';
                var rankLabel = rankMap[spot.rank] || '';
                html += '<a href="index.html?spot_id=' + spot.id + '" class="spot-item" target="_blank">' +
                    '📍 ' + escapeHtml(spot.name) +
                    (spot.rank ? ' <span class="rank-tag ' + rankClass + '">' + rankLabel + '</span>' : '') +
                    '</a>';
            });
            container.innerHTML = html;
        }

        // ============================================================
        //  加载车辆照片
        // ============================================================
        function loadVehiclePhotos(vehicleId) {
            if (!vehicleId) return;

            supabaseClient
                .from('user_photos')
                .select('*')
                .eq('vehicle_id', vehicleId)
                .eq('status', 'approved')
                .order('created_at', { ascending: false })
                .then(function(res) {
                    if (res.error) {
                        console.warn('加载车辆照片失败:', res.error);
                        return;
                    }
                    vehiclePhotos = res.data || [];
                    renderVehiclePhotos();
                })
                .catch(function(err) {
                    console.warn('加载车辆照片失败:', err);
                    vehiclePhotos = [];
                    renderVehiclePhotos();
                });
        }

        function renderVehiclePhotos() {
            var container = document.getElementById('vehiclePhotosContainer');
            if (!container) return;

            if (vehiclePhotos.length === 0) {
                container.innerHTML = '<div class="photo-empty">📷 暂无该车辆的照片</div>';
                return;
            }

            var html = '<div class="photo-grid">';
            vehiclePhotos.forEach(function(p) {
                var spotLink = p.spot_id ? '<a href="index.html?spot_id=' + p.spot_id +
                    '" class="spot-link" target="_blank">📍 查看机位</a>' : '';

                var exifParts = [];
                if (p.camera_model) exifParts.push(p.camera_model);
                if (p.focal_length) exifParts.push(p.focal_length + 'mm');
                if (p.aperture) exifParts.push(p.aperture);
                if (p.shutter_speed) exifParts.push(p.shutter_speed);
                if (p.iso) exifParts.push('ISO' + p.iso);
                var exifText = exifParts.length > 0 ? exifParts.join(' ｜ ') : '';

                html += '<div class="photo-item" onclick="openLightbox(\'' + escapeHtml(p.photo_url) + '\')">' +
                    '<img src="' + escapeHtml(p.photo_url) + '" loading="lazy" />' +
                    (p.uploader ? '<div class="photo-uploader">📤 ' + escapeHtml(p.uploader) + '</div>' : '') +
                    (exifText ? '<div class="photo-exif">' + escapeHtml(exifText) + '</div>' : '') +
                    '<div class="photo-info">' +
                    (p.caption ? '<span>' + escapeHtml(p.caption) + '</span>' : '<span>📸 车辆照片</span>') +
                    spotLink +
                    '</div>' +
                    '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // ============================================================
        //  获取辅助信息
        // ============================================================
        function getOperatorName(id) {
            if (!id) return null;
            var op = operatorsCache.find(function(o) { return o.id == id; });
            return op ? (op.short_name || op.name) : null;
        }

        function getModelDisplay() {
            if (!vehicleData) return null;
            if (vehicleData.model) return vehicleData.model;
            if (vehicleData.model_id) {
                var cached = vehicleModelsCache.find(function(m) { return m.id == vehicleData.model_id; });
                if (cached) return cached.name;
            }
            return null;
        }

        function getStatusLabel(status) {
            var map = {
                active: '🚀 运营中',
                retired: '🔄 已退役',
                preserved: '🏛️ 保留/收藏',
                scrapped: '💔 已报废',
                unknown: '❓ 未知'
            };
            return map[status] || status || '未知';
        }

        function getStatusClass(status) {
            var map = {
                active: 'active',
                retired: 'retired',
                preserved: 'preserved',
                scrapped: 'scrapped'
            };
            return map[status] || '';
        }

        function getSourceLabel(source) {
            var map = {
                official: '🏢 官方认证',
                user: '👤 用户投稿',
                mixed: '📋 混合来源'
            };
            return map[source] || source || '👤 用户投稿';
        }

        function getSourceClass(source) {
            var map = {
                official: 'official',
                user: 'user',
                mixed: 'user'
            };
            return map[source] || 'user';
        }

        function getVehicleTypeLabel(type) {
            var map = {
                single_decker: '单层巴士',
                double_decker: '双层巴士',
                articulated: '铰接巴士',
                minibus: '小巴',
                coach: '旅游大巴',
                electric: '纯电动巴士',
                hybrid: '混动巴士',
                trolleybus: '无轨电车'
            };
            return map[type] || type || '巴士';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                var d = new Date(dateStr);
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            } catch (e) {
                return dateStr;
            }
        }

        // ============================================================
        //  渲染车辆详情
        // ============================================================
        function renderVehicle() {
            var v = vehicleData;
            if (!v) return;

            var isOfficial = v.data_source === 'official' || v.verified === true;
            var sourceClass = getSourceClass(v.data_source);
            var sourceLabel = getSourceLabel(v.data_source);
            var statusLabel = getStatusLabel(v.service_status);
            var statusClass = getStatusClass(v.service_status);
            var typeLabel = getVehicleTypeLabel(v.vehicle_type);
            var modelDisplay = getModelDisplay();
            var operatorName = getOperatorName(v.operator_id);
            var coverPhoto = v.cover_photo || (v.photos && v.photos.length > 0 ? v.photos[0] : null);

            // 状态徽章
            var statusBadgeHtml = '';
            if (v.status === 'pending') {
                statusBadgeHtml = '<span class="badge-status pending">⏳ 待审核</span>';
            } else if (v.status === 'approved') {
                statusBadgeHtml = '<span class="badge-status approved">✅ 已审核</span>';
            } else if (v.status === 'rejected') {
                statusBadgeHtml = '<span class="badge-status rejected">❌ 已拒绝</span>';
            }
            document.getElementById('topBar').querySelector('.actions').innerHTML = statusBadgeHtml +
                '<a href="vehicle-edit.html?id=' + v.id + '" class="btn-edit">✏️ 编辑</a>';

            // 封面图
            var coverHtml = '';
            if (coverPhoto) {
                coverHtml = '<img src="' + escapeHtml(coverPhoto) + '" alt="' + escapeHtml(v.license_plate || v.model || '巴士') +
                    '" onclick="openLightbox(\'' + escapeHtml(coverPhoto) + '\')" />';
            } else {
                coverHtml = '<div class="no-image">🚌</div>';
            }

            // 标题
            var titleHtml = '';
            if (v.license_plate) {
                titleHtml += '<span class="plate">' + escapeHtml(v.license_plate) + '</span>';
            }
            if (modelDisplay) {
                titleHtml += ' <span class="model-name">' + escapeHtml(modelDisplay) + '</span>';
            } else if (v.model) {
                titleHtml += ' <span class="model-name">' + escapeHtml(v.model) + '</span>';
            }
            if (!titleHtml) {
                titleHtml = '未命名巴士';
            }

            // 信息网格
            var infoItems = [
                { label: '车牌号', value: v.license_plate || '-' },
                { label: '车型', value: modelDisplay || '-' },
                { label: '制造商', value: v.manufacturer || '-' },
                { label: '车辆类型', value: typeLabel },
                { label: '运营公司', value: operatorName || '-' },
                { label: '服役状态', value: '<span class="tag ' + statusClass + '">' + statusLabel + '</span>' },
                { label: '地区', value: [v.country_name, v.province_name, v.city_name].filter(Boolean).join(' → ') || '-' },
                { label: '数据来源', value: sourceLabel },
                { label: '创建者', value: v.created_by || '-' },
                { label: '创建时间', value: formatDate(v.created_at) },
                { label: '浏览数', value: (v.views || 0) + ' 次' },
                { label: '点赞数', value: (v.likes || 0) + ' 次' },
            ];

            var infoHtml = infoItems.map(function(item) {
                return '<div class="info-item">' +
                    '<span class="label">' + item.label + '</span>' +
                    '<span class="value">' + item.value + '</span>' +
                    '</div>';
            }).join('');

            // 描述
            var descHtml = '';
            if (v.description) {
                descHtml = '<div class="description-box">' +
                    '<div class="label">📝 描述</div>' +
                    '<div class="content">' + escapeHtml(v.description) + '</div>' +
                    '</div>';
            }

            // 关联机位
            var spotHtml = '<div class="related-section">' +
                '<div class="section-title">📍 关联机位 <span class="count" id="spotCount">0 个</span></div>' +
                '<div class="spots-list" id="relatedSpotsContainer">' +
                '<span class="no-spots">加载中...</span>' +
                '</div>' +
                '</div>';

            // 照片墙
            var photoHtml = '<div class="photo-section">' +
                '<div class="section-title">📸 车辆照片 <span class="count" id="photoCount">0 张</span></div>' +
                '<div id="vehiclePhotosContainer"><div class="photo-empty">加载中...</div></div>' +
                '</div>';

            // 贡献者
            var contributorHtml = '';
            var contributors = [];
            if (v.created_by) contributors.push({ name: v.created_by, role: '创建者' });
            if (v.reviewed_by) contributors.push({ name: v.reviewed_by, role: '审核人' });
            if (contributors.length > 0) {
                contributorHtml = '<div class="contributors-section">' +
                    '<div class="section-title">👥 贡献者</div>' +
                    '<div class="contributors-list">' +
                    contributors.map(function(c) {
                        return '<span class="contributor">👤 ' + escapeHtml(c.name) +
                            ' <span class="role">' + escapeHtml(c.role) + '</span></span>';
                    }).join('') +
                    '</div>' +
                    '</div>';
            }

            // 组装完整 HTML
            var html = '';
            html += '<div class="vehicle-detail">';
            html += '<div class="cover-section">' +
                coverHtml +
                '<div class="cover-badges">' +
                '<span class="badge ' + sourceClass + '">' + sourceLabel + '</span>' +
                (v.service_status ? '<span class="badge ' + statusClass + '">' + statusLabel + '</span>' : '') +
                (v.verified ? '<span class="badge official">✅ 已验证</span>' : '') +
                '</div>' +
                '</div>';

            html += '<div class="info-section">';
            html += '<div class="header-row">' +
                '<div class="title">' + titleHtml + '</div>' +
                '</div>';

            html += '<div class="info-grid">' + infoHtml + '</div>';
            html += descHtml;
            html += '</div>';
            html += '</div>';

            // 照片墙 + 关联机位 + 贡献者
            html += photoHtml;
            html += spotHtml;
            html += contributorHtml;

            document.getElementById('vehicleContent').innerHTML = html;

            // 更新计数
            var countEl = document.getElementById('photoCount');
            if (countEl) countEl.textContent = vehiclePhotos.length + ' 张';

            var spotCountEl = document.getElementById('spotCount');
            if (spotCountEl) spotCountEl.textContent = relatedSpots.length + ' 个';

            // 渲染照片和机位
            renderVehiclePhotos();
            renderRelatedSpots();

            // 更新导航
            renderNav();
        }

        // ============================================================
        //  删除车辆
        // ============================================================
        function deleteVehicle() {
            var id = getVehicleId();
            if (!id) return;

            if (!confirm('⚠️ 确定要删除这辆巴士吗？此操作不可恢复！')) return;

            supabaseClient
                .from('vehicles')
                .delete()
                .eq('id', id)
                .then(function(res) {
                    if (res.error) {
                        showToast('❌ 删除失败：' + res.error.message, 'error');
                        return;
                    }
                    showToast('✅ 已删除', 'success');
                    setTimeout(function() {
                        window.location.href = 'vehicles.html';
                    }, 1000);
                });
        }

        // ============================================================
        //  启动
        // ============================================================
        renderNav();
        loadVehicle();

        console.log('🚌 车辆详情页面已加载');
        console.log('✅ 展示车辆完整信息');
        console.log('✅ 显示关联机位');
        console.log('✅ 显示车辆照片（含 EXIF）');
        console.log('✅ 可编辑/删除（权限控制）');
    </script>
</body>
</html>
