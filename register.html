<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - BusLens</title>

    <script>
        var SUPABASE_URL = 'https://keeybzxxkjxvlvhjjdpr.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_SpzHfgcLn0deJWoqEPJQ4g_2jzyXXci';
        var SESSION_KEY = 'bus_user_session';
    </script>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0fe 0%, #f0f2f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(26, 115, 232, 0.15);
        }
        .register-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .register-header .logo {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        .register-header h1 {
            font-size: 24px;
            color: #1a73e8;
        }
        .register-header p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .welcome-box {
            background: linear-gradient(135deg, #e8f0fe, #d2e3fc);
            border-left: 4px solid #1a73e8;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #333;
            line-height: 1.8;
            text-align: center;
        }

        /* ✅ 邮箱验证提示框 */
        .notice-box {
            background: #fff8e1;
            border-left: 4px solid #ff9800;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #e65100;
            line-height: 1.6;
        }
        .notice-box strong {
            color: #bf360c;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group label .required {
            color: #ff4444;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.3s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12);
        }
        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .register-footer a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }
        .register-footer a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .message.error {
            display: block;
            background: #fee8e8;
            color: #d32f2f;
            border: 1px solid #f3c4c4;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #cce8d0;
        }
        .message.loading {
            display: block;
            background: #e8f0fe;
            color: #1a73e8;
            border: 1px solid #c7dafd;
        }
        .message.warning {
            display: block;
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffcc80;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #999;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover {
            color: #1a73e8;
        }

        /* ✅ 成功后的额外提示 */
        .success-tip {
            display: none;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            color: #2e7d32;
            line-height: 1.8;
        }
        .success-tip.show {
            display: block;
        }
        .success-tip strong {
            color: #1b5e20;
        }

        @media (max-width: 600px) {
            .register-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <span class="logo">🚌</span>
            <h1>加入 BusLens</h1>
            <p>注册后可以上传机位和照片</p>
        </div>

        <div class="welcome-box">
            <p>📸 每一张照片，都是你独一无二的视角</p>
            <p style="font-size:13px;margin-top:4px;">🔐 密码由 Supabase Auth 安全托管</p>
        </div>

        <!-- ✅ 邮箱验证提示 -->
        <div class="notice-box">
            📧 注册后需要 <strong>邮箱验证</strong>，请使用真实邮箱<br>
            验证邮件可能被误判为垃圾邮件，请检查 <strong>垃圾箱</strong>
        </div>

        <div class="message" id="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>👤 用户名 <span class="required">*</span></label>
                <input type="text" id="username" placeholder="4-20个字符，字母/数字/下划线" required minlength="4" maxlength="20">
                <div class="hint">只支持英文、数字和下划线</div>
            </div>

            <div class="form-group">
                <label>📧 邮箱 <span class="required">*</span></label>
                <input type="email" id="email" placeholder="请输入邮箱地址" required>
                <div class="hint">用于登录和接收验证邮件</div>
            </div>

            <div class="form-group">
                <label>🔒 密码 <span class="required">*</span></label>
                <input type="password" id="password" placeholder="至少6位" required minlength="6">
                <div class="hint">建议包含字母和数字</div>
            </div>

            <div class="form-group">
                <label>🔒 确认密码 <span class="required">*</span></label>
                <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
            </div>

            <button type="submit" class="btn-primary" id="registerBtn">注 册</button>
        </form>

        <!-- ✅ 注册成功后的提示 -->
        <div class="success-tip" id="successTip">
            📧 验证邮件已发送至您的邮箱<br>
            请点击邮件中的链接完成验证，然后 <a href="login.html" style="color:#1a73e8;font-weight:500;">前往登录</a>
        </div>

        <div class="register-footer">已有账号？<a href="login.html">立即登录</a></div>
        <a href="index.html" class="back-link">← 返回首页浏览机位</a>
    </div>

    <script>
        var SESSION_KEY = 'bus_user_session';
        var supabaseClient = null;

        // ============================================================
        //  初始化 Supabase
        // ============================================================
        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  UI 工具函数
        // ============================================================
        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        function clearMessage() {
            var el = document.getElementById('message');
            el.textContent = '';
            el.className = 'message';
            el.style.display = 'none';
        }

        function setButtonLoading(isLoading) {
            var btn = document.getElementById('registerBtn');
            if (!btn) return;
            btn.disabled = !!isLoading;
            btn.textContent = isLoading ? '⏳ 注册中...' : '注 册';
        }

        // ============================================================
        //  保存 Session
        // ============================================================
        function saveSession(result) {
            var session = {
                id: result.user.id,
                username: result.user.username,
                email: result.user.email,
                role: result.user.role || 'user',
                auth_user_id: result.user.id,
                loginTime: Date.now()
            };

            sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));

            if (result.access_token && supabaseClient) {
                supabaseClient.auth.setSession({
                    access_token: result.access_token,
                    refresh_token: result.session?.refresh_token || ''
                }).catch(function(err) {
                    console.warn('写入 Supabase session 失败:', err);
                });
            }
        }

        // ============================================================
        //  注册函数
        // ============================================================
        async function handleRegister(username, email, password) {
            console.log('📝 开始注册:', username, email);

            var response = await fetch(
                'https://keeybzxxkjxvlvhjjdpr.supabase.co/functions/v1/register',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                }
            );

            var rawText = await response.text();
            console.log('📦 服务器响应:', rawText);

            var result;
            try {
                result = JSON.parse(rawText);
            } catch (parseError) {
                throw new Error('服务器返回了无效数据，请稍后重试');
            }

            if (!response.ok || !result.success) {
                throw new Error(result.error || '注册失败');
            }

            return result;
        }

        // ============================================================
        //  表单提交
        // ============================================================
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            clearMessage();
            document.getElementById('successTip').classList.remove('show');

            var username = document.getElementById('username').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            // 验证
            if (!/^[a-zA-Z0-9_]{4,20}$/.test(username)) {
                showMessage('❌ 用户名只能包含英文、数字、下划线，且4-20个字符', 'error');
                return;
            }

            if (!email || !email.includes('@')) {
                showMessage('❌ 请填写有效的邮箱地址', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('❌ 密码至少6位', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('❌ 两次密码不一致', 'error');
                return;
            }

            setButtonLoading(true);
            showMessage('⏳ 正在注册...', 'loading');

            try {
                var result = await handleRegister(username, email, password);

                // ✅ 注册成功，显示邮箱验证提示
                showMessage('✅ 注册成功！请查收邮箱并完成验证', 'success');
                document.getElementById('successTip').classList.add('show');

                // ✅ 尝试自动登录（如果邮箱已确认，会自动登录）
                if (result.session) {
                    saveSession(result);
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    // 需要邮箱验证，跳转到登录页
                    setTimeout(function() {
                        window.location.href = 'login.html';
                    }, 3000);
                }

            } catch (error) {
                console.error('❌ 注册失败:', error);
                showMessage('❌ ' + error.message, 'error');
                setButtonLoading(false);
            }
        });

        console.log('🚀 注册页面已加载');
    </script>
</body>
</html>
