        .modal-content .btn-row {

<body>

    <nav class="navbar">
        <div class="brand">
            <span>🚌</span> BusLens
            <span class="tagline">· 巴士机位档案</span>
        </div>
        <div class="nav-links" id="navLinks"></div>
        <div class="user-area" id="userArea"></div>
    </nav>

    <div class="main-layout">

        <!-- ===== 左侧机位面板 ===== -->
        <div class="archive-panel" id="archivePanel">
            <div class="panel-toggle-area">
                <button class="toggle-btn" id="toggleBtn" onclick="togglePanel()" title="收起侧栏">◀</button>
            </div>
            <div class="archive-header">
                <div class="title">
                    📋 机位档案
                    <span class="count" id="totalCount">0</span>
                    <span class="view-count" id="viewCount"></span>
                </div>
                <div class="header-actions">
                    <button onclick="openFullscreen()" title="全屏查看">⛶</button>
                </div>
            </div>
            <div class="filter-bar" id="filterBar">
                <span class="filter-label">🎯 等级：</span>
                <button class="filter-btn active-all" data-filter="all" onclick="setFilter('all')">
                    <span class="dot all"></span>全部
                </button>
                <button class="filter-btn" data-filter="high" onclick="setFilter('high')">
                    <span class="dot high"></span>上等
                </button>
                <button class="filter-btn" data-filter="medium" onclick="setFilter('medium')">
                    <span class="dot medium"></span>中等
                </button>
                <button class="filter-btn" data-filter="low" onclick="setFilter('low')">
                    <span class="dot low"></span>下等
                </button>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 搜索机位名称..." oninput="applySearch()">
            </div>
            <div class="spot-list" id="spotList">
                <div style="text-align:center;padding:40px 0;color:#999;">
                    <span class="spinner" style="display:inline-block;animation:spin 1s linear infinite;font-size:24px;">⟳</span>
                    <p style="margin-top:8px;">加载中...</p>
                </div>
            </div>
        </div>

        <!-- ===== 浮动按钮组 ===== -->
        <div class="float-btn-group" id="floatBtnGroup">
            <button class="float-btn btn-expand" id="floatToggleBtn" onclick="togglePanel()" title="展开侧栏">
                ▶
                <span class="label">展开侧栏</span>
            </button>
            <a href="vehicles.html" class="float-btn btn-archive" title="巴士档案">
                🚌
                <span class="label">巴士档案</span>
            </a>
        </div>

        <!-- ===== 地图面板 ===== -->
        <div class="map-panel">
            <div id="container">
                <div class="loading-tip" id="loadingTip">
                    <span class="spinner">⟳</span> 加载地图中...
                </div>
            </div>
            <div class="legend">
                <div class="title">⭐ 机位等级</div>
                <div class="legend-item"><span class="legend-dot high"></span> 上等 <span class="legend-count" id="countHigh">0</span></div>
                <div class="legend-item"><span class="legend-dot medium"></span> 中等 <span class="legend-count" id="countMedium">0</span></div>
                <div class="legend-item"><span class="legend-dot low"></span> 下等 <span class="legend-count" id="countLow">0</span></div>
            </div>
        </div>
    </div>

    <!-- ===== 手机底部抽屉 ===== -->
    <div class="mobile-bottom-bar collapsed" id="mobileBottomBar">
        <div class="bottom-header" onclick="toggleMobileBar()">
            <div class="title">
                📋 机位档案
                <span class="count" id="mobileTotalCount">0</span>
            </div>
            <button class="bottom-toggle-btn" id="mobileToggleBtn" onclick="event.stopPropagation();toggleMobileBar();">▲</button>
        </div>
        <div class="bottom-body">
            <div class="bottom-filter" id="mobileFilterBar">
                <button class="filter-btn active-all" data-filter="all" onclick="setMobileFilter('all')">
                    <span class="dot all"></span>全部
                </button>
                <button class="filter-btn" data-filter="high" onclick="setMobileFilter('high')">
                    <span class="dot high"></span>上等
                </button>
                <button class="filter-btn" data-filter="medium" onclick="setMobileFilter('medium')">
                    <span class="dot medium"></span>中等
                </button>
                <button class="filter-btn" data-filter="low" onclick="setMobileFilter('low')">

    <div class="status-msg" id="statusMsg"></div>

    <script>
        // ============================================================
        //  ✅ Supabase 客户端初始化
        // ============================================================
        var supabaseClient = null;
        var supabaseReady = false;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                supabaseReady = true;
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                supabaseReady = false;
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  用户状态
        // ============================================================
        function getCurrentUser() {
            try {
                var raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function isAdmin() {
            var user = getCurrentUser();
            if (!user) return false;
            return ADMIN_USERNAMES.indexOf(user.username) !== -1;
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            window.location.href = 'index.html';
        }

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getRankLabel(rank) {
            var map = { high: '上等 ⭐⭐⭐', medium: '中等 ⭐⭐', low: '下等 ⭐' };
            return map[rank] || rank;
        }

        function getRankColor(rank) {
            var map = { high: '#ff4444', medium: '#ffbb33', low: '#00c851' };
            return map[rank] || '#999';
        }

        function getDeviceLabel(device) {
            var map = { phone: '📱 手机', camera: '📷 相机', both: '📱📷 两者皆可' };
            return map[device] || '❓ 未指定';
        }

        function getDeviceIcon(device) {
            var map = { phone: '📱', camera: '📷', both: '📱📷' };
            return map[device] || '❓';
        }

        function showStatus(text, type) {
            var el = document.getElementById('statusMsg');
            el.textContent = text;
            el.className = 'status-msg show ' + type;
            clearTimeout(el._timer);
            el._timer = setTimeout(function() {
                el.className = 'status-msg';
            }, 3000);
        }

        function hideLoadingTip() {
            var tip = document.getElementById('loadingTip');
            if (tip) tip.style.display = 'none';
        }

        // ============================================================
        //  面板控制
        // ============================================================
        var panelCollapsed = false;

        function togglePanel() {
            panelCollapsed = !panelCollapsed;
            var panel = document.getElementById('archivePanel');
            var btn = document.getElementById('toggleBtn');
            var floatBtn = document.getElementById('floatToggleBtn');
            var floatGroup = document.getElementById('floatBtnGroup');

            if (panelCollapsed) {
                panel.classList.add('collapsed');
                btn.textContent = '▶';
                floatGroup.classList.add('visible');
            } else {
                panel.classList.remove('collapsed');
                btn.textContent = '◀';
                floatGroup.classList.remove('visible');
                var children = panel.querySelectorAll('.archive-header, .filter-bar, .search-bar, .spot-list, .panel-toggle-area');
                children.forEach(function(el) {
                    el.style.display = '';
                });
            }
            if (map) {
                setTimeout(function() { map.setFitView(); }, 450);
            }
        }

        var mobileBarCollapsed = true;

        function toggleMobileBar() {
            mobileBarCollapsed = !mobileBarCollapsed;
            var bar = document.getElementById('mobileBottomBar');
            var btn = document.getElementById('mobileToggleBtn');
            if (mobileBarCollapsed) {
                bar.classList.add('collapsed');
                btn.textContent = '▲';
            } else {
                bar.classList.remove('collapsed');
                btn.textContent = '▼';
            }
        }

        // ============================================================
        //  手机端筛选
        // ============================================================
        var mobileFilter = 'all';
        var mobileSearchQuery = '';

        function setMobileFilter(filter) {
            mobileFilter = filter;
            document.querySelectorAll('#mobileFilterBar .filter-btn').forEach(function(btn) {
                var f = btn.dataset.filter;
                btn.className = 'filter-btn';
                if (f === filter) btn.classList.add('active-' + filter);
            });
            applyMobileFilterAndSearch();
        }

        function applyMobileSearch() {
            mobileSearchQuery = document.getElementById('mobileSearchInput').value.trim().toLowerCase();
            applyMobileFilterAndSearch();
        }

        function applyMobileFilterAndSearch() {
            var spots = allSpots.filter(function(s) {
                if (s.status !== 'approved') return false;
                if (mobileFilter !== 'all' && s.rank !== mobileFilter) return false;
                if (mobileSearchQuery && !s.name.toLowerCase().includes(mobileSearchQuery)) return false;
                return true;
            });
            renderMobileSpotList(spots);
        }

        function renderMobileSpotList(spots) {
            var container = document.getElementById('mobileSpotList');
            document.getElementById('mobileTotalCount').textContent = spots.length;
            if (spots.length === 0) {
                container.innerHTML = '<div class="spot-card"><div class="card-empty">📭 没有匹配的机位</div></div>';
                return;
            }
            var html = '';
            spots.forEach(function(spot) {
                var photos = spot.photos || [];
                var validPhotos = photos.filter(function(p) { return p.status !== 'rejected'; });
                var photoCount = validPhotos.length;
                if (spot.example_photo) photoCount += 1;
                var rankClass = spot.rank || 'medium';
                var rankLabel = getRankLabel(spot.rank);
                var deviceIcon = getDeviceIcon(spot.device_type);
                var isActive = (selectedSpotId == spot.id) ? 'active' : '';
                html +=
                    '<div class="spot-card ' + isActive + '" data-spot-id="' + spot.id + '" onclick="selectSpot(' + spot.id +
                    ')">' +
                    '<span class="card-rank ' + rankClass + '">' + rankLabel + '</span>' +
                    '<div class="card-name">' + escapeHtml(spot.name) + '</div>' +
                    '<div class="card-meta">' +
                    '<span>📤 ' + escapeHtml(spot.created_by || '未知') + '</span>' +
                    '<span>📸 ' + photoCount + ' 张</span>' +
                    '<span>' + deviceIcon + '</span>' +
                    '</div>' +
                    '</div>';
            });
            container.innerHTML = html;
        }

        function openFullscreen() {
            showStatus('📋 全屏查看功能开发中...', 'loading');
        }

        // ============================================================
        //  渲染导航（含 🚌 档案入口）
        // ============================================================
        function renderNav() {
            var nav = document.getElementById('navLinks');
            var userArea = document.getElementById('userArea');
            var user = getCurrentUser();

            if (user) {
                nav.innerHTML =
                    '<a href="index.html" class="active">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html">🚌 档案</a>' +
                    '<a href="profile.html">👤 个人中心</a>' +
                    '<a href="upload.html">📤 新机位</a>';
                userArea.innerHTML =
                    '<span class="user-name">👤 ' + escapeHtml(user.username) + '</span>' +
                    '<button class="btn-logout" onclick="logout()">退出</button>';
            } else {
                nav.innerHTML =
                    '<a href="index.html" class="active">🏠 地图</a>' +
                    '<a href="discover.html">🔍 发现</a>' +
                    '<a href="vehicles.html">🚌 档案</a>' +
                    '<a href="login.html">登录</a>' +
                    '<a href="register.html">注册</a>';
                userArea.innerHTML = '';
            }
        }

        // ============================================================
        //  高德地图加载
        // ============================================================
        var mapLoaded = false;
        var mapReadyCallbacks = [];

        function onMapReady(callback) {
            if (mapLoaded) { callback(); } else { mapReadyCallbacks.push(callback); }
        }

        function loadAmap() {
            fetch('https://keeybzxxkjxvlvhjjdpr.supabase.co/functions/v1/get-amap-config')
                .then(function(response) {
                    if (!response.ok) throw new Error('网络请求失败: ' + response.status);
                    return response.json();
                })
                .then(function(config) {
                    console.log('✅ 获取高德配置成功');
                    if (!config || !config.key || !config.security) {
                        console.error('❌ 配置数据不完整:', config);
                        return;
                    }
                    window._AMapSecurityConfig = { securityJsCode: config.security };
                    if (typeof AMap !== 'undefined') {
                        mapLoaded = true;
                        mapReadyCallbacks.forEach(function(cb) { cb(); });
                        mapReadyCallbacks = [];
                        return;
                    }
                    var script = document.createElement('script');
                    script.src = 'https://webapi.amap.com/maps?v=2.0&key=' + config.key;
                    script.onload = function() {
                        console.log('✅ 高德地图加载成功');
                        mapLoaded = true;
                        mapReadyCallbacks.forEach(function(cb) { cb(); });
                        mapReadyCallbacks = [];
                    };
                    script.onerror = function() {
                        console.error('❌ 高德地图加载失败');
                    };
                    document.head.appendChild(script);
                })
                .catch(function(error) {
                    console.error('❌ 获取高德配置失败:', error);
                    document.getElementById('loadingTip').innerHTML =
                        '<span style="color:#f44336;">⚠️ 地图加载失败，请刷新重试</span>';
                });
        }

        // ============================================================
        //  全局状态
        // ============================================================
        var allSpots = [];
        var filteredSpots = [];
        var currentFilter = 'all';
        var searchQuery = '';
        var map = null;
        var markers = [];
        var selectedSpotId = null;
        var infoWindow = null;
        var mapMoveTimer = null;

        // ============================================================
        //  筛选与搜索
        // ============================================================
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('#filterBar .filter-btn').forEach(function(btn) {
                var f = btn.dataset.filter;
                btn.className = 'filter-btn';
                if (f === filter) btn.classList.add('active-' + filter);
            });
            applyFilterAndSearch();
        }

        function applySearch() {
            searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            applyFilterAndSearch();
        }

        function applyFilterAndSearch() {
            var spots = allSpots.filter(function(s) {
                if (s.status !== 'approved') return false;
                if (currentFilter !== 'all' && s.rank !== currentFilter) return false;
                if (searchQuery && !s.name.toLowerCase().includes(searchQuery)) return false;
                return true;
            });
            filteredSpots = spots;
            renderSpotList(spots);
            renderMobileSpotList(spots);
            updateMapMarkers(spots);
        }

        // ============================================================
        //  地图视野
        // ============================================================
        function getSpotsInView(spots) {
            if (!map || !spots || spots.length === 0) return [];
            var bounds = map.getBounds();
            if (!bounds) return spots;
            var sw = bounds.getSouthWest();
            var ne = bounds.getNorthEast();
            var lngMin = sw.getLng() - 0.015;
            var lngMax = ne.getLng() + 0.015;
            var latMin = sw.getLat() - 0.015;
            var latMax = ne.getLat() + 0.015;
            return spots.filter(function(spot) {
                return spot.lng >= lngMin && spot.lng <= lngMax &&
                    spot.lat >= latMin && spot.lat <= latMax;
            });
        }

        function updateSpotListWithView(spots) {
            var container = document.getElementById('spotList');
            var totalCount = document.getElementById('totalCount');
            var viewCount = document.getElementById('viewCount');

            if (!spots || spots.length === 0) {
                container.innerHTML = '<div class="spot-card"><div class="card-empty">📭 没有匹配的机位</div></div>';
                totalCount.textContent = '0';
                viewCount.textContent = '';
                return;
            }

            var inViewSpots = getSpotsInView(spots);
            totalCount.textContent = spots.length;
            viewCount.textContent = '（显示 ' + inViewSpots.length + ' 个）';

            if (inViewSpots.length === 0) {
                container.innerHTML = '<div class="spot-card"><div class="card-empty">📍 当前地图视野内没有机位<br><span style="font-size:12px;color:#bbb;">拖动或缩放地图试试</span></div></div>';
                return;
            }

            var html = '';
            inViewSpots.forEach(function(spot) {
                var photos = spot.photos || [];
                var validPhotos = photos.filter(function(p) { return p.status !== 'rejected'; });
                var photoCount = validPhotos.length;
                if (spot.example_photo) photoCount += 1;
                var rankClass = spot.rank || 'medium';
                var rankLabel = getRankLabel(spot.rank);
                var deviceIcon = getDeviceIcon(spot.device_type);
                var isActive = (selectedSpotId == spot.id) ? 'active' : '';
                html +=
                    '<div class="spot-card ' + isActive + '" data-spot-id="' + spot.id + '" onclick="selectSpot(' +
                    spot.id + ')">' +
                    '<span class="card-rank ' + rankClass + '">' + rankLabel + '</span>' +
                    '<div class="card-name">' + escapeHtml(spot.name) + '</div>' +
                    '<div class="card-meta">' +
                    '<span>📤 ' + escapeHtml(spot.created_by || '未知') + '</span>' +
                    '<span>📸 ' + photoCount + ' 张</span>' +
                    '<span>' + deviceIcon + '</span>' +
                    '</div>' +
                    '</div>';
            });
            container.innerHTML = html;
        }

        function renderSpotList(spots) {
            updateSpotListWithView(spots);
        }

        function onMapMove() {
            if (mapMoveTimer) {
                clearTimeout(mapMoveTimer);
            }
            mapMoveTimer = setTimeout(function() {
                if (filteredSpots.length > 0) updateSpotListWithView(filteredSpots);
                mapMoveTimer = null;
            }, 150);
        }

        function selectSpot(spotId) {
            selectedSpotId = spotId;
            var spot = allSpots.find(function(s) { return s.id == spotId && s.status === 'approved'; });
            if (!spot) return;

            document.querySelectorAll('.spot-card').forEach(function(el) {
                el.classList.toggle('active', el.dataset.spotId == spotId);
            });

            if (map) {
                map.setCenter([spot.lng, spot.lat]);
                map.setZoom(16);
                var targetMarker = null;
                markers.forEach(function(marker) {
                    var pos = marker.getPosition();
                    if (pos.getLng() === spot.lng && pos.getLat() === spot.lat) targetMarker = marker;
                });
                if (targetMarker) {
                    setTimeout(function() { targetMarker.emit('click'); }, 350);
                }
            }
            if (window.innerWidth <= 640 && !mobileBarCollapsed) toggleMobileBar();
        }

        // ============================================================
        //  ⭐ 构建 InfoWindow（兼容双数据源）
        // ============================================================
        var photoCache = {};
        var allVehiclesCache = [];

        function loadPhotosForSpot(spotId, callback) {
            if (photoCache[spotId]) {
                callback(photoCache[spotId]);
                return;
            }

            // 1. 优先从 user_photos 表读取（新数据）
            supabaseClient
                .from('user_photos')
                .select('*')
                .eq('spot_id', spotId)
                .eq('status', 'approved')
                .order('shoot_date', { ascending: false })
                .then(function(res) {
                    if (!res.error && res.data && res.data.length > 0) {
                        // 有新数据
                        photoCache[spotId] = res.data;
                        callback(photoCache[spotId]);
                    } else {
                        // 2. 没有新数据，从 spots.photos 读取（兼容旧数据）
                        supabaseClient
                            .from('spots')
                            .select('photos')
                            .eq('id', spotId)
                            .single()
                            .then(function(spotRes) {
                                if (!spotRes.error && spotRes.data) {
                                    var photos = spotRes.data.photos || [];
                                    var validPhotos = photos.filter(function(p) {
                                        return p.status === 'approved' || p.status === 'pending';
                                    });
                                    // 转换成统一格式
                                    var formatted = validPhotos.map(function(p) {
                                        return {
                                            photo_url: p.url,
                                            spot_id: spotId,
                                            vehicle_id: p.vehicle_id || null,
                                            uploader: p.uploader || '未知',
                                            caption: p.caption || null,
                                            shoot_date: p.shoot_date || p.date || null,
                                            status: p.status || 'approved'
                                        };
                                    });
                                    photoCache[spotId] = formatted;
                                    callback(photoCache[spotId]);
                                } else {
                                    photoCache[spotId] = [];
                                    callback([]);
                                }
                            })
                            .catch(function() {
                                photoCache[spotId] = [];
                                callback([]);
                            });
                    }
                })
                .catch(function() {
                    // 出错时尝试从 spots.photos 读取
                    supabaseClient
                        .from('spots')
                        .select('photos')
                        .eq('id', spotId)
                        .single()
                        .then(function(spotRes) {
                            if (!spotRes.error && spotRes.data) {
                                var photos = spotRes.data.photos || [];
                                var validPhotos = photos.filter(function(p) {
                                    return p.status === 'approved' || p.status === 'pending';
                                });
                                var formatted = validPhotos.map(function(p) {
                                    return {
                                        photo_url: p.url,
                                        spot_id: spotId,
                                        vehicle_id: p.vehicle_id || null,
                                        uploader: p.uploader || '未知',
                                        caption: p.caption || null,
                                        shoot_date: p.shoot_date || p.date || null,
                                        status: p.status || 'approved'
                                    };
                                });

                            escapeHtml(p.caption.slice(0, 12)) + '</span>';

            } else {

        function loadData() {
            if (!supabaseClient) {
                console.error('❌ Supabase 未初始化');

            // 加载车辆缓存
            supabaseClient
                .from('vehicles')

                .then(function(res) {
                    if (!res.error) {

                    }

                .catch(function(err) {
                    console.warn('加载车辆缓存失败:', err);
                });

            // 预加载所有已审核照片（用于计数）
            supabaseClient
                .from('user_photos')
                .select('spot_id')
                .eq('status', 'approved')
                .then(function(res) {
                    if (!res.error) {
                        var photoCounts = {};
                        (res.data || []).forEach(function(p) {
                            photoCounts[p.spot_id] = (photoCounts[p.spot_id] || 0) + 1;

                .catch(function(err) {
                    console.warn('加载照片计数失败:', err);
                });

            supabaseClient
                .from('spots')
                .select('*')
                .then(function(res) {
                    if (res.error) throw new Error(res.error.message);
                    allSpots = res.data || [];
                    var approved = allSpots.filter(function(s) { return s.status === 'approved'; });
                    var high = approved.filter(function(s) { return s.rank === 'high'; }).length;
                    var medium = approved.filter(function(s) { return s.rank === 'medium'; }).length;
                    var low = approved.filter(function(s) { return s.rank === 'low'; }).length;
                    document.getElementById('countHigh').textContent = high;
                    document.getElementById('countMedium').textContent = medium;
                    document.getElementById('countLow').textContent = low;
                    applyFilterAndSearch();
                    if (map) {
                        map.on('moveend', onMapMove);
                        map.on('zoomend', onMapMove);

                    var params = new URLSearchParams(window.location.search);
                    var spotId = params.get('spot_id');
                    if (spotId) {
                        setTimeout(function() { selectSpot(parseInt(spotId)); }, 700);
                    }
                    console.log('✅ 加载完成，共 ' + approved.length + ' 个已审核机位');
                })
                .catch(function(error) {
                    console.error('❌ 加载数据失败:', error);
                    showStatus('❌ 读取数据失败：' + error.message, 'error');

        // ============================================================
        //  🖼️ Canvas 图片处理
        // ============================================================
        function processImageWithCanvas(file, options, username) {
            var defaults = {
                maxWidth: 1920,
                maxHeight: 1080,
                quality: 0.85,
                maxSizeMB: 4.5,
                barHeight: 50,
                watermarkText: 'BusLens',
                copyrightText: '© 2026 ' + (username || '用户') + ' 版权所有'
            };
            var opt = Object.assign({}, defaults, options);
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var width = img.width;
                        var height = img.height;
                        if (width > opt.maxWidth) {
                            height = height * opt.maxWidth / width;
                            width = opt.maxWidth;
                        }
                        if (height > opt.maxHeight) {
                            width = width * opt.maxHeight / height;
                            height = opt.maxHeight;
                        }
                        var finalWidth = Math.round(width);
                        var finalHeight = Math.round(height);
                        var barHeight = opt.barHeight;
                        var totalHeight = finalHeight + barHeight;
                        var canvas = document.createElement('canvas');
                        canvas.width = finalWidth;
                        canvas.height = totalHeight;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, finalWidth, finalHeight);
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(0, finalHeight, finalWidth, barHeight);
                        var fontSize = Math.max(11, Math.min(16, Math.round(finalWidth * 0.012)));
                        ctx.textBaseline = 'middle';
                        ctx.textAlign = 'left';
                        ctx.font = 'bold ' + fontSize + 'px Arial, sans-serif';
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText(opt.watermarkText, 14, finalHeight + barHeight / 2 + 1);
                        ctx.textAlign = 'right';
                        ctx.font = fontSize + 'px Arial, sans-serif';
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText(opt.copyrightText, finalWidth - 14, finalHeight + barHeight / 2 + 1);
                        var watermarkFontSize = Math.max(40, Math.min(90, Math.round(finalWidth * 0.048)));
                        ctx.save();
                        ctx.globalAlpha = 0.75;
                        ctx.font = 'bold ' + watermarkFontSize + 'px Arial, sans-serif';
                        ctx.textBaseline = 'bottom';
                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#FFFFFF';
                        var padding = Math.max(16, Math.round(finalWidth * 0.02));
                        ctx.fillText(opt.watermarkText, padding, finalHeight - padding);
                        ctx.restore();
                        var quality = opt.quality;
                        var needCompress = file.size > opt.maxSizeMB * 1024 * 1024;

                        function tryExport() {
                            canvas.toBlob(function(blob) {
                                if (needCompress && blob.size > opt.maxSizeMB * 1024 * 1024 && quality > 0.1) {
                                    quality -= 0.05;
                                    tryExport();
                                    return;
                                }
                                var originalName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
                                var processedFile = new File([blob], originalName, { type: 'image/jpeg' });
                                console.log('✅ 处理完成：' +
                                    (file.size / 1024 / 1024).toFixed(2) + 'MB → ' +
                                    (blob.size / 1024 / 1024).toFixed(2) + 'MB'
                                );
                                resolve(processedFile);
                            }, 'image/jpeg', quality);
                        }
                        tryExport();
                    };
                    img.onerror = function() { reject(new Error('图片加载失败')); };
                    img.src = e.target.result;
                };
                reader.onerror = function() { reject(new Error('文件读取失败')); };
                reader.readAsDataURL(file);
            });
        }

                    (v.license_plate || '') + ' ' +

        async function submitUploadPhoto() {
            if (uploadPhotoFiles.length === 0) {
                showUploadMessage('请至少选择 1 张照片', 'error');
                return;
            }

            var user = getCurrentUser();
            if (!user) {
                showUploadMessage('请先登录', 'error');
                return;
            }

            if (!supabaseClient) {
                showUploadMessage('系统初始化失败，请刷新页面重试', 'error');
                return;
            }

            var btn = document.getElementById('uploadPhotoSubmitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 上传中...';
            showUploadMessage('正在上传...', 'loading');

            try {
                // 1. 上传图片到 ImgBB
                var uploadedUrls = [];
                for (var i = 0; i < uploadPhotoFiles.length; i++) {
                    showUploadMessage('上传 ' + (i + 1) + '/' + uploadPhotoFiles.length + '...', 'loading');
                    var processedFile = await processImageWithCanvas(uploadPhotoFiles[i], {
                        maxWidth: 1920,
                        maxHeight: 1080,
                        quality: 0.85,
                        maxSizeMB: 4.5,
                        barHeight: 50,
                        watermarkText: 'BusLens',
                        copyrightText: '© 2026 ' + user.username + ' 版权所有'
                    }, user.username);
                    var url = await uploadToImgBB(processedFile);
                    uploadedUrls.push(url);
                }

                // 2. 收集表单数据
                var shootDate = document.getElementById('shootDate').value || null;
                var shootTime = document.getElementById('shootTime').value || null;
                var caption = document.getElementById('photoCaption').value.trim() || null;
                var cameraModel = document.getElementById('cameraModel').value.trim() || null;
                var lens = document.getElementById('lens').value.trim() || null;
                var focalLength = parseInt(document.getElementById('focalLength').value) || null;
                var aperture = document.getElementById('aperture').value.trim() || null;
                var shutterSpeed = document.getElementById('shutterSpeed').value.trim() || null;
                var iso = parseInt(document.getElementById('iso').value) || null;
                var shootLng = parseFloat(document.getElementById('shootLng').value) || null;
                var shootLat = parseFloat(document.getElementById('shootLat').value) || null;
                var weather = document.getElementById('weather').value || null;

                // 3. 构建 user_photos 记录
                var photoRecords = uploadedUrls.map(function(url) {
                    return {
                        photo_url: url,
                        spot_id: uploadPhotoSpotId,
                        vehicle_id: selectedVehicleId || null,
                        uploader: user.username,
                        uploader_name: user.username,
                        shoot_date: shootDate,
                        shoot_time: shootTime,
                        caption: caption,
                        camera_model: cameraModel,
                        lens: lens,
                        focal_length: focalLength,
                        aperture: aperture,
                        shutter_speed: shutterSpeed,
                        iso: iso,
                        shoot_lng: shootLng,
                        shoot_lat: shootLat,
                        weather: weather,
                        status: 'pending',
                        created_at: new Date().toISOString()
                    };
                });

                // 4. 插入 user_photos
                var { error: insertError } = await supabaseClient
                    .from('user_photos')
                    .insert(photoRecords);

                if (insertError) throw new Error(insertError.message);

                // ============================================================
                //  ✅ 关键修复：同时更新 spots.photos（兼容旧逻辑）
                // ============================================================
                var { data: spot, error: fetchError } = await supabaseClient
                    .from('spots')
                    .select('photos')
                    .eq('id', uploadPhotoSpotId)
                    .single();

                if (fetchError) throw new Error(fetchError.message);

                var existingPhotos = spot.photos || [];
                var newPhotos = uploadedUrls.map(function(url, index) {
                    return {
                        id: 'photo_' + Date.now() + '_' + index + '_' + Math.random().toString(36).substr(2, 4),
                        url: url,
                        uploader: user.username,
                        uploaderName: user.username,
                        status: 'pending',
                        date: new Date().toISOString(),
                        shoot_date: shootDate,
                        shoot_time: shootTime,
                        caption: caption,
                        camera_model: cameraModel,
                        lens: lens,
                        focal_length: focalLength,
                        aperture: aperture,
                        shutter_speed: shutterSpeed,
                        iso: iso,
                        vehicle_id: selectedVehicleId || null
                    };
                });

                var updatedPhotos = existingPhotos.concat(newPhotos);
                var { error: updateError } = await supabaseClient
                    .from('spots')
                    .update({ photos: updatedPhotos })
                    .eq('id', uploadPhotoSpotId);

                if (updateError) throw new Error(updateError.message);

                // 5. 更新 spots.related_vehicles（双向关联）
                if (selectedVehicleId) {
                    // 更新 vehicle 的 related_spot_ids
                    var { data: vehicleData, error: vFetchError } = await supabaseClient
                        .from('vehicles')
                        .select('related_spot_ids')
                        .eq('id', selectedVehicleId)
                        .single();

                    if (!vFetchError && vehicleData) {
                        var spotIds = vehicleData.related_spot_ids || [];
                        if (!spotIds.includes(uploadPhotoSpotId)) {
                            spotIds.push(uploadPhotoSpotId);
                            await supabaseClient
                                .from('vehicles')
                                .update({ related_spot_ids: spotIds })
                                .eq('id', selectedVehicleId);
                        }
                    }

                    // 更新 spot 的 related_vehicles
                    var { data: spotData, error: spotFetchError } = await supabaseClient
                        .from('spots')
                        .select('related_vehicles')
                        .eq('id', uploadPhotoSpotId)
                        .single();

                    if (!spotFetchError && spotData) {
                        var relatedVehicles = spotData.related_vehicles || [];
                        if (!relatedVehicles.includes(selectedVehicleId)) {
                            relatedVehicles.push(selectedVehicleId);
                            await supabaseClient
                                .from('spots')
                                .update({ related_vehicles: relatedVehicles })
                                .eq('id', uploadPhotoSpotId);
                        }
                    }
                }

                // 6. 更新缓存
                photoCache[uploadPhotoSpotId] = null;

                showUploadMessage('✅ 已上传 ' + uploadedUrls.length + ' 张照片！' +
                    (selectedVehicleId ? ' 🚌 已关联车辆' : '') +
                    '（已同步到 user_photos 和 spots.photos）', 'success');
                btn.textContent = '✅ 已完成';

                setTimeout(function() {
                    closeUploadModal();
                    loadData();
                    showStatus('✅ 照片上传成功！', 'success');
                }, 1500);

            } catch (error) {
                console.error('上传失败:', error);
                showUploadMessage('❌ ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '📤 上传';
            }
        }

        // ============================================================
        //  启动
        // ============================================================
        renderNav();
        loadAmap();

        onMapReady(function() {
            initMap();
        });

        console.log('🚌 BusLens 地图已加载');
        console.log('✅ 双数据源兼容：user_photos（新）+ spots.photos（旧）');
        console.log('✅ 上传照片同时写入两个地方，保证数据一致性');
        console.log('✅ InfoWindow 优先读取 user_photos，没有则从 spots.photos 兼容');
        console.log('✅ 侧栏卡片照片数从 spots.photos 读取（已同步更新）');
    </script>
</body>
</html>
