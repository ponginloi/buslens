<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置新密码 - BusLens</title>
    <script>
        var SUPABASE_URL = 'https://keeybzxxkjxvlvhjjdpr.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_SpzHfgcLn0deJWoqEPJQ4g_2jzyXXci';
        var SESSION_KEY = 'bus_user_session';
    </script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0fe 0%, #f0f2f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(26, 115, 232, 0.15);
        }
        .logo { font-size: 48px; display: block; text-align: center; margin-bottom: 8px; }
        h1 { font-size: 24px; color: #1a73e8; text-align: center; margin-bottom: 4px; }
        p.sub { color: #888; font-size: 14px; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #333; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12); }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .message { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; display: none; }
        .message.error { display: block; background: #fee8e8; color: #d32f2f; border: 1px solid #f3c4c4; }
        .message.success { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #cce8d0; }
        .message.loading { display: block; background: #e8f0fe; color: #1a73e8; border: 1px solid #c7dafd; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #999; font-size: 13px; text-decoration: none; }
        .back-link:hover { color: #1a73e8; }
        .status-box {
            text-align: center;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .status-box.valid { background: #e8f5e9; color: #2e7d32; border: 1px solid #cce8d0; }
        .status-box.invalid { background: #fee8e8; color: #d32f2f; border: 1px solid #f3c4c4; }
        .status-box.loading { background: #e8f0fe; color: #1a73e8; border: 1px solid #c7dafd; }
        @media (max-width: 600px) {
            .container { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="logo">🔑</span>
        <h1>设置新密码</h1>
        <p class="sub" id="statusText">正在验证链接...</p>

        <div class="message" id="message"></div>

        <div id="resetFormContainer" style="display:none;">
            <form id="resetForm">
                <div class="form-group">
                    <label>🔒 新密码</label>
                    <input type="password" id="newPassword" placeholder="至少6位" required minlength="6">
                </div>
                <div class="form-group">
                    <label>🔒 确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="再次输入新密码" required>
                </div>
                <button type="submit" class="btn" id="resetBtn">✅ 确认重置</button>
            </form>
        </div>

        <a href="login.html" class="back-link">← 返回登录</a>
    </div>

    <script>
        var supabaseClient = null;
        var SESSION_KEY = 'bus_user_session';
        var resetToken = null;

        // ============================================================
        //  初始化 Supabase
        // ============================================================
        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  UI 工具函数
        // ============================================================
        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        function setButtonLoading(isLoading) {
            var btn = document.getElementById('resetBtn');
            if (!btn) return;
            btn.disabled = !!isLoading;
            btn.textContent = isLoading ? '⏳ 更新中...' : '✅ 确认重置';
        }

        function setStatus(text, type) {
            var el = document.getElementById('statusText');
            el.textContent = text;
            el.className = 'status-box ' + type;
        }

        // ============================================================
        //  从 URL 获取 access_token
        // ============================================================
        function getAccessTokenFromURL() {
            var hash = window.location.hash;
            if (hash) {
                var params = new URLSearchParams(hash.substring(1));
                return params.get('access_token');
            }
            return null;
        }

        // ============================================================
        //  验证链接
        // ============================================================
        async function verifyToken() {
            var token = getAccessTokenFromURL();
            var formContainer = document.getElementById('resetFormContainer');

            if (!token) {
                setStatus('❌ 无效的重置链接，请重新申请', 'invalid');
                return;
            }

            resetToken = token;

            try {
                // 用 token 获取用户信息
                var { data, error } = await supabaseClient.auth.getUser(token);

                if (error || !data.user) {
                    console.error('验证失败:', error);
                    setStatus('❌ 链接已过期或无效，请重新申请', 'invalid');
                    return;
                }

                setStatus('✅ 验证通过！请设置新密码（' + data.user.email + '）', 'valid');
                formContainer.style.display = 'block';

            } catch (error) {
                console.error('验证失败:', error);
                setStatus('❌ 验证失败，请重新申请', 'invalid');
            }
        }

        // ============================================================
        //  提交新密码
        // ============================================================
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showMessage('❌ 密码至少6位', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('❌ 两次密码不一致', 'error');
                return;
            }

            if (!resetToken) {
                showMessage('❌ 链接已失效，请重新申请', 'error');
                return;
            }

            setButtonLoading(true);
            showMessage('⏳ 正在更新密码...', 'loading');

            try {
                // 用 token 更新密码
                var { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    throw new Error(error.message);
                }

                showMessage('✅ 密码重置成功！请用新密码登录', 'success');
                document.getElementById('resetFormContainer').style.display = 'none';
                setStatus('✅ 密码已重置，即将跳转登录...', 'valid');

                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2500);

            } catch (error) {
                console.error('重置失败:', error);
                showMessage('❌ ' + error.message, 'error');
                setButtonLoading(false);
            }
        });

        // ============================================================
        //  启动验证
        // ============================================================
        verifyToken();
        console.log('🚀 重置确认页面已加载');
    </script>
</body>
</html>
