<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - BusLens</title>

    <script>
        var SUPABASE_URL = 'https://keeybzxxkjxvlvhjjdpr.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_SpzHfgcLn0deJWoqEPJQ4g_2jzyXXci';
        var SESSION_KEY = 'bus_user_session';  // ✅ 统一使用 bus_user_session
        var ADMIN_USERNAMES = ['ponginloi', 'lnx', 'shaojiu_0053'];
    </script>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ... 样式保持不变 ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0fe 0%, #f0f2f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(26, 115, 232, 0.15);
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-header .logo {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        .login-header h1 {
            font-size: 24px;
            color: #1a73e8;
        }
        .login-header p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }
        .welcome-box {
            background: linear-gradient(135deg, #e8f0fe, #d2e3fc);
            border-left: 4px solid #1a73e8;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
            line-height: 1.8;
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
            background: #fff;
        }
        .form-group input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .login-footer a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
            line-height: 1.6;
        }
        .message.error {
            display: block;
            background: #fee8e8;
            color: #d32f2f;
            border: 1px solid #f3c4c4;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #cce8d0;
        }
        .message.loading {
            display: block;
            background: #e8f0fe;
            color: #1a73e8;
            border: 1px solid #c7dafd;
        }
        .message.warning {
            display: block;
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffcc80;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #999;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover {
            color: #1a73e8;
        }
        .forgot-password {
            text-align: right;
            margin-top: 6px;
            font-size: 13px;
        }
        .forgot-password a {
            color: #1a73e8;
            text-decoration: none;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .email-hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        @media (max-width: 600px) {
            .login-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="logo">🚌</span>
            <h1>登录 BusLens</h1>
            <p>登录后可以上传机位和照片</p>
        </div>

        <div class="welcome-box">
            <p>📢 新系统支持旧账号自动升级</p>
            <p style="margin-top:6px;font-size:13px;">旧用户直接使用 <strong>用户名 + 密码</strong> 登录即可</p>
        </div>

        <div class="message" id="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">👤 用户名 <span style="color:#ff4444;">*</span></label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="email">📧 邮箱 <span style="color:#999;font-weight:400;">（选填）</span></label>
                <input type="email" id="email" placeholder="已绑定邮箱的用户请填写，加快登录速度" autocomplete="email">
                <div class="email-hint">💡 如果你之前绑定过邮箱，填写后可加速登录</div>
            </div>

            <div class="form-group">
                <label for="password">🔒 密码 <span style="color:#ff4444;">*</span></label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>

            <div class="forgot-password">
                <a href="reset-password.html">🔑 忘记密码？</a>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">登 录</button>
        </form>

        <div class="login-footer">
            还没有账号？<a href="register.html">立即注册</a>
        </div>

        <a href="index.html" class="back-link">← 返回首页浏览机位</a>
    </div>

    <script>
        // ============================================================
        //  ✅ 统一使用 bus_user_session
        // ============================================================
        var SESSION_KEY = 'bus_user_session';
        var ADMIN_USERNAMES = ['ponginloi', 'lnx', 'shaojiu_0053'];
        var supabaseClient = null;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var username = document.getElementById('username').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value.trim();
            var btn = document.getElementById('loginBtn');

            if (!username || !password) {
                showMessage('请填写用户名和密码', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '验证中...';
            showMessage('验证中...', 'loading');

            try {
                var loginEmail = email;

                if (!loginEmail) {
                    var { data: userData } = await supabaseClient
                        .from('users')
                        .select('email')
                        .eq('username', username)
                        .single();

                    if (userData && userData.email) {
                        loginEmail = userData.email;
                    } else {
                        loginEmail = username + '@buslens.local';
                    }
                }

                console.log('尝试登录:', loginEmail);

                var { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: loginEmail,
                    password: password
                });

                if (error) {
                    throw new Error(error.message || '用户名或密码错误');
                }

                if (!data || !data.user) {
                    throw new Error('登录失败，请重试');
                }

                var authUsername = data.user.user_metadata?.username ||
                    data.user.raw_user_meta_data?.username ||
                    username;

                // 检查是否是管理员（只检查硬编码列表，不强制要求）
                var isAdminUser = ADMIN_USERNAMES.indexOf(authUsername) !== -1;

                // 保存 session（使用 bus_user_session）
                var session = {
                    id: data.user.id,
                    username: authUsername,
                    email: data.user.email,
                    role: isAdminUser ? 'admin' : 'user',
                    isAdmin: isAdminUser,
                    loginTime: Date.now()
                };
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));

                var successMsg = '登录成功！正在跳转...';
                if (isAdminUser) {
                    successMsg = '✅ 管理员登录成功！正在跳转...';
                }
                showMessage(successMsg, 'success');

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 800);

            } catch (error) {
                console.error('登录失败:', error);
                showMessage(error.message, 'error');
                btn.disabled = false;
                btn.textContent = '登录';
            }
        });

        // ============================================================
        //  ✅ 检查是否已登录（使用 bus_user_session）
        // ============================================================
        (function checkSession() {
            var saved = sessionStorage.getItem(SESSION_KEY);
            if (saved) {
                try {
                    var user = JSON.parse(saved);
                    // 如果 session 有效，跳转到首页
                    if (user && user.username) {
                        window.location.href = 'index.html';
                    } else {
                        sessionStorage.removeItem(SESSION_KEY);
                    }
                } catch (e) {
                    sessionStorage.removeItem(SESSION_KEY);
                }
            }
        })();
    </script>
</body>
</html>
