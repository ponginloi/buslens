<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - BusLens</title>

    <script>
        var SUPABASE_URL = 'https://keeybzxxkjxvlvhjjdpr.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_SpzHfgcLn0deJWoqEPJQ4g_2jzyXXci';
        var SESSION_KEY = 'bus_user_session';
    </script>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0fe 0%, #f0f2f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(26, 115, 232, 0.15);
        }
        .login-header { text-align: center; margin-bottom: 24px; }
        .login-header .logo { font-size: 48px; display: block; margin-bottom: 8px; }
        .login-header h1 { font-size: 24px; color: #1a73e8; }
        .login-header p { color: #888; font-size: 14px; margin-top: 4px; }
        .welcome-box {
            background: linear-gradient(135deg, #e8f0fe, #d2e3fc);
            border-left: 4px solid #1a73e8;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
            line-height: 1.8;
            text-align: center;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #333; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
            background: #fff;
        }
        .form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12); }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3); }
        .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; transform: none; box-shadow: none; }
        .login-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .login-footer a { color: #1a73e8; text-decoration: none; font-weight: 500; }
        .login-footer a:hover { text-decoration: underline; }
        .message { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; display: none; font-size: 14px; line-height: 1.6; }
        .message.error { display: block; background: #fee8e8; color: #d32f2f; border: 1px solid #f3c4c4; }
        .message.success { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #cce8d0; }
        .message.loading { display: block; background: #e8f0fe; color: #1a73e8; border: 1px solid #c7dafd; }
        .message.warning { display: block; background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #999; font-size: 13px; text-decoration: none; }
        .back-link:hover { color: #1a73e8; }
        .forgot-password { text-align: right; margin-top: 6px; font-size: 13px; }
        .forgot-password a { color: #1a73e8; text-decoration: none; }
        .forgot-password a:hover { text-decoration: underline; }
        .email-hint { font-size: 12px; color: #999; margin-top: 4px; }
        @media (max-width: 600px) {
            .login-container { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="logo">🚌</span>
            <h1>登录 BusLens</h1>
            <p>登录后可以上传机位和照片</p>
        </div>

        <div class="welcome-box">
            <p>📢 新系统支持旧账号自动升级</p>
            <p style="margin-top:6px;font-size:13px;">旧用户直接使用 <strong>用户名 + 密码</strong> 登录即可</p>
        </div>

        <div class="message" id="message"></div>

        <form id="loginForm">
            <!-- 用户名（必填） -->
            <div class="form-group">
                <label for="username">👤 用户名 <span style="color:#ff4444;">*</span></label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
            </div>

            <!-- 邮箱（选填，用于 Auth 登录） -->
            <div class="form-group">
                <label for="email">📧 邮箱 <span style="color:#999;font-weight:400;">（选填）</span></label>
                <input type="email" id="email" placeholder="已绑定邮箱的用户请填写，加快登录速度" autocomplete="email">
                <div class="email-hint">💡 如果你之前绑定过邮箱，填写后可加速登录</div>
            </div>

            <div class="form-group">
                <label for="password">🔒 密码 <span style="color:#ff4444;">*</span></label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>

            <div class="forgot-password">
                <a href="reset-password.html">🔑 忘记密码？</a>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">登 录</button>
        </form>

        <div class="login-footer">
            还没有账号？<a href="register.html">立即注册</a>
        </div>

        <a href="index.html" class="back-link">← 返回首页浏览机位</a>
    </div>

    <script>
        var SESSION_KEY = 'bus_user_session';
        var supabaseClient = null;

        // ============================================================
        //  初始化 Supabase
        // ============================================================
        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase SDK 未加载');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Supabase 初始化失败:', e);
                return false;
            }
        }
        initSupabase();

        // ============================================================
        //  UI 工具函数
        // ============================================================
        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        function clearMessage() {
            var el = document.getElementById('message');
            el.textContent = '';
            el.className = 'message';
            el.style.display = 'none';
        }

        function setButtonLoading(isLoading) {
            var btn = document.getElementById('loginBtn');
            if (!btn) return;
            btn.disabled = !!isLoading;
            btn.textContent = isLoading ? '⏳ 登录中...' : '登 录';
        }

        // ============================================================
        //  保存 Session
        // ============================================================
        function saveSession(result) {
            var session = {
                id: result.user.id,
                username: result.user.username,
                email: result.user.email,
                role: result.user.role || 'user',
                auth_user_id: result.user.id,
                mode: result.mode || 'auth',
                migrated: !!result.migrated,
                loginTime: Date.now()
            };

            // 保存到 sessionStorage 和 localStorage
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));

            // 如果有 access_token，也保存到 Supabase Auth session
            if (result.access_token && supabaseClient) {
                supabaseClient.auth.setSession({
                    access_token: result.access_token,
                    refresh_token: result.session?.refresh_token || ''
                }).catch(function(err) {
                    console.warn('写入 Supabase session 失败:', err);
                });
            }
        }

        // ============================================================
        //  检查是否已登录
        // ============================================================
        async function checkExistingSession() {
            try {
                // 检查 Supabase Auth
                if (supabaseClient) {
                    const { data } = await supabaseClient.auth.getSession();
                    if (data && data.session) {
                        window.location.href = 'index.html';
                        return true;
                    }
                }

                // 检查前端 session
                var localSession = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
                if (localSession) {
                    window.location.href = 'index.html';
                    return true;
                }
            } catch (e) {
                console.warn('检查登录态失败:', e);
            }
            return false;
        }

        // ============================================================
        //  登录函数
        // ============================================================
        async function handleLogin(username, email, password) {
            console.log('🔐 开始登录:', username, email || '(无邮箱)');

            var response = await fetch(
                'https://keeybzxxkjxvlvhjjdpr.supabase.co/functions/v1/login',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email || '',  // 选填
                        password: password
                    })
                }
            );

            var rawText = await response.text();
            console.log('📦 服务器响应:', rawText);

            var result;
            try {
                result = JSON.parse(rawText);
            } catch (parseError) {
                throw new Error('服务器返回了无效数据，请稍后重试');
            }

            if (!response.ok || !result.success) {
                var errorMsg = result.error || '登录失败';
                if (result.stage === 'migrate_failed') {
                    errorMsg = '账号迁移失败，请联系管理员';
                } else if (result.stage === 'legacy_failed') {
                    errorMsg = '用户名或密码错误';
                }
                throw new Error(errorMsg);
            }

            return result;
        }

        // ============================================================
        //  表单提交
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            clearMessage();

            var username = document.getElementById('username').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!username) {
                showMessage('❌ 请输入用户名', 'error');
                return;
            }

            if (!password) {
                showMessage('❌ 请输入密码', 'error');
                return;
            }

            setButtonLoading(true);
            showMessage('⏳ 正在登录...', 'loading');

            try {
                var result = await handleLogin(username, email, password);

                // 保存 session
                saveSession(result);

                // 显示成功消息
                var successMsg = '✅ 登录成功！正在跳转...';
                if (result.migrated) {
                    successMsg = '✅ 旧账号已自动升级！正在跳转...\n下次可用邮箱登录';
                }
                showMessage(successMsg, 'success');

                // 跳转
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('❌ 登录失败:', error);
                showMessage('❌ ' + error.message, 'error');
                setButtonLoading(false);
            }
        });

        // ============================================================
        //  启动
        // ============================================================
        (async function initPage() {
            await checkExistingSession();
            console.log('🚀 登录页面已加载');
        })();
    </script>
</body>
</html>
