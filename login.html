<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置新密码 - BusLens</title>
    <script>
        var SUPABASE_URL = 'https://keeybzxxkjxvlvhjjdpr.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_SpzHfgcLn0deJWoqEPJQ4g_2jzyXXci';
    </script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1117, #161b22);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .logo {
            font-size: 48px;
            text-align: center;
            display: block;
            margin-bottom: 8px;
        }
        h1 {
            color: #e6edf3;
            text-align: center;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .sub {
            color: #666;
            text-align: center;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.04);
            color: #e6edf3;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #1a73e8;
        }
        .form-group input::placeholder {
            color: #444;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .message.error {
            display: block;
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.2);
        }
        .message.success {
            display: block;
            background: rgba(76, 175, 80, 0.15);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }
        .message.loading {
            display: block;
            background: rgba(26, 115, 232, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(26, 115, 232, 0.2);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #666;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover {
            color: #58a6ff;
        }
        .status-box {
            text-align: center;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .status-box.valid {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }
        .status-box.invalid {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.2);
        }
        .status-box.loading {
            background: rgba(26, 115, 232, 0.1);
            color: #58a6ff;
            border: 1px solid rgba(26, 115, 232, 0.2);
        }
        .debug-info {
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            font-size: 12px;
            color: #555;
            font-family: monospace;
            word-break: break-all;
            display: none;
        }
        .debug-info.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="logo">🔑</span>
        <h1>设置新密码</h1>
        <div class="sub" id="statusText">正在验证链接...</div>

        <div class="status-box loading" id="statusBox">⏳ 验证中...</div>

        <div class="message" id="message"></div>

        <div id="resetFormContainer" style="display:none;">
            <form id="resetForm">
                <div class="form-group">
                    <input type="password" id="newPassword" placeholder="🔒 新密码（至少6位）" required minlength="6">
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" placeholder="🔒 确认新密码" required>
                </div>
                <button type="submit" class="btn" id="resetBtn">✅ 确认重置</button>
            </form>
        </div>

        <a href="login.html" class="back-link">← 返回登录</a>

        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // ============================================================
        //  ✅ 安全初始化 Supabase
        // ============================================================
        var supabaseClient = null;
        var initError = null;

        function initSupabase() {
            // 检查 Supabase SDK 是否加载
            if (typeof supabase === 'undefined') {
                initError = 'Supabase SDK 未加载，请检查网络连接';
                console.error(initError);
                return false;
            }

            // 检查配置是否存在
            if (!SUPABASE_URL || !SUPABASE_KEY) {
                initError = 'SUPABASE_URL 或 SUPABASE_KEY 未定义，请检查 config.js';
                console.error(initError);
                return false;
            }

            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 客户端初始化成功');
                return true;
            } catch (e) {
                initError = 'Supabase 初始化失败: ' + e.message;
                console.error(initError, e);
                return false;
            }
        }

        // 立即初始化
        var initSuccess = initSupabase();

        // 显示调试信息
        function showDebug(msg) {
            var el = document.getElementById('debugInfo');
            if (el) {
                el.textContent = '🔍 ' + msg;
                el.className = 'debug-info show';
            }
        }

        // ============================================================
        //  UI 工具函数
        // ============================================================
        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        function setStatus(text, type) {
            var box = document.getElementById('statusBox');
            var statusText = document.getElementById('statusText');
            box.textContent = text;
            box.className = 'status-box ' + type;

            if (type === 'valid') {
                statusText.textContent = '✅ 验证通过，请设置新密码';
            } else if (type === 'invalid') {
                statusText.textContent = '❌ 链接无效或已过期';
            } else {
                statusText.textContent = '⏳ 验证中...';
            }
        }

        // 从 URL 获取 access_token
        function getAccessTokenFromURL() {
            var hash = window.location.hash;
            if (hash) {
                var params = new URLSearchParams(hash.substring(1));
                return params.get('access_token');
            }
            return null;
        }

        // ============================================================
        //  ✅ 验证链接 - 无需登录
        // ============================================================
        async function verifyToken() {
            // 检查 Supabase 是否初始化成功
            if (!initSuccess || !supabaseClient) {
                setStatus('❌ 系统初始化失败，请刷新重试', 'invalid');
                showDebug(initError || 'Supabase 客户端未初始化');
                return;
            }

            var token = getAccessTokenFromURL();

            if (!token) {
                setStatus('❌ 无效的重置链接，请重新申请', 'invalid');
                showDebug('未找到 access_token');
                return;
            }

            showDebug('token 已获取，长度: ' + token.length);

            try {
                // 用 token 获取用户信息
                var { data, error } = await supabaseClient.auth.getUser(token);

                if (error) {
                    console.error('验证失败:', error);
                    setStatus('❌ 链接已过期或无效，请重新申请', 'invalid');
                    showDebug('验证错误: ' + error.message);
                    return;
                }

                if (!data || !data.user) {
                    setStatus('❌ 无法获取用户信息，请重新申请', 'invalid');
                    showDebug('用户数据为空');
                    return;
                }

                var email = data.user.email || '用户';
                setStatus('✅ 验证通过！请为 ' + email + ' 设置新密码', 'valid');
                document.getElementById('resetFormContainer').style.display = 'block';
                window._resetToken = token;

                showDebug('✅ 验证成功，用户: ' + email);

            } catch (error) {
                console.error('验证异常:', error);
                setStatus('❌ 验证失败，请重新申请', 'invalid');
                showDebug('异常: ' + error.message);
            }
        }

        // ============================================================
        //  ✅ 提交新密码 - 无需登录
        // ============================================================
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!initSuccess || !supabaseClient) {
                showMessage('系统初始化失败，请刷新重试', 'error');
                return;
            }

            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var btn = document.getElementById('resetBtn');

            if (newPassword.length < 6) {
                showMessage('❌ 密码至少6位', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('❌ 两次密码不一致', 'error');
                return;
            }

            var token = window._resetToken;
            if (!token) {
                showMessage('❌ 链接已失效，请重新申请', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ 更新中...';
            showMessage('⏳ 正在更新密码...', 'loading');

            try {
                // ✅ 用 token 更新密码
                var { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                }, {
                    headers: {
                        Authorization: 'Bearer ' + token
                    }
                });

                if (error) {
                    throw new Error(error.message);
                }

                showMessage('✅ 密码重置成功！请用新密码登录', 'success');
                document.getElementById('resetFormContainer').style.display = 'none';
                setStatus('✅ 密码已重置，即将跳转登录...', 'valid');

                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2500);

            } catch (error) {
                console.error('重置失败:', error);
                showMessage('❌ ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '✅ 确认重置';
            }
        });

        // ============================================================
        //  🚀 启动
        // ============================================================
        verifyToken();
        console.log('🔑 重置确认页面已加载');
    </script>
</body>
</html>
