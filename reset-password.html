<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - BusLens</title>
    <script>
        var SUPABASE_URL = 'https://keeybzxxkjxvlvhjjdpr.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_SpzHfgcLn0deJWoqEPJQ4g_2jzyXXci';
    </script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ... 样式同上 ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1117, #161b22);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .logo {
            font-size: 48px;
            text-align: center;
            display: block;
            margin-bottom: 8px;
        }
        h1 {
            color: #e6edf3;
            text-align: center;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .sub {
            color: #666;
            text-align: center;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.04);
            color: #e6edf3;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #1a73e8;
        }
        .form-group input::placeholder {
            color: #444;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .message.error {
            display: block;
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.2);
        }
        .message.success {
            display: block;
            background: rgba(76, 175, 80, 0.15);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }
        .message.loading {
            display: block;
            background: rgba(26, 115, 232, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(26, 115, 232, 0.2);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #666;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover {
            color: #58a6ff;
        }
        .welcome-box {
            background: rgba(255, 152, 0, 0.1);
            border-left: 4px solid #ff9800;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #ff9800;
            line-height: 1.6;
        }
        .welcome-box strong {
            color: #fff;
        }
        .debug-info {
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            font-size: 12px;
            color: #555;
            font-family: monospace;
            word-break: break-all;
            display: none;
        }
        .debug-info.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="logo">🔑</span>
        <h1>重置密码</h1>
        <div class="sub">输入邮箱，我们将发送重置链接</div>

        <div class="welcome-box">
            💡 输入你注册时绑定的邮箱<br>
            如果收件箱没有，请检查 <strong>垃圾邮件</strong>
        </div>

        <div class="message" id="message"></div>

        <form id="resetForm">
            <div class="form-group">
                <input type="email" id="email" placeholder="📧 请输入邮箱地址" required>
            </div>
            <button type="submit" class="btn" id="resetBtn">📧 发送重置邮件</button>
        </form>

        <a href="login.html" class="back-link">← 返回登录</a>

        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        var supabaseClient = null;

        function initSupabase() {
            if (typeof supabase === 'undefined') {
                console.error('Supabase SDK 未加载');
                return false;
            }
            if (!SUPABASE_URL || !SUPABASE_KEY) {
                console.error('配置未定义');
                return false;
            }
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('Supabase 初始化成功');
                return true;
            } catch (e) {
                console.error('Supabase 初始化失败:', e);
                return false;
            }
        }
        var initSuccess = initSupabase();

        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        function showDebug(msg) {
            var el = document.getElementById('debugInfo');
            if (el) {
                el.textContent = '🔍 ' + msg;
                el.className = 'debug-info show';
            }
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!initSuccess || !supabaseClient) {
                showMessage('系统初始化失败，请刷新重试', 'error');
                return;
            }

            var email = document.getElementById('email').value.trim();
            var btn = document.getElementById('resetBtn');

            if (!email) {
                showMessage('请输入邮箱地址', 'error');
                return;
            }

            if (!email.includes('@')) {
                showMessage('请输入有效的邮箱地址', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '发送中...';
            showMessage('正在发送重置邮件...', 'loading');

            try {
                var { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-confirm.html'
                });

                if (error) {
                    throw new Error(error.message);
                }

                showMessage('✅ 重置邮件已发送！请检查邮箱（包括垃圾箱）', 'success');
                btn.textContent = '✅ 已发送';

                setTimeout(function() {
                    btn.disabled = false;
                    btn.textContent = '📧 发送重置邮件';
                }, 3000);

            } catch (error) {
                console.error('发送失败:', error);
                showMessage('❌ ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '📧 发送重置邮件';
            }
        });

        console.log('🔑 重置密码页面已加载');
    </script>
</body>
</html>
