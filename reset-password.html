    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0fe 0%, #f0f2f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(26, 115, 232, 0.15);
        }
        .logo { font-size: 48px; display: block; text-align: center; margin-bottom: 8px; }
        h1 { font-size: 24px; color: #1a73e8; text-align: center; margin-bottom: 4px; }
        p.sub { color: #888; font-size: 14px; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #333; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;

            width: 100%;
            padding: 14px;

            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .message { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; display: none; }
        .message.error { display: block; background: #fee8e8; color: #d32f2f; border: 1px solid #f3c4c4; }
        .message.success { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #cce8d0; }
        .message.loading { display: block; background: #e8f0fe; color: #1a73e8; border: 1px solid #c7dafd; }
        .message.warning { display: block; background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #999; font-size: 13px; text-decoration: none; }

</head>
<body>
    <div class="container">
        <span class="logo">🔑</span>
        <h1>重置密码</h1>
        <p class="sub">输入邮箱，我们将发送重置链接</p>

        <div class="welcome-box">
            💡 如果你是用旧账号（用户名+密码）登录的，<br>
            请先登录后系统会自动升级，再使用重置功能。
        </div>

        <div class="message" id="message"></div>

        <form id="resetForm">
            <div class="form-group">
                <label>📧 邮箱</label>
                <input type="email" id="email" placeholder="请输入你的邮箱" required>
            </div>
            <button type="submit" class="btn" id="resetBtn">发送重置邮件</button>
        </form>

        <a href="login.html" class="back-link">← 返回登录</a>
    </div>

    <script>
        // ============================================================
        //  UI 工具函数
        // ============================================================
        function showMessage(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        function setButtonLoading(isLoading) {
            var btn = document.getElementById('resetBtn');
            if (!btn) return;
            btn.disabled = !!isLoading;
            btn.textContent = isLoading ? '⏳ 发送中...' : '发送重置邮件';
        }

        // ============================================================
        //  重置密码函数
        // ============================================================
        async function handleResetPassword(email) {
            console.log('🔑 发送重置邮件:', email);

            var response = await fetch(
                'https://keeybzxxkjxvlvhjjdpr.supabase.co/functions/v1/reset-password',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                }
            );

            var rawText = await response.text();
            console.log('📦 服务器响应:', rawText);

            var result;
            try {
                result = JSON.parse(rawText);
            } catch (parseError) {
                throw new Error('服务器返回了无效数据，请稍后重试');
            }

            if (!response.ok || !result.success) {
                if (result.need_migrate) {
                    throw new Error('旧账号请先登录，系统将自动升级后再重置密码');
                }
                throw new Error(result.error || '发送失败');
            }

            return result;
        }

        // ============================================================
        //  表单提交
        // ============================================================
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var email = document.getElementById('email').value.trim();
            var btn = document.getElementById('resetBtn');

            if (!email) {
                showMessage('❌ 请输入邮箱地址', 'error');
                return;
            }

            if (!email.includes('@')) {
                showMessage('❌ 请输入有效的邮箱地址', 'error');
                return;
            }

            setButtonLoading(true);
            showMessage('⏳ 正在发送重置邮件...', 'loading');

            try {
                var result = await handleResetPassword(email);

                showMessage('✅ 重置邮件已发送！请检查邮箱（包括垃圾箱）', 'success');
                btn.textContent = '✅ 已发送';

                // 按钮恢复（但保持禁用）
                setTimeout(function() {
                    btn.disabled = false;
                    btn.textContent = '发送重置邮件';
                }, 3000);

            } catch (error) {
                console.error('❌ 发送失败:', error);
                showMessage('❌ ' + error.message, 'error');
                setButtonLoading(false);
            }
        });

        console.log('🚀 重置密码页面已加载');
    </script>
</body>
</html>
